<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>CBD South Growth Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control-room wall. The 3D precinct fills the centre; inputs dock left, results dock right. One deliberate dark look for both views. */
:root{
  color-scheme:dark;
  --bg:#0A1220; --panel:#0F1B2E; --panel-2:#14233A; --line:#213754; --ink:#DCE7F5; --muted:#8196B0;
  --chrome:#59C2F5; --a:#A78BFA; --b:#F2B33D; --park:#49A96B; --hot:#FF6B6B; --cool:#4DABF7; --warn:#F2D36B;
  --display:"Archivo","Arial Narrow","PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif;
  --body:"IBM Plex Sans","PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","PingFang SC","Microsoft YaHei",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chrome)}
h3{font-size:14px;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:clamp(18px,2.4vw,24px);font-weight:800;font-stretch:88%;line-height:1.1}
.brand span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav .seg a{display:block;padding:6px 12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.nav .seg a+a{border-left:0}
.nav .seg a[aria-current="page"]{background:var(--chrome);border-color:var(--chrome);color:var(--bg)}
.seg{display:flex}

button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:5px 10px;cursor:pointer;border-radius:2px}
button:hover:not(:disabled){border-color:var(--chrome)}
button:disabled{opacity:.4;cursor:not-allowed}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--chrome);outline-offset:2px}
a{color:var(--chrome)}

/* ---- big screen ---- */
#screen{min-height:0;overflow:auto;display:grid;grid-template-columns:290px minmax(0,1fr) 360px;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact b{display:block;font-family:var(--display);font-size:22px;font-stretch:88%;line-height:1.1;font-variant-numeric:tabular-nums}
.presets,.opts,.tools{display:flex;flex-wrap:wrap;gap:6px}
.slider{display:flex;flex-direction:column;gap:2px}
.slider-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.slider output{font-family:var(--mono);font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--chrome);margin:0}
.seg button{flex:1;border-radius:0} .seg button+button{border-left:0}

.viewport{position:relative;min-height:0;min-width:0;border:1px solid var(--line);overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.ov>*{pointer-events:auto}
.ov.top{top:10px;left:10px;right:10px;justify-content:space-between}
.ov.bottom{bottom:10px;left:10px;right:10px}
.tabs button{border-radius:0;font-family:var(--display);font-weight:700}
.tabs button+button{border-left:0}
.tabs .ta[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:var(--bg)}
.tabs .tb[aria-pressed="true"]{background:var(--b);border-color:var(--b);color:var(--bg)}
.site-panel{background:rgba(15,27,46,.92);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:560px}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;text-shadow:0 0 4px var(--bg),0 0 4px var(--bg)}
.badge{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;padding:0;border-radius:50%;font-family:var(--mono);font-size:12px;font-weight:600;background:var(--panel);border:1.5px solid var(--ink);pointer-events:auto}
.badge[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:0 0 0 3px rgba(89,194,245,.5)}
.glfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

.fitrow{display:flex;flex-direction:column;gap:4px;--c:var(--a)} .fitrow.b{--c:var(--b)}
.fitrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c);font-size:13px}
.fit-num{font-family:var(--display);font-weight:800;font-size:26px;font-stretch:85%;line-height:1;font-variant-numeric:tabular-nums}
.track,.rtrack{position:relative;background:var(--panel-2);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:25% 100%}
.track{height:12px} .track .bar{position:absolute;top:2px;bottom:2px;background:var(--c);transition:left .25s,width .25s}
.verdict{border-left:3px solid var(--chrome);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.verdict strong{font-family:var(--display);font-size:15px}
.irow{display:flex;flex-direction:column;gap:5px;padding-top:10px;border-top:1px solid var(--line)}
.irow:first-child{border-top:0;padding-top:0}
.ihead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rtrack{height:30px}
.rtrack .bar{position:absolute;height:9px;min-width:3px;transition:left .25s,width .25s}
.rtrack .bar.a{top:4px;background:var(--a)} .rtrack .bar.b{top:17px;background:var(--b)}
.rtrack .zero{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--ink)}
@media (prefers-reduced-motion:reduce){.bar{transition:none!important}}
.ivals{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.ivals .a{color:var(--a)} .ivals .b{color:var(--b)}
.pill{font-size:10px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border:1.5px solid var(--ink);white-space:nowrap}
.pill.controls{background:var(--ink);color:var(--bg)}
.pill.advocate{border-style:dashed}
.pill.dummy{border:1px dotted var(--warn);color:var(--warn)}
.pill.obsd{border:1px solid var(--park);color:var(--park)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
#ai-out{width:100%;font:inherit;line-height:1.55;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:8px 10px;resize:vertical;border-radius:2px}
#ai-out[readonly]{border-style:dashed}

/* ---- evidence view ---- */
#evidence{min-height:0;overflow:auto}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.wrap section{display:flex;flex-direction:column;gap:12px}
.wrap h2{font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink);font-stretch:92%}
.lede{max-width:65ch;color:var(--muted);font-size:15px}
.notice{border:1px solid var(--warn);background:rgba(242,211,107,.08);padding:10px 14px;max-width:86ch}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel.a{border-top:3px solid var(--a)} .panel.b{border-top:3px solid var(--b)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.items li{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.obs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ob q{font-size:15px;quotes:"\201C" "\201D"}
.ob .stat{border-top:1px dashed var(--line);padding-top:8px;font-size:12px;color:var(--muted)}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:6px 8px;border-radius:2px}
form .grow{flex:1 1 240px} form .grow input{width:100%}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}

@media (max-width:1100px){
  #screen{display:flex;flex-direction:column}
  .col{overflow:visible;flex:none}
  .viewport{order:-1;flex:none;height:min(72vh,560px);min-height:360px}
}
@media (max-width:620px){ .two{grid-template-columns:minmax(0,1fr)} }
</style>

<div id="app">
  <div class="topbar">
    <div class="brand"><h1 data-t="title"></h1><span data-t="sub"></span></div>
    <div class="nav">
      <div class="seg"><a href="#screen" id="nav-screen" data-t="nav.screen"></a><a href="#evidence" id="nav-evidence" data-t="nav.evidence"></a></div>
      <button type="button" id="lang" aria-label="Switch language / 切换语言"></button>
    </div>
  </div>

  <main id="screen">
    <div class="col">
      <div class="panel">
        <div class="panel-head"><h2 data-t="today"></h2><span class="pill obsd" data-t="observed"></span></div>
        <div class="facts" id="facts"></div>
        <div class="small muted" id="facts-src"></div>
      </div>
      <div class="panel">
        <h2 data-t="pri"></h2>
        <p class="small muted" data-t="pri.hint"></p>
        <div class="presets" id="presets"></div>
        <div id="sliders" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
      <div class="panel">
        <h2 data-t="canopy"></h2>
        <div class="seg" id="canopy"><button type="button" data-c="young" data-t="canopy.young"></button><button type="button" data-c="mature" data-t="canopy.mature"></button></div>
        <p class="small muted" id="canopy-note"></p>
      </div>
    </div>

    <div class="viewport" id="viewport">
      <canvas id="gl"></canvas>
      <div id="labels"></div>
      <div class="ov top">
        <div class="seg tabs" id="tabs"><button type="button" class="ta" data-s="A" data-t="edit.a"></button><button type="button" class="tb" data-s="B" data-t="edit.b"></button></div>
        <div class="tools">
          <button type="button" id="heat" data-t="tool.heat"></button>
          <button type="button" id="spin" data-t="tool.spin"></button>
          <button type="button" id="home" data-t="tool.home"></button>
          <button type="button" id="reset" data-t="tool.reset"></button>
        </div>
      </div>
      <div class="ov bottom"><div class="site-panel" id="site-panel"></div></div>
    </div>

    <div class="col">
      <div class="panel">
        <h2 data-t="fit"></h2>
        <div class="fitrow a"><div class="top"><span class="tag" data-t="opt.a"></span><span class="fit-num" id="fitA"></span></div><div class="track"><div class="bar" id="fitbarA"></div></div><div class="small muted" id="sumA"></div></div>
        <div class="fitrow b"><div class="top"><span class="tag" data-t="opt.b"></span><span class="fit-num" id="fitB"></span></div><div class="track"><div class="bar" id="fitbarB"></div></div><div class="small muted" id="sumB"></div></div>
        <div class="verdict" id="verdict" aria-live="polite"></div>
      </div>
      <div class="panel" id="ai-panel">
        <div class="panel-head"><h2 data-t="ai.title"></h2><span class="pill" id="ai-pill" hidden></span></div>
        <p class="small muted" data-t="ai.hint"></p>
        <textarea id="ai-out" rows="8" hidden></textarea>
        <div class="small muted" id="ai-note"></div>
        <div class="opts"><button type="button" id="ai-go" hidden></button><button type="button" id="ai-stop" hidden data-t="ai.stop"></button><button type="button" id="ai-approve" hidden data-t="ai.approve"></button><button type="button" id="ai-discard" hidden data-t="ai.discard"></button></div>
      </div>
      <div class="panel">
        <h2 data-t="changes"></h2>
        <p class="small muted" data-t="changes.hint"></p>
        <div id="rows"></div>
        <div class="legend"><span class="pill controls" data-t="resp.controls"></span><span class="pill shared" data-t="resp.shared"></span><span class="pill advocate" data-t="resp.advocate"></span></div>
      </div>
      <div class="panel"><div class="pills"><span class="pill dummy" data-t="dummy"></span></div><p class="small muted" data-t="screen.notice"></p></div>
    </div>
  </main>

  <main id="evidence" hidden>
    <div class="wrap">
      <section>
        <h2 data-t="ev.title"></h2>
        <p class="lede" data-t="ev.lede"></p>
        <p class="notice" data-t="ev.notice"></p>
      </section>
      <section>
        <h2 data-t="res.title"></h2>
        <p class="lede" data-t="res.lede"></p>
        <div class="two">
          <div class="panel a"><h3 data-t="res.a"></h3><ul class="items" id="resA"></ul></div>
          <div class="panel b"><h3 data-t="res.b"></h3><ul class="items" id="resB"></ul></div>
        </div>
      </section>
      <section>
        <h2 data-t="obs.title"></h2>
        <p class="lede" data-t="obs.lede"></p>
        <div class="obs" id="obs"></div>
        <form id="obs-form">
          <label><span data-t="obs.topic"></span><select id="obs-topic"></select></label>
          <label class="grow"><span data-t="obs.what"></span><input type="text" id="obs-text" maxlength="200"></label>
          <button type="submit" data-t="obs.add"></button>
        </form>
        <p class="small muted" data-t="obs.note"></p>
      </section>
      <section>
        <h2 data-t="reg.title"></h2>
        <div class="tablewrap"><table><thead><tr id="reg-head"></tr></thead><tbody id="register"></tbody></table></div>
        <p class="small muted" data-t="method"></p>
      </section>
    </div>
  </main>
</div>

function residual(k, r){

  if (r.heat[1] > 0.04) out.push(['controls', t('r.heat', fmt(hi, r.heat[1]))]);

buildStatic(); render(); route();
addEventListener('hashchange', route);
$('lang').addEventListener('click', () => { lang = lang === 'en' ? 'zh' : 'en'; try { localStorage.setItem('cbd-lang', lang); } catch (e) {} buildStatic(); render(); });
$('sliders').addEventListener('input', e => { weights[e.target.id.slice(2)] = +e.target.value; activePreset = -1; render(); });
$('presets').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; activePreset = +b.dataset.p; weights = {...PRESET_W[activePreset]}; render(); });
$('canopy').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; canopy = b.dataset.c; render(); });
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; active = b.dataset.s; render(); });
$('site-panel').addEventListener('click', e => { const b = e.target.closest('button[data-opt]'); if (!b || b.disabled) return; scen[active][selected] = b.dataset.opt; render(); });
$('heat').addEventListener('click', () => { view.heat = !view.heat; render(); });
$('spin').addEventListener('click', () => { view.spin = !view.spin; render(); });
$('home').addEventListener('click', () => { if (G.ok) G.home(); });
$('reset').addEventListener('click', () => { scen[active] = defaults()[active]; render(); });
$('obs-form').addEventListener('submit', e => { e.preventDefault(); const x = $('obs-text').value.trim(); if (!x) { $('obs-text').focus(); return; } userObs.push([+$('obs-topic').value, x]); $('obs-text').value = ''; buildStatic(); render(); });
</script>
</body></html>
