<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicAlign Woodhouse Square</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — top bar, step rail, one screen at a time; source drawer slides over on the right */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#e8efea; --fg:#15201b; --muted:#56645d; --line:#d2ddd6;
  --accent:#1f6b57; --accent-2:#2f8a70; --accent-soft:#d6ebe2; --on-accent:#ffffff;
  --base:#9aa8a1; --fact:#1f6b57; --fact-bg:#dcefe6; --infer:#93580a; --infer-bg:#fbecd2;
  --design:#2c5aa0; --design-bg:#dfe8f7; --gap:#b23a3a; --gap-bg:#f8dfdf;
  --map-bld:#cfd8d3; --map-road:#ffffff; --map-road-edge:#c3cec8; --map-green:#cfe6c9; --map-rail:#6d7a74;
  --f-display:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161f1b; --surface-2:#1d2925; --fg:#e3ebe7; --muted:#9aaba3; --line:#2b3a33;
  --accent:#6cc3a6; --accent-2:#86d4ba; --accent-soft:#1e3a30; --on-accent:#0c1411;
  --base:#5f6e67; --fact:#7fd0b2; --fact-bg:#1c3a2f; --infer:#f0b257; --infer-bg:#3a2c14; --design:#8fb3f0; --design-bg:#1d2a44; --gap:#f08a8a; --gap-bg:#3d1f1f;
  --map-bld:#2c3934; --map-road:#3a4943; --map-road-edge:#2b3833; --map-green:#24402e; --map-rail:#8b9a93;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161f1b; --surface-2:#1d2925; --fg:#e3ebe7; --muted:#9aaba3; --line:#2b3a33;
  --accent:#6cc3a6; --accent-2:#86d4ba; --accent-soft:#1e3a30; --on-accent:#0c1411;
  --base:#5f6e67; --fact:#7fd0b2; --fact-bg:#1c3a2f; --infer:#f0b257; --infer-bg:#3a2c14; --design:#8fb3f0; --design-bg:#1d2a44; --gap:#f08a8a; --gap-bg:#3d1f1f;
  --map-bld:#2c3934; --map-road:#3a4943; --map-road-edge:#2b3833; --map-green:#24402e; --map-rail:#8b9a93;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* top bar */
.bar{background:#11332a;color:#eef5f1;border-bottom:1px solid #0b241d}
.bar .brand span{color:#a9c2b8}
.bar .seg{background:#173f34;border-color:#2a5a4c}
.bar .seg button{color:#dbe9e3}
.bar .seg button[aria-pressed="true"]{background:#3fae8c;color:#06241b}
.bar .logo{background:#3fae8c;color:#06241b}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 300px}
.logo{flex:0 0 36px;height:36px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.2}
.brand span{font-size:12.5px;color:var(--muted);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.notice{background:var(--infer-bg);color:var(--fg);font-size:13px}
.notice .wrap{padding-block:7px}
.notice b{color:var(--infer)}
/* steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;padding-block:14px 4px;list-style:none;margin:0;padding-left:0}
.steps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:13.5px}
.steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-mono);font-size:12px}
.steps button[aria-current="step"]{border-color:var(--accent)}
.steps button[aria-current="step"] .n{background:var(--accent);color:var(--on-accent)}
.steps .part{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
main{padding-block:12px 40px}
h1{font-family:var(--f-display);font-size:clamp(22px,3.6vw,30px);line-height:1.25;margin:4px 0 6px;text-wrap:balance}
h2{font-family:var(--f-display);font-size:19px;margin:0 0 6px;text-wrap:balance}
h3{font-size:15.5px;margin:0 0 4px}
p{margin:0 0 8px}
.lede{color:var(--muted);max-width:70ch;margin-bottom:16px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:11.5px;line-height:1.5;border-radius:4px;padding:0 6px;font-weight:500;white-space:nowrap;vertical-align:1px}
.t-fact{background:var(--fact-bg);color:var(--fact)} .t-infer{background:var(--infer-bg);color:var(--infer)}
.t-design{background:var(--design-bg);color:var(--design)} .t-gap{background:var(--gap-bg);color:var(--gap)}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:4px;padding:0 6px;white-space:nowrap;line-height:1.6}
.src:hover{text-decoration:underline}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;text-align:left;min-width:0}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice button small{display:block;color:var(--muted);font-size:12px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:90px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* claims */
.deliv{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.deliv .card h2{display:flex;gap:8px;align-items:baseline}
.deliv .num{font-family:var(--f-mono);color:var(--accent);font-size:13px}
.intro{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.kind{font-size:12px;font-weight:500;color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--f-mono)}
ul.claims{list-style:none;margin:0;padding:0}
ul.claims li{padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
ul.claims li:last-child{border-bottom:0}
.react{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.react button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:13px}
.react button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.react input{flex:1 1 160px;font-size:13px;padding:4px 8px}
/* map */
.mapcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.mapcard{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 9px 14px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-6px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:4px}
/* allocation */
.alloc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.alloc{grid-template-columns:1fr}}
.grp{margin-bottom:12px}
.grp h3{display:flex;justify-content:space-between;gap:8px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) 120px 72px;gap:8px;align-items:center;padding:5px 0}
@media (max-width:480px){.mod{grid-template-columns:minmax(0,1fr) 72px}.mod input[type=range]{grid-column:1/-1;order:3}}
.mod .nm{font-size:13.5px;min-width:0}
.mod .nm small{display:block;color:var(--muted);font-size:11.5px}
.mod input[type=range]{width:100%;accent-color:var(--accent)}
.mod output{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.total{position:sticky;top:8px;z-index:2}
.meter{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
.meter span{display:block;height:100%}
.okbad{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.warn{color:var(--gap);font-size:13px}
.plan{width:100%;aspect-ratio:3/2;max-width:100%;display:block;border-radius:8px;background:var(--surface-2)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px}
/* studio */
.studio{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:880px){.studio{grid-template-columns:1fr}}
.viz{position:sticky;top:8px}
@media (max-width:880px){.viz{position:static}}
.presets2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 8px}
.pz{border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:12.5px;font-weight:500;background:var(--surface);text-align:center;line-height:1.3}
.pz-base{background:var(--surface-2)} .pz-green{background:#e2f2e3;border-color:#a9d3ae;color:#245a2c} .pz-night{background:#fbeedb;border-color:#e6c08a;color:#7a4a0c}
:root[data-theme="dark"] .pz-green{background:#1f3a25;color:#bfe5c4;border-color:#2f5a37} :root[data-theme="dark"] .pz-night{background:#3a2c14;color:#f2cf98;border-color:#5a4422}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pz-green{background:#1f3a25;color:#bfe5c4;border-color:#2f5a37} :root:not([data-theme="light"]) .pz-night{background:#3a2c14;color:#f2cf98;border-color:#5a4422}}
.gcards{display:grid;gap:10px}
.gcard{border:1px solid color-mix(in srgb,var(--gc) 45%,var(--line));background:color-mix(in srgb,var(--gc) 9%,var(--surface));border-radius:10px;padding:10px 12px}
.gtop{display:flex;align-items:center;gap:10px}
.gic{flex:0 0 30px;height:30px;border-radius:8px;background:var(--gc);display:grid;place-items:center}
.gname{flex:1;min-width:0} .gname b{display:block;font-size:15px} .gname small{color:var(--muted);font-size:12px}
.gval{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--gc);font-variant-numeric:tabular-nums}
.gcard input[type=range]{width:100%;accent-color:var(--gc);margin-top:6px}
.gm{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
details.more{margin-top:10px}
.mic{display:inline-block;vertical-align:-3px;margin-right:6px}
.vh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.yrs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.yrs button{border:0;background:var(--surface);padding:4px 10px;font-size:12.5px;font-family:var(--f-mono)}
.yrs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.abar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-bottom:8px}
.abar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;transition:width .2s}
.plaza{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kh{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted)}
.kv{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kv small{font-size:12px;font-weight:500;color:var(--muted)}
.kd{font-size:12.5px} .kn{font-size:12px;color:var(--muted);margin-top:2px}
/* results */
.res{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.res{grid-template-columns:1fr}}
.res:last-child{border-bottom:0}
.res .dn{font-size:14px;font-weight:500}
.res .dn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.res .dn.pri::after{content:" ★";color:var(--accent)}
.track{position:relative;height:30px}
.track .rng{position:absolute;height:9px;border-radius:5px}
.track .r0{top:3px;background:var(--base)}
.track .r1{top:17px;background:var(--accent)}
.vals{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.45}
.vals .y{color:var(--accent)}
.delta-up{color:var(--fact)} .delta-down{color:var(--gap)}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.fit{font-family:var(--f-display);font-size:26px}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px;margin-top:12px}
summary{cursor:pointer;font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
/* roles */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.role .big{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:20;padding:calc(16px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 18px;overflow-y:auto}
.drawer blockquote{margin:10px 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);font-size:14px}
.drawer .x{float:right;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19}
/* council */
.status{font-size:12px;border-radius:4px;padding:0 6px;white-space:nowrap}
.st-ok{background:var(--fact-bg);color:var(--fact)} .st-gap{background:var(--gap-bg);color:var(--gap)}
.pcheck li{margin:4px 0}
.ok{color:var(--fact)} .bad{color:var(--gap)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer .wrap{padding-block:16px 28px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="bar"><div class="wrap">
  <div class="brand"><div class="logo" aria-hidden="true">CA</div><div><b>CivicAlign</b><span id="sub"></span></div></div>
  <div class="seg" role="group" aria-label="View"><button id="vRes" aria-pressed="true"></button><button id="vCouncil" aria-pressed="false"></button></div>
  <div class="seg" role="group" aria-label="Language"><button id="lZh" aria-pressed="true">中文</button><button id="lEn" aria-pressed="false">EN</button></div>
</div></div>
<div class="notice"><div class="wrap" id="notice"></div></div>
<div class="wrap"><ol class="steps" id="steps"></ol></div>
<main class="wrap" id="main"></main>
<footer><div class="wrap" id="foot"></div></footer>

// crown spread multiplier on canopy area, by planting type and year [low, high]
const CROWN = {planter:{2026:[0.2,0.4],2036:[0.8,1.2],2041:[1.0,1.5],2050:[1.2,1.8]}, deep:{2026:[0.2,0.4],2036:[1.2,1.8],2041:[1.6,2.4],2050:[2.0,3.0]}};
// per m² [low, high]
const COEF = {
 restShade:[0.3,0.6],
 storm:{blue:[0.15,0.30],canopy_planter:[0.03,0.06],canopy_deep:[0.05,0.10]},
 econ:{events:[0.5,1.0],rest:[0.15,0.30],culture:[0.1,0.2]},
 walkClear:[0.85,1.0],
 capex:{canopy:[1500,3000],blue:[800,1500],events:[600,1200],culture:[1000,3000],rest:[800,2000],walk:[500,1000],bike:[400,800],kerb:[300,700],smart:[2000,5000],circ:[1000,2500]},
 opex:{canopy:[30,60],blue:[20,40],events:[10,20],culture:[15,40],rest:[15,30],walk:[5,10],bike:[5,10],kerb:[5,10],smart:[40,90],circ:[30,70]},
 carbon:{canopy:[0.10,0.20],blue:[0.05,0.10],events:[0.08,0.15],culture:[0.10,0.25],rest:[0.08,0.18],walk:[0.06,0.12],bike:[0.05,0.10],kerb:[0.08,0.15],smart:[0.15,0.30],circ:[0.08,0.15]}
};
const W = {safety:{events:0.06,smart:0.8,walk:0.05,culture:0.05},incl:{rest:0.25,walk:0.08,shade:0.03,bike:0.2},culture:{culture:0.3,events:0.06,rest:0.1}};

function compute(a, plant, year){
  const out={};
  const cr = CROWN[plant][year];
  const sh = [0,1].map(i=>Math.min(TOTAL, a.canopy*cr[i] + a.rest*COEF.restShade[i]));
  out.shade = sh;
  const cs = plant==="deep"?COEF.storm.canopy_deep:COEF.storm.canopy_planter;
  out.storm = [0,1].map(i=>a.blue*COEF.storm.blue[i] + a.canopy*cs[i]);
  out.econ = [0,1].map(i=>a.events*COEF.econ.events[i]+a.rest*COEF.econ.rest[i]+a.culture*COEF.econ.culture[i]);
  out.access = [0,1].map(i=>100*a.walk*COEF.walkClear[i]/TOTAL);
  const proxy=(w,extra)=>{let s=0;for(const k in w){s+= (k==="shade"?extra:a[k])*w[k];}return s;};
  const sMid=(sh[0]+sh[1])/2;
  out.safety = [0.85,1.15].map(f=>Math.min(100,proxy(W.safety)*f));
  out.incl = [0.85,1.15].map(f=>Math.min(100,proxy(W.incl,sMid)*f));
  out.culture = [0.85,1.15].map(f=>Math.min(100,proxy(W.culture)*f));
  const yrs = year-2026;
  out.cost = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*(COEF.capex[m.id][i]+COEF.opex[m.id][i]*yrs);}return c/1000;});
  out.carbon = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*COEF.carbon[m.id][i];}return c;});
  return out;
}

function mapSVG(){

  let g="";
  g+=MAP.G.filter(x=>inView(x.p)).map(x=>`<polygon points="${pts(x.p)}" fill="var(--map-green)"/>`).join("");
  g+=MAP.R.filter(x=>inView(x.p)).map(x=>`<polyline points="${pts(x.p)}" fill="none" stroke="var(--map-road-edge)" stroke-width="${x.w+2}" stroke-linecap="round" stroke-linejoin="round"/>`).join("");

  g+=MAP.RL.filter(inView).map(p=>`<polyline points="${pts(p)}" fill="none" stroke="var(--map-rail)" stroke-width="2" stroke-dasharray="6 3"/>`).join("");

  g+=`<polygon points="${pts(MAP.P)}" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5 4"/>`;

const GDESC={green:{zh:"降温、遮荫、留住雨水",en:"Cooling, shade, holding rain"},active:{zh:"唐人街夜市、活动、停留",en:"Night markets, events, places to stay"},move:{zh:"穿行、无障碍、接驳",en:"Getting through, access, drop-off"},smart:{zh:"夜间照明、回收",en:"Night lighting, recycling"}};
const r10=v=>Math.round(v/10)*10;
function normalise(){ // keep the total at exactly 1,200 m² after rounding
  let d=TOTAL-sum(S.a); if(!d) return;
  const ids=MODULES.map(m=>m.id).sort((x,y)=>S.a[y]-S.a[x]);
  for(const id of ids){ const nv=Math.max(0,S.a[id]+d); d-=nv-S.a[id]; S.a[id]=nv; if(!d) break; }
}
function setModule(id,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const others=MODULES.filter(m=>m.id!==id), rest=others.reduce((s,m)=>s+S.a[m.id],0), target=TOTAL-v;
  others.forEach(m=>{S.a[m.id]= rest>0 ? r10(S.a[m.id]*target/rest) : r10(target/others.length);});
  S.a[id]=v; normalise();
}
function setGroup(g,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const inG=MODULES.filter(m=>m.g===g), outG=MODULES.filter(m=>m.g!==g);
  const gt=inG.reduce((s,m)=>s+S.a[m.id],0), ot=outG.reduce((s,m)=>s+S.a[m.id],0);
  inG.forEach(m=>{S.a[m.id]= gt>0 ? r10(S.a[m.id]*v/gt) : r10(v/inG.length);});
  outG.forEach(m=>{S.a[m.id]= ot>0 ? r10(S.a[m.id]*(TOTAL-v)/ot) : r10((TOTAL-v)/outG.length);});
  normalise();
}
const gsum=g=>MODULES.filter(m=>m.g===g).reduce((s,m)=>s+S.a[m.id],0);
const pct=v=>Math.round(100*v/TOTAL);

  g+=`<path d="M4 ${Y+H/2-26} h44" stroke="var(--accent)" stroke-width="12" stroke-opacity=".25"/><text x="26" y="${Y+H/2-30}" text-anchor="middle" font-size="8.5" font-weight="600" fill="var(--accent)">Rivoli Way</text>`;

}

  return `<div class="eyebrow">② ${L("换一种分法会怎样","What if it were shared differently")} · 4/5</div>
  <h1>${L("你的分法和总规原样比，会有什么不同？","How does your split compare with the plan as drawn?")}</h1>
  <p class="lede">${L("结果都是区间，不是预测。所有系数都是团队假设，可以在下面逐个查看。","Every result is a range, not a forecast. All coefficients are team assumptions, listed below.")} <span class="tag t-design">${L("假设","Assumption")}</span></p>
  <div class="grid g3" style="margin-bottom:12px">
    <div class="card"><b class="small">${L("和你的 3 个优先项的契合度","Fit with your 3 priorities")}</b><div class="fit ${fit>0?"delta-up":fit<0?"delta-down":""}">${fit>0?"+":""}${fit}%</div><p class="small muted">${L("相对方案 0，★ 项权重 ×3。","Relative to Scenario 0; ★ items weigh ×3.")}</p></div>
    <div class="card"><b class="small">${L("看哪一年","Year")}</b><div class="choice" style="margin-top:6px">${[2026,2036,2041,2050].map(y=>`<button data-year="${y}" aria-pressed="${S.year===y}">${y}<small>${y===2041?L("总规 15 年期限","Plan's 15-year horizon"):y===2050?L("战略目标年","Strategy target year"):y===2026?L("刚建成","At opening"):"&nbsp;"}</small></button>`).join("")}</div><p class="small muted">${L("树冠随年份长大，维护费逐年累加","Tree crowns grow and upkeep adds up over time")} ${chip("S2","p.54")}</p></div>
    <div class="card"><b class="small">${L("种树方式","Planting")}</b><p style="margin:4px 0 0">${S.plant==="planter"?L("抬高种植池","Raised planters"):L("深土种植","Deep soil")}</p><p class="small muted">${L("方案 0 按种植池计算。深土是否可行待核实。","Scenario 0 assumes planters. Whether deep soil is possible is unconfirmed.")}</p></div>
  </div>
  <div class="card"><div class="keyrow"><span><i class="sw" style="background:var(--base)"></i>${L("方案 0：总规原样","Scenario 0: plan as drawn")}</span><span><i class="sw" style="background:var(--accent)"></i>${L("你的方案","Your split")}</span><span>★ ${L("你的优先项","Your priority")}</span></div>${rows}</div>
  <details><summary>${L("查看全部系数（90 个假设值）","See every coefficient (team assumptions)")}</summary>${coefTable()}</details>
  <div class="nav"><button class="btn" data-go="3">${L("上一步：再调整","Back: adjust")}</button><button class="btn primary" data-go="5">${L("下一步：谁说了算","Next: who decides")}</button></div>`;
}
function coefTable(){
  const r=(k,o)=>o?`${o[0]}–${o[1]}`:"—";
  return `<p class="small muted">${L("每个值都是团队假设，标注“待文献核实”。下一版会逐个替换为有出处的数值。","Every value is a team assumption marked “to be checked against literature”. The next version replaces each with a cited value.")}</p>
  <div class="scroll"><table><thead><tr><th>${L("用途","Use")}</th><th>${L("建设 $/m²","Build $/m²")}</th><th>${L("维护 $/m²/年","Upkeep $/m²/yr")}</th><th>${L("隐含碳 t/m²","Carbon t/m²")}</th><th>${L("其他","Other")}</th></tr></thead><tbody>
  ${MODULES.map(m=>`<tr><td>${T(m)}</td><td class="n">${r(0,COEF.capex[m.id])}</td><td class="n">${r(0,COEF.opex[m.id])}</td><td class="n">${r(0,COEF.carbon[m.id])}</td><td class="small">${
    m.id==="canopy"?L(`树冠倍数 种植池 ${JSON.stringify(CROWN.planter)}；深土 ${JSON.stringify(CROWN.deep)}；雨水 ${COEF.storm.canopy_planter.join("–")} / ${COEF.storm.canopy_deep.join("–")} m³/m²`,`Crown factor planter ${JSON.stringify(CROWN.planter)}; deep ${JSON.stringify(CROWN.deep)}; storm ${COEF.storm.canopy_planter.join("–")} / ${COEF.storm.canopy_deep.join("–")} m³/m²`)
    :m.id==="blue"?L(`雨水 ${COEF.storm.blue.join("–")} m³/m²`,`Storm ${COEF.storm.blue.join("–")} m³/m²`)
    :m.id==="events"?L(`容量 ${COEF.econ.events.join("–")} 人/m²`,`Capacity ${COEF.econ.events.join("–")} people/m²`)
    :m.id==="rest"?L(`容量 ${COEF.econ.rest.join("–")} 人/m²；遮荫 ${COEF.restShade.join("–")}`,`Capacity ${COEF.econ.rest.join("–")} people/m²; shade ${COEF.restShade.join("–")}`)
    :m.id==="culture"?L(`容量 ${COEF.econ.culture.join("–")} 人/m²`,`Capacity ${COEF.econ.culture.join("–")} people/m²`)
    :m.id==="walk"?L(`畅通系数 ${COEF.walkClear.join("–")}`,`Clear factor ${COEF.walkClear.join("–")}`):"—"}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="small muted" style="margin-top:6px">${L("代理指标权重：","Proxy weights: ")}${esc(JSON.stringify(W))}</p>`;
}

  const adv=CLAIMS.filter(c=>["tr6","tr7","ct6","ct7","sq10"].includes(c.id));
  const subs=store.get("ca_subs")||[];
  return `<div class="eyebrow">③ ${L("你怎么看、谁负责","Your view and who decides")} · 5/5</div>
  <h1>${L("谁来决定、谁来做？","Who decides, and who delivers?")}</h1>
  <p class="lede">${L("按 Council 的 D / P / A 分工：D = Council 自己做，P = 和伙伴一起做，A = 需要向州政府等争取","Using Council's roles: D = Council delivers, P = Council partners, A = Council advocates to others such as the State")} ${chip("S5","p.33")}${L("。",".")}</p>
  <div class="roles">
    <div class="card role"><b class="small">D · ${L("Council 直接负责","Council delivers")}</b><div class="big">${fmt(by.D)} m²</div><p class="small muted">${L("树冠、雨水花园、座椅、步行、路缘、照明","Canopy, rain gardens, seating, walking, kerb, lighting")}</p></div>
    <div class="card role"><b class="small">D+P · ${L("Council 牵头，与伙伴合作","Council leads with partners")}</b><div class="big">${fmt(by["D+P"])} m²</div><p class="small muted">${L("活动和夜市（商户、活动方）、自行车（运营商）、回收（服务商）","Events and markets (traders, organisers), bikes (operators), recycling (providers)")}</p></div>
    <div class="card role"><b class="small">P · ${L("主要靠伙伴","Mainly partners")}</b><div class="big">${fmt(by.P)} m²</div><p class="small muted">${L("文化表达：艺术家、华人社团、First Nations 团体","Cultural expression: artists, Chinese community groups, First Nations groups")}</p></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>${L("不在这块广场能决定的事（需要等待或争取）","Outside the square's control (waiting on others)")}</h2>
   <ul class="claims">${adv.map(x=>`<li>${T(x)} ${chip(x.src,x.pg,x.id)}</li>`).join("")}</ul></div>
  <div class="grid g2" style="margin-top:12px">
   <div class="card"><h2>${L("你的经验","Your experience")}</h2><label class="f" for="exp">${L("你现在在这一带的体验是什么？比如晚上走、等车、带孩子、做生意。","What is it like around here now? Walking at night, waiting for a bus, with kids, running a shop.")}</label><textarea id="exp">${esc(S.exp)}</textarea>
     <label class="f" for="wish" style="margin-top:8px">${L("这个广场怎样才对你有用？","What would make this square work for you?")}</label><textarea id="wish">${esc(S.wish)}</textarea>
     <p class="small muted">${L("请不要写姓名、电话或住址。","Please leave out names, phone numbers and addresses.")}</p></div>
   <div class="card"><h2>${L("提交摘要","Your summary")}</h2>
     <ul class="small">
      <li>${L("身份","Role")}: ${esc(T(ROLES.find(r=>r.id===S.role))||"—")}${S.age?` · ${esc(S.age)}`:""}${S.postcode?` · ${esc(S.postcode)}`:""}</li>
      <li>${L("优先项","Priorities")}: ${S.pri.map(id=>esc(T(DIMS.find(d=>d.id===id)))).join(L("、",", "))||"—"}</li>
      <li>${L("对三项内容的看法","Views on the three items")}: ${CARDS.map(c=>`${esc(T(c))} ${S.react[c.id]?({yes:L("支持","support"),unsure:L("不确定","unsure"),no:L("有顾虑","concerned")})[S.react[c.id]]:"—"}`).join(L("；","; "))}</li>
      <li>${L("分配","Split")}: ${MODULES.filter(m=>S.a[m.id]>0).map(m=>`${esc(T(m))} ${S.a[m.id]}`).join(L("，",", "))} m²</li>
     </ul>
     <button class="btn primary" id="submit">${L("提交（演示）","Submit (demo)")}</button>
     <p class="small muted" id="subMsg" style="margin-top:8px">${subs.length?L(`本浏览器已保存 ${subs.length} 份演示提交，没有发送给 Council。`,`${subs.length} demo submission(s) saved in this browser only. Nothing was sent to Council.`):L("演示版只保存在你的浏览器里，不会发送给任何人。","In this demo your answers stay in your browser and are not sent anywhere.")}</p></div>
  </div>
  <div class="nav"><button class="btn" data-go="4">${L("上一步","Back")}</button><button class="btn" data-view="council">${L("看 Council 后台会收到什么","See what Council would receive")}</button></div>`;
}

/* ---------- Council view ---------- */
function council(){
  const tabs=[["ledger",L("证据核对清单","Evidence ledger")],["gaps",L("证据空白","Evidence gaps")],["check",L("总规原则检查","Plan principles check")],["subs",L("居民提交","Submissions")]];
  let body="";
  if(S.ctab==="ledger"){
    body=`<p class="lede">${L("正式版流程：规划师上传 PDF → AI 逐条提取并附页码原文 → 规划师批准后才进入居民端。本演示里的条目由团队人工整理和核对，<b>不是 Council 批准的</b>。","Full version: a planner uploads a PDF, AI extracts each claim with page and quote, and only planner-approved claims reach residents. In this demo the team extracted and checked the claims by hand; <b>Council has not approved them</b>.")}</p>
    <div class="scroll"><table><thead><tr><th>#</th><th>${L("条目","Claim")}</th><th>${L("来源","Source")}</th><th>${L("原文","Original wording")}</th><th>${L("状态","Status")}</th></tr></thead><tbody>
    ${CLAIMS.map((c,i)=>`<tr><td class="n">${i+1}</td><td>${T(c)}</td><td>${c.src?chip(c.src,c.pg,c.id):"—"}</td><td class="small">${c.q?"“"+esc(c.q)+"”":"—"}</td><td>${c.src?`<span class="status st-ok">${L("团队已核对","Team-checked")}</span>`:`<span class="status st-gap">${L("证据空白","Gap")}</span>`}</td></tr>`).join("")}
    </tbody></table></div>`;
  } else if(S.ctab==="gaps"){
    const gaps=[
      [L("交通影响：还没有交通模型，FY27/28 才聘顾问","Traffic effects: no model yet; consultants in FY27/28"),"S4",""],
      [L("广场面积：1,200 m² 还是 1,300 m²","Square size: 1,200 m² or 1,300 m²"),"S2","p.23"],
      [L("广场下方是否有停车场、能否深土种树","Whether the car park sits under the square, and whether deep soil is possible"),"S2","p.49"],
      [L("各项功能的面积比例","Area for each use"),null,""],
      [L("建设资金来源","Funding sources"),"S2","p.54"],
      [L("公示意见汇总（尚未公开）","Exhibition feedback summary (not yet published)"),"S3",""],
      [L("系数矩阵的文献出处","Literature for each coefficient"),null,""]];
    body=`<p class="lede">${L("这些数字在来源里找不到。原型不会用估算填上，而是列出来交给 Council。","No source gives these figures. The prototype does not fill them with estimates; it lists them for Council.")}</p><div class="card"><ul class="claims">${gaps.map(g=>`<li>${g[0]} ${g[1]?chip(g[1],g[2]):`<span class="tag t-gap">${L("来源里没有","No source")}</span>`}</li>`).join("")}</ul></div>`;
  } else if(S.ctab==="check"){
    const a=S.a, sh=a=>Math.round(100*a/TOTAL);
    const P=[
      ["P1",L("连接更新片区与 CBD 和交通枢纽","Connect renewal areas to the CBD and transport"),a.walk>=180,L(`畅通步行 ${sh(a.walk)}%（≥15%）`,`Clear walking ${sh(a.walk)}% (≥15%)`)],
      ["P2",L("新建社区聚会空间","New spaces for community gathering"),a.events+a.rest>=480,L(`活动 + 休憩 ${sh(a.events+a.rest)}%（≥40%）`,`Events + rest ${sh(a.events+a.rest)}% (≥40%)`)],
      ["P3",L("改善街道与公共空间的连接","Better links between streets and public space"),a.walk>=180,L(`畅通步行 ${sh(a.walk)}%（≥15%）`,`Clear walking ${sh(a.walk)}% (≥15%)`)],
      ["P4",L("让步行和骑行更容易、更安全、更舒适","Easier, safer, more comfortable walking and cycling"),a.walk>=180&&a.canopy>=120,L(`步行 ${sh(a.walk)}%，树冠 ${sh(a.canopy)}%（≥10%）`,`Walking ${sh(a.walk)}%, canopy ${sh(a.canopy)}% (≥10%)`)],
      ["P5",L("唐人街成为文化目的地","Chinatown as a cultural destination"),a.culture>=36&&a.events>=200,L(`文化 ${sh(a.culture)}%（≥3%），活动 ${sh(a.events)}%`,`Culture ${sh(a.culture)}% (≥3%), events ${sh(a.events)}%`)],
      ["P6",L("用 Council 用地提供公共便利","Council land delivering public amenity"),sum(a)===TOTAL,L("1,200 m² 全部作为公共空间","All 1,200 m² kept as public space")]];
    body=`<p class="lede">${L("检查当前分配是否仍符合总规的 6 条城市设计原则","Checks whether the current split still meets the plan's six urban design principles")} ${chip("S2","p.22")}${L("。",". ")}<span class="tag t-design">${L("阈值是我们的假设","Thresholds are our assumptions")}</span></p>
    <div class="card"><ul class="claims pcheck">${P.map(p=>`<li><b>${p[0]}</b> ${p[1]} — <span class="${p[2]?"ok":"bad"}">${p[2]?"✓":"✗"} ${p[3]}</span></li>`).join("")}</ul></div>`;
  } else {
    const subs=store.get("ca_subs")||[];
    body=`<p class="lede">${L("正式版只在同一群体达到 10 人以上时显示汇总，并对比 ABS 人口结构检查代表性。演示版没有真实提交，只显示本浏览器里的演示数据。","The full version shows a summary only once a group reaches 10 or more people, and checks representativeness against the ABS Census. The demo has no real submissions, only demo data from this browser.")}</p>
    <div class="card"><p class="fit">${subs.length}</p><p>${subs.length<10?L("少于 10 份，不显示汇总（隐私门槛）。","Fewer than 10, so no summary is shown (privacy threshold)."):L("已达到 10 份，可以显示汇总。","10 or more, so a summary can be shown.")}</p>${subs.length?`<button class="btn" id="clearSubs">${L("清除本浏览器的演示提交","Clear demo submissions in this browser")}</button>`:""}</div>`;
  }
  return `<div class="eyebrow">${L("Council 后台 · 演示","Council view · demo")}</div><h1>${L("Council 收到什么、要核对什么","What Council receives and checks")}</h1>
  <div class="seg" role="tablist" style="margin-bottom:14px;flex-wrap:wrap">${tabs.map(([k,t])=>`<button role="tab" data-ctab="${k}" aria-pressed="${S.ctab===k}" aria-selected="${S.ctab===k}">${t}</button>`).join("")}</div>${body}
  <div class="nav"><button class="btn" data-view="res">${L("回到居民故事板","Back to the resident storyboard")}</button></div>`;
}

/* ---------- Drawer ---------- */
function openDrawer(src,pg,cid){
  const c=CLAIMS.find(x=>x.id===cid); const s=SOURCES[src];
  document.getElementById("drawerHost").innerHTML=`<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${L("来源","Source")}">
   <button class="x" data-close="1">${L("关闭","Close")}</button><div class="eyebrow">${src}${pg?" · "+pg:""}</div><h2>${esc(T(s))}</h2>
   ${c?`<p>${esc(T(c))}</p>${c.q?`<blockquote lang="en">“${esc(c.q)}”</blockquote><p class="small muted">${L("原文（英文），","Original wording, ")}${src}${c.pg?" "+c.pg:""}</p>`:""}`:`<p class="muted">${L("这一段整体出自该来源。","This section as a whole comes from this source.")}</p>`}
   ${s.url?`<p><a href="${s.url}" target="_blank" rel="noopener">${L("打开原文件","Open the original")} ↗</a></p>`:`<p class="small muted">${L("团队持有的简报文件。","Brief held by the team.")}</p>`}
   <p class="small muted">${L("页码为 PDF 上印的页码。","Page numbers are those printed in the document.")}</p></aside>`;
  document.querySelector(".drawer .x").focus();
}
function closeDrawer(){document.getElementById("drawerHost").innerHTML="";}

function syncS3(active){
  MODULES.forEach(m=>{const r=document.getElementById("m_"+m.id); if(r&&r!==active) r.value=S.a[m.id]; const o=document.getElementById("o_"+m.id); if(o) o.textContent=fmt(S.a[m.id])+" m²";});
  for(const g in GROUPS){const r=document.getElementById("g_"+g); if(r&&r!==active) r.value=gsum(g); const v=document.getElementById("gv_"+g); if(v) v.textContent=pct(gsum(g))+"%"; const mm=document.getElementById("gm_"+g); if(mm) mm.textContent=fmt(gsum(g))+" m²";}
  const vz=document.getElementById("viz"); if(vz) vz.innerHTML=vizPanel();
}
/* ---------- Render & events ---------- */
function render(){
  chrome();
  const m=document.getElementById("main");
  m.innerHTML = S.view==="council"?council():[null,s1,s2,s3,s4,s5][S.step]();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]"); if(!b) return;
  const d=b.dataset;
  if(d.close){closeDrawer();return;}
  if(b.id==="lZh"||b.id==="lEn"){S.lang=b.id==="lZh"?"zh":"en";store.set("ca_lang",S.lang);render();return;}
  if(b.id==="vRes"){S.view="res";render();return;}
  if(b.id==="vCouncil"){S.view="council";render();return;}
  if(d.view){S.view=d.view;render();scrollTo(0,0);return;}
  if(d.step){S.step=+d.step;S.view="res";render();return;}
  if(d.go){S.step=+d.go;render();scrollTo(0,0);return;}
  if(d.src){openDrawer(d.src,d.pg,d.claim);return;}
  if(d.role){S.role=d.role;render();return;}
  if(d.pri){const i=S.pri.indexOf(d.pri);if(i>=0)S.pri.splice(i,1);else if(S.pri.length<3)S.pri.push(d.pri);render();return;}
  if(d.react){S.react[d.react]=S.react[d.react]===d.v?null:d.v;render();return;}
  if(d.preset){S.a={...PRESETS[d.preset].a};render();return;}
  if(d.plant){S.plant=d.plant;render();return;}
  if(d.year){S.year=+d.year;render();return;}
  if(d.ctab){S.ctab=d.ctab;render();return;}
  if(b.id==="submit"){const subs=store.get("ca_subs")||[];subs.push({t:Date.now(),role:S.role,age:S.age,pc:S.postcode,pri:S.pri,react:S.react,a:S.a,exp:S.exp,wish:S.wish});store.set("ca_subs",subs);render();return;}
  if(b.id==="clearSubs"){store.set("ca_subs",[]);render();return;}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.mod||t.dataset.grp){ // linked sliders: update in place so the drag continues
    if(t.dataset.mod) setModule(t.dataset.mod,+t.value); else setGroup(t.dataset.grp,+t.value);
    syncS3(t); return;}
  if(t.id==="pc"){S.postcode=t.value.replace(/\D/g,"").slice(0,4);return;}
  if(t.id==="exp"){S.exp=t.value;return;}
  if(t.id==="wish"){S.wish=t.value;return;}
  if(t.dataset.note){S.note[t.dataset.note]=t.value;return;}
});
document.addEventListener("change",e=>{if(e.target.id==="age"){S.age=e.target.value||null;}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
render();
</script>
