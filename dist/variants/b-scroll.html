<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicAlign Story</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Shared tokens and components for the three CivicAlign variants.
   Navy civic chrome, a green "evidence" accent, four use-group colours from GROUPS. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#e9eef3; --fg:#13202e; --muted:#566476; --line:#d3dce5;
  --chrome:#0e1c33; --chrome-2:#18294a; --chrome-3:#243a63; --chrome-fg:#eaf0f9; --chrome-mut:#9fb0cb;
  --accent:#1f6b57; --accent-soft:#d8ece4; --on-accent:#ffffff;
  --base:#8e9bab; --fact:#1f6b57; --fact-bg:#dcefe6; --infer:#93580a; --infer-bg:#fbecd2;
  --design:#2c5aa0; --design-bg:#dfe8f7; --gap:#b23a3a; --gap-bg:#f8dfdf;
  --map-bg:#e7ecf0; --map-bld:#cfd7de; --map-road:#ffffff; --map-road-edge:#c2ccd6; --map-green:#cfe6c9; --map-rail:#6d7a86;
  --p-base:#e4e9f0; --p-base-fg:#23324a; --p-green:#e0f1e2; --p-green-fg:#245a2c; --p-night:#fbecd6; --p-night-fg:#7a4a0c;
  --shadow:0 1px 2px rgba(16,32,52,.06),0 6px 18px rgba(16,32,52,.07);
  --f-display:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b121b; --surface:#121c28; --surface-2:#1a2635; --fg:#e4ebf3; --muted:#98a7b9; --line:#283749;
  --chrome:#070e19; --chrome-2:#101d33; --chrome-3:#1c3054; --chrome-fg:#e4ebf6; --chrome-mut:#8ea1bf;
  --accent:#6cc3a6; --accent-soft:#183a30; --on-accent:#08140f;
  --base:#66768a; --fact:#7fd0b2; --fact-bg:#173629; --infer:#f0b257; --infer-bg:#3a2c14; --design:#8fb3f0; --design-bg:#1b2944; --gap:#f08a8a; --gap-bg:#3d1f1f;
  --map-bg:#141f2b; --map-bld:#2a3847; --map-road:#3a4a5c; --map-road-edge:#243142; --map-green:#21402c; --map-rail:#8b9aab;
  --p-base:#1f2c3f; --p-base-fg:#d6e0ee; --p-green:#1d3a25; --p-green-fg:#bfe5c4; --p-night:#3a2c14; --p-night-fg:#f2cf98;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b121b; --surface:#121c28; --surface-2:#1a2635; --fg:#e4ebf3; --muted:#98a7b9; --line:#283749;
  --chrome:#070e19; --chrome-2:#101d33; --chrome-3:#1c3054; --chrome-fg:#e4ebf6; --chrome-mut:#8ea1bf;
  --accent:#6cc3a6; --accent-soft:#183a30; --on-accent:#08140f;
  --base:#66768a; --fact:#7fd0b2; --fact-bg:#173629; --infer:#f0b257; --infer-bg:#3a2c14; --design:#8fb3f0; --design-bg:#1b2944; --gap:#f08a8a; --gap-bg:#3d1f1f;
  --map-bg:#141f2b; --map-bld:#2a3847; --map-road:#3a4a5c; --map-road-edge:#243142; --map-green:#21402c; --map-rail:#8b9aab;
  --p-base:#1f2c3f; --p-base-fg:#d6e0ee; --p-green:#1d3a25; --p-green-fg:#bfe5c4; --p-night:#3a2c14; --p-night-fg:#f2cf98;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.tag{display:inline-block;font-size:11.5px;line-height:1.5;border-radius:4px;padding:0 6px;font-weight:500;white-space:nowrap;vertical-align:1px}
.t-fact{background:var(--fact-bg);color:var(--fact)} .t-infer{background:var(--infer-bg);color:var(--infer)}
.t-design{background:var(--design-bg);color:var(--design)} .t-gap{background:var(--gap-bg);color:var(--gap)}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:4px;padding:0 6px;white-space:nowrap;line-height:1.6;vertical-align:1px}
.src:hover{text-decoration:underline}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.pill button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.pill button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tgl{display:inline-flex;border:1px solid var(--chrome-3);border-radius:8px;overflow:hidden}
.tgl button{border:0;background:transparent;color:var(--chrome-fg);padding:5px 10px;font-size:13px}
.tgl button[aria-pressed="true"]{background:var(--chrome-fg);color:var(--chrome)}
/* source drawer (markup from app/template.html openDrawer) */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);z-index:60;padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 20px;overflow-y:auto}
.drawer h2{font-size:19px;margin:4px 0 10px}
.drawer blockquote{margin:10px 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);font-size:14px}
.drawer .x{float:right;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px}
.drawer a{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.4);z-index:59}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
/* linked sliders */
input[type=range].rg{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:4px 0 0;--c:var(--accent);--p:50%}
input[type=range].rg::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--c) var(--p),var(--surface-2) var(--p))}
input[type=range].rg::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--c) var(--p),var(--surface-2) var(--p))}
input[type=range].rg::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--c);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range].rg::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.gcards{display:grid;gap:10px}
.gcard{--gc:#888;border:1px solid color-mix(in srgb,var(--gc) 40%,var(--line));background:color-mix(in srgb,var(--gc) 8%,var(--surface));border-radius:12px;padding:10px 12px 8px}
.gtop{display:flex;align-items:center;gap:10px}
.gic{flex:0 0 34px;height:34px;border-radius:9px;background:var(--gc);display:grid;place-items:center}
.gic svg{width:20px;height:20px}
.gname{flex:1;min-width:0} .gname b{display:block;font-size:15px;line-height:1.3} .gname small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.gval{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--gc);font-variant-numeric:tabular-nums;line-height:1}
.gval small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);text-align:right;margin-top:3px}
.mods{margin-top:6px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px;gap:8px;align-items:center;padding:4px 0}
@media (max-width:480px){.mod{grid-template-columns:minmax(0,1fr) 64px}.mod input{grid-column:1/-1;order:3}}
.mod .nm{font-size:13px;min-width:0;line-height:1.35}
.mod .nm small{display:block;color:var(--muted);font-size:11px}
.mod output{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.mic{display:inline-block;vertical-align:-3px;margin-right:6px}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;margin-top:10px}
details.more summary{cursor:pointer;font-weight:500;font-size:14px}
/* quick-compare scenario buttons */
.pzs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pz{border:2px solid transparent;border-radius:10px;padding:9px 8px;font-size:12.5px;font-weight:600;text-align:left;line-height:1.3;min-width:0}
.pz small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:2px}
.pz-base{background:var(--p-base);color:var(--p-base-fg)} .pz-green{background:var(--p-green);color:var(--p-green-fg)} .pz-night{background:var(--p-night);color:var(--p-night-fg)}
.pz[aria-pressed="true"]{border-color:currentColor}
@media (max-width:420px){.pzs{grid-template-columns:1fr}}
/* allocation bar */
.abar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.abar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;transition:width .15s}
/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--kc,var(--accent))}
.kh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.kh b{font-weight:500;color:var(--fg);display:flex;align-items:center;gap:6px}
.kv{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;letter-spacing:-.01em}
.kv small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.kd{font-size:12.5px;font-weight:500;margin-top:2px} .kn{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.delta-up{color:var(--fact)} .delta-down{color:var(--gap)}
/* plaza diagram */
.plaza{width:100%;height:auto;display:block}
.plaza text{font-family:var(--f-body)}
/* results rows */
.res{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.res{grid-template-columns:1fr}}
.res:last-child{border-bottom:0}
.res .dn{font-size:14px;font-weight:500}
.res .dn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.res .dn.pri::after{content:" ★";color:var(--accent)}
.track{position:relative;height:30px}
.track .rng{position:absolute;height:9px;border-radius:5px;transition:left .15s,width .15s}
.track .r0{top:3px;background:var(--base)} .track .r1{top:17px;background:var(--accent)}
.vals{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.45}
.vals .y{color:var(--accent)}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.status{font-size:12px;border-radius:4px;padding:0 6px;white-space:nowrap}
.st-ok{background:var(--fact-bg);color:var(--fact)} .st-gap{background:var(--gap-bg);color:var(--gap)}
ul.claims{list-style:none;margin:0;padding:0}
ul.claims li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
ul.claims li:last-child{border-bottom:0}
.kind{font-size:11.5px;font-weight:500;color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.ok{color:var(--fact)} .bad{color:var(--gap)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
/* base map */
.basemap{width:100%;height:100%;display:block;background:var(--map-bg)}
.basemap .lab{font-family:var(--f-body);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px;fill:var(--fg)}
.hl{transition:opacity .35s}
footer.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer.foot .wrap{padding-block:16px 28px}
.disc{background:var(--infer-bg);color:var(--fg);font-size:13px}
.disc .wrap{padding-block:7px}
.disc b{color:var(--infer)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Council backend and evidence ledger (variants/council.js), plus the shared P1–P6 check and gap list.
   Appended to base.css at build time, so it uses the same tokens. */
.cb h2{font-size:18px}
.cb h3{font-size:15px}
.cb [id^="cb-"]{scroll-margin-top:14px}
.cb-mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.cb-neutral{background:var(--surface-2);color:var(--muted)}
.cb-sm{padding:5px 12px;font-size:13px;white-space:nowrap;flex:none}
.cb-link{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;text-decoration:underline}
.cb-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cb-ghost{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.cb-ghost ul{margin:6px 0 8px;padding-left:18px}
.cb-blk{margin-top:14px}
.cb-blk h3{margin-bottom:4px}
ul.claims li.cb-held,li.cb-held{color:var(--muted);font-size:13px}

/* decision card */
.cb-dec{border-left:4px solid var(--accent)}
.cb-dcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:4px}
@media (max-width:980px){.cb-dcs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cb-dcs{grid-template-columns:1fr}}
.cb-dc{border-top:2px solid var(--line);padding-top:8px;min-width:0}
.cb-dc h3{font-size:15.5px;margin:2px 0 6px;line-height:1.35}
.cb-dc p,.cb-dc li{font-size:13.5px}
.cb-dc ul{margin:0 0 8px;padding-left:18px}
.cb-dc li{margin-bottom:3px}

/* status tiles */
.cb-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.cb-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.cb-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cb-tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.cb-tile:hover,.cb-step:hover{border-color:var(--accent)}
.cb-tn{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cb-tn i{font-style:normal;font-size:15px;color:var(--muted);font-weight:500}
.cb-tt{font-size:13.5px;font-weight:600}
.cb-tile small{font-size:12px;color:var(--muted);line-height:1.35}
.cb-tile.warn .cb-tn{color:var(--infer)}
.cb-tile.bad .cb-tn{color:var(--gap)}

/* to-do list */
.cb-todo{list-style:none;margin:8px 0 0;padding:0}
.cb-todo li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cb-todo li:last-child{border-bottom:0}
@media (max-width:520px){.cb-todo li{flex-direction:column;align-items:flex-start}}

/* P1–P6 check (shared.js pCheckList) */
.pc{display:grid;gap:8px;margin-top:8px}
.pc-r{border:1px solid var(--line);border-left:4px solid var(--fact);border-radius:10px;padding:8px 12px;background:var(--surface);min-width:0}
.pc-weak{border-left-color:var(--infer)}
.pc-fail{border-left-color:var(--gap)}
.pc-na{border-left-color:var(--base)}
.pc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:14px}
.pc-h .status{flex:none;margin-top:2px}
.pc-m{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:2px 10px;font-size:13px;margin-top:4px;align-items:baseline}
@media (max-width:520px){.pc-m{grid-template-columns:1fr}}
.pc-k{color:var(--muted)}
.pc-v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.pc-t{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.pcv-keep{color:var(--fact)} .pcv-weak{color:var(--infer)} .pcv-fail{color:var(--gap)}
.pc-n{font-size:12.5px;color:var(--muted);margin-top:4px}
.pcs-keep{background:var(--fact-bg);color:var(--fact)}
.pcs-weak{background:var(--infer-bg);color:var(--infer)}
.pcs-fail{background:var(--gap-bg);color:var(--gap)}
.pcs-na{background:var(--surface-2);color:var(--muted)}

/* evidence gaps (shared.js gapsList) */
.gaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px;margin-top:8px}
.gap{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;background:var(--surface)}
.gap-t{font-size:14.5px;margin-bottom:6px}
.gap dl{margin:0;display:grid;gap:4px}
.gap dl div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;font-size:13px}
.gap dt{color:var(--muted)}
.gap dd{margin:0}
.rtag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:600;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 5px;line-height:1.5}

/* ledger */
.cb-filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.cb-filter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.cb-filter button i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.cb-filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cb-filter button[aria-pressed="true"] i{color:inherit}
.cb-grp{border-top:1px solid var(--line);padding-top:6px;margin-top:8px}
.cb-grp summary{cursor:pointer;font-weight:600;font-family:var(--f-display);font-size:15px;padding:4px 0}
.cb-row{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1.1fr) 236px;gap:6px 14px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start}
.cb-row:last-child{border-bottom:0}
@media (max-width:900px){.cb-row{grid-template-columns:1fr;gap:4px}}
.cb-rh{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cb-n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:18px}
.cb-rt{font-size:14px}
.cb-rq{font-size:12.5px;color:var(--muted)}
.cbs-rej .cb-rt{text-decoration:line-through;color:var(--muted)}
.cbs-edit .cb-rt{color:var(--muted)}
.cbt-ok{background:var(--fact-bg);color:var(--fact)}
.cbt-edit{background:var(--infer-bg);color:var(--infer)}
.cbt-rej{background:var(--gap-bg);color:var(--gap)}
.cbt-gap{color:var(--gap);box-shadow:inset 0 0 0 1px var(--gap)}
.cb-btns{display:flex;gap:4px;flex-wrap:wrap}
.cb-b{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;font-size:12.5px}
.cb-b-ok[aria-pressed="true"]{background:var(--fact-bg);color:var(--fact);border-color:var(--fact)}
.cb-b-edit[aria-pressed="true"]{background:var(--infer-bg);color:var(--infer);border-color:var(--infer)}
.cb-b-rej[aria-pressed="true"]{background:var(--gap-bg);color:var(--gap);border-color:var(--gap)}
.cb-why{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px;padding:6px 8px;background:var(--surface-2);border-radius:8px}
.cb-why button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px}
.cb-who{margin-top:4px;font-size:12px;line-height:1.4;color:var(--muted)}

/* pipeline */
.cb-pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:980px){.cb-pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cb-pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cb-step{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;display:grid;gap:5px;align-content:start;min-width:0}
.cb-step b{font-family:var(--f-display);font-size:15px}
.cb-step .tag{white-space:normal}

/* three-column rows: benchmark / what we hold / now */
.cb-kv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.25fr) minmax(0,.8fr);gap:6px 14px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.cb-kv:last-child{border-bottom:0}
.cb-kv.h{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
@media (max-width:640px){.cb-kv{grid-template-columns:1fr;gap:2px}.cb-kv.h{display:none}}

/* feedback */
.cb-thr{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.cb-thr b{font-family:var(--f-display);font-size:32px;line-height:1}
.cb-grps{list-style:none;margin:6px 0 10px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:420px){.cb-grps{grid-template-columns:1fr}}
.cb-grps li{display:flex;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13px}
.cb-gate{background:var(--infer-bg);border-radius:10px;padding:8px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.cb-line{font-size:13px;margin-top:6px}
.cb-line small{color:var(--muted);display:block}
.cb-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);margin:3px 0}
.cb-bar span{display:block;height:100%}
.cb-y{background:var(--fact)} .cb-u{background:var(--base)} .cb-no{background:var(--gap)}

/* written comments */
.cb-tri{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.cb-tri li{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cb-tri p{margin:2px 0 6px;font-size:14px;overflow-wrap:anywhere}
.cb-tri label{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.cb-tri select{width:auto;flex:1;min-width:0;padding:4px 8px}

/* roles and advocacy brief */
.cb-roles{display:grid;grid-template-columns:repeat(3,minmax(0,.7fr)) minmax(0,1.6fr);gap:8px;margin-top:8px}

@media (max-width:520px){.cb-roles{grid-template-columns:1fr}}
.cb-role{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0}
.cb-role b{font-family:var(--f-mono);color:var(--accent)}
.cb-role .t{display:block;font-size:12.5px;font-weight:500}
.cb-role .big{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.cb-role small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}
.cb-role.a{background:var(--design-bg)}
.cb-role ul{margin:4px 0 0;padding-left:16px;font-size:12.5px}
.cb-role li{margin-bottom:3px}
.cb-briefbox{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.cb-doc{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface-2);margin:8px 0 10px;font-size:14px}
.cb-doc h4{font-family:var(--f-display);font-size:16px;margin:0 0 4px}
.cb-doc h5{font-size:12.5px;margin:12px 0 4px;color:var(--muted);font-weight:600;font-family:var(--f-mono);letter-spacing:.04em}
.cb-doc ol,.cb-doc ul{margin:0;padding-left:20px}
.cb-doc li{margin-bottom:8px}

/* band at the end of the resident story */
.cb-hand{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-left:4px solid var(--accent)}
.cb-hand>div{flex:1 1 280px;min-width:0}

/* on a phone, the status tiles come before the long decision card */
@media (max-width:560px){.cb>.banner{order:-2}.cb-tiles{order:-1}}

/* Layout (B · Scrollytelling): one narrative for a 3-minute pitch. A sticky base map on the left
   reframes and highlights places as the steps scroll past; then deliverables, Council's decision path,
   an inline allocation with live results, and feedback. */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--chrome)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome);color:var(--chrome-fg)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:9px;flex-wrap:wrap}
.bar .brand{font-family:var(--f-display);font-weight:700;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .brand span{font-weight:500;color:var(--chrome-mut);font-size:13px;margin-left:8px}
.prog{position:absolute;left:0;bottom:0;height:3px;background:#3fae8c;width:0}
.chap{display:none;gap:4px}
@media (min-width:900px){.chap{display:flex}}
.chap a{color:var(--chrome-mut);text-decoration:none;font-size:12.5px;padding:3px 8px;border-radius:6px}
.chap a.on{background:var(--chrome-3);color:var(--chrome-fg)}
/* hero */
.hero{background:var(--chrome);color:var(--chrome-fg)}
.hero .wrap{padding-block:34px 38px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-block:24px 28px}}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.04;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#8fe0c4}
.hero p.lede{color:var(--chrome-mut);font-size:16.5px;max-width:52ch;margin-top:12px}
.hero .facts{display:grid;gap:8px}
.hero .fact{border-top:1px solid var(--chrome-3);padding-top:8px;font-size:14px}
.hero .fact b{font-family:var(--f-display);font-size:22px;display:block;color:#fff}
.hero .src{background:rgba(143,224,196,.15);color:#8fe0c4}
/* scrolly */
.scrolly{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;padding-block:28px}
.mapwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);height:calc(100vh - 86px);min-height:420px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
.mapwrap .key{position:absolute;left:10px;bottom:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:8px;padding:6px 10px}
.steps{display:grid;gap:0}
.step{min-height:78vh;display:flex;align-items:center}

.step .card{box-shadow:var(--shadow);opacity:.45;transition:opacity .3s}
.step.on .card{opacity:1}
.step h3{font-size:21px;margin:4px 0 8px}
.step .n{font-family:var(--f-mono);color:var(--accent);font-size:12px}
@media (max-width:820px){
  .scrolly{grid-template-columns:1fr;gap:0}

  .step:first-child{min-height:64vh}

}

.ch{padding-block:44px 8px}

.tl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;position:relative;margin:8px 0 18px}

const COEF = {

 econ:{events:[0.5,1.0],rest:[0.15,0.30],culture:[0.1,0.2]},

const W = {safety:{events:0.06,smart:0.8,walk:0.05,culture:0.05},incl:{rest:0.25,walk:0.08,shade:0.03,bike:0.2},culture:{culture:0.3,events:0.06,rest:0.1}};

function compute(a, plant, year){
  const out={};
  const cr = CROWN[plant][year];
  const sh = [0,1].map(i=>Math.min(TOTAL, a.canopy*cr[i] + a.rest*COEF.restShade[i]));
  out.shade = sh;
  const cs = plant==="deep"?COEF.storm.canopy_deep:COEF.storm.canopy_planter;
  out.storm = [0,1].map(i=>a.blue*COEF.storm.blue[i] + a.canopy*cs[i]);
  out.econ = [0,1].map(i=>a.events*COEF.econ.events[i]+a.rest*COEF.econ.rest[i]+a.culture*COEF.econ.culture[i]);
  out.access = [0,1].map(i=>100*a.walk*COEF.walkClear[i]/TOTAL);
  const proxy=(w,extra)=>{let s=0;for(const k in w){s+= (k==="shade"?extra:a[k])*w[k];}return s;};
  const sMid=(sh[0]+sh[1])/2;
  out.safety = [0.85,1.15].map(f=>Math.min(100,proxy(W.safety)*f));
  out.incl = [0.85,1.15].map(f=>Math.min(100,proxy(W.incl,sMid)*f));
  out.culture = [0.85,1.15].map(f=>Math.min(100,proxy(W.culture)*f));
  const yrs = year-2026;
  out.cost = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*(COEF.capex[m.id][i]+COEF.opex[m.id][i]*yrs);}return c/1000;});
  out.carbon = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*COEF.carbon[m.id][i];}return c;});
  return out;
}

const r10=v=>Math.round(v/10)*10;
function normalise(){ // keep the total at exactly 1,200 m² after rounding
  let d=TOTAL-sum(S.a); if(!d) return;
  const ids=MODULES.map(m=>m.id).sort((x,y)=>S.a[y]-S.a[x]);
  for(const id of ids){ const nv=Math.max(0,S.a[id]+d); d-=nv-S.a[id]; S.a[id]=nv; if(!d) break; }
}
function setModule(id,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const others=MODULES.filter(m=>m.id!==id), rest=others.reduce((s,m)=>s+S.a[m.id],0), target=TOTAL-v;
  others.forEach(m=>{S.a[m.id]= rest>0 ? r10(S.a[m.id]*target/rest) : r10(target/others.length);});
  S.a[id]=v; normalise();
}
function setGroup(g,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const inG=MODULES.filter(m=>m.g===g), outG=MODULES.filter(m=>m.g!==g);
  const gt=inG.reduce((s,m)=>s+S.a[m.id],0), ot=outG.reduce((s,m)=>s+S.a[m.id],0);
  inG.forEach(m=>{S.a[m.id]= gt>0 ? r10(S.a[m.id]*v/gt) : r10(v/inG.length);});
  outG.forEach(m=>{S.a[m.id]= ot>0 ? r10(S.a[m.id]*(TOTAL-v)/ot) : r10((TOTAL-v)/outG.length);});
  normalise();
}

   compute() clamps safety, inclusion and culture at 100, so strong splits read "100–100". Here they become a

  const f=w=>{let t=0;for(const k in w)t+=(k==="shade"?sMid:a[k])*w[k];return t;};return {safety:f(W.safety),incl:f(W.incl),culture:f(W.culture)};}

/* ---------- shared events. ctx = {render(), live()} ---------- */
function bindCommon(ctx,extra){
  document.addEventListener("click",e=>{
    const b=e.target.closest("button,[data-close],[data-hot],[data-quest]"); if(!b) return;
    if(extra&&extra(b,e)) return;
    const d=b.dataset;
    if(d.close){closeDrawer();return;}
    if(d.src){openDrawer(d.src,d.pg,d.claim);return;}
    if(b.id==="lZh"||b.id==="lEn"){S.lang=b.id==="lZh"?"zh":"en";store.set("cav_lang",S.lang);ctx.render();return;}
    if(b.id==="themeBtn"){toggleTheme();ctx.render();return;}
    if(d.preset){S.a={...PRESETS[d.preset].a};syncSliders(null);ctx.live();return;}
    if(d.plant){S.plant=d.plant;document.querySelectorAll("[data-plant]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.plant===S.plant));ctx.live();return;}
    if(d.year){S.year=+d.year;document.querySelectorAll("[data-year]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.year===S.year));ctx.live();return;}
    if(d.role){S.role=d.role;ctx.render();return;}
    if(d.pri){const i=S.pri.indexOf(d.pri);if(i>=0)S.pri.splice(i,1);else if(S.pri.length<3)S.pri.push(d.pri);ctx.render();return;}
    if(d.react){S.react[d.react]=S.react[d.react]===d.v?null:d.v;document.querySelectorAll(`[data-react="${d.react}"]`).forEach(x=>x.setAttribute("aria-pressed",S.react[d.react]===x.dataset.v));return;}
    if(b.id==="submit"){submitDemo();ctx.render();return;}
    if(b.id==="clearSubs"){store.set("cav_subs",[]);ctx.render();return;}
  });
  let raf=0;
  document.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.mod||t.dataset.grp){ // linked sliders: update in place so the drag continues
      if(t.dataset.mod) setModule(t.dataset.mod,+t.value); else setGroup(t.dataset.grp,+t.value);
      syncSliders(t); cancelAnimationFrame(raf); raf=requestAnimationFrame(ctx.live); return;}
    if(t.id==="exp"){S.exp=t.value;return;}
    if(t.id==="wish"){S.wish=t.value;return;}
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
  if(window.matchMedia){try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!S.theme)ctx.render();});}catch(e){}}
}

/* tween the map's viewBox */
function tweenVB(svg,to,ms=650,onF){if(!svg)return;const from=svg.getAttribute("viewBox").split(" ").map(Number);if(svg._raf)cancelAnimationFrame(svg._raf);
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;if(reduce){svg.setAttribute("viewBox",to.join(" "));onF&&onF();return;}
  const t0=performance.now();const step=t=>{const u=Math.min(1,(t-t0)/ms),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;svg.setAttribute("viewBox",from.map((f,i)=>(f+(to[i]-f)*e).toFixed(1)).join(" "));onF&&onF();if(u<1)svg._raf=requestAnimationFrame(step);};svg._raf=requestAnimationFrame(step);}

     ${V.sim?L(`右边的数字 = ${simN()} 位模拟受访者的票 + 你的票。`,`The number on the right = votes from ${simN()} simulated respondents + yours.`):L("右边的数字只算你在本浏览器投的票，从 0 开始。","The number on the right counts only your votes in this browser, starting at 0.")}</p>

   <div class="obs-l">${shown.concat(mine).map(obsCard).join("")}</div>
   ${hidden?`<button class="btn vmore" id="vMore">${L(`再给我 ${hidden} 条`,`Show ${hidden} more`)}</button>`:""}
   ${composer()}`;}
function obsCard(o){const on=S.seen.includes(o.id),sn=V.sim?cntIn(o.id,simPool()):0,mn=cntIn(o.id,mineAll())+(on?1:0),n=sn+mn;
  return `<article class="obs${on?" on":""}"><div class="ob-r"><button class="ob-t" data-vo="${o.id}" aria-pressed="${on}"><span class="ob-c" aria-hidden="true">${on?"✓":""}</span><span><b>${esc(obsText(o))}</b>
     ${o.added?`<span class="tag t-design">${L("你添加的 · 只在本浏览器","Added by you · this browser only")}</span>`:""}</span></button>
     <span class="ob-n${sn?" sim":""}" aria-label="${L(`${n} 票，其中模拟 ${sn}`,`${n} votes, ${sn} simulated`)}">${n}<small>${L("票",n===1?"vote":"votes")}</small>${sn?`<i>${L("模拟","simulated")}</i>`:""}</span></div>
    ${saysLine(o)}<div class="ob-f">${roleTag(o.role)} <span class="small muted">${esc(roleName(o.role))}</span>
     <span class="ob-mix">${sn?`${SIMTAG()} <span class="small">${sn}</span>`:""}${mn?` <span class="tag t-mine">${L(`你的 ${mn} 票`,mn===1?"your vote":`your ${mn} votes`)}</span>`:""}</span></div></article>`;}
function composer(){const iss=VISSUES().find(x=>x[0]===V.issue);
  return `<details class="vadd"${V.place||V.issue?" open":""}><summary>＋ ${L("加一条你遇到的问题（点选，不用打字）","Add something you've run into (tap, no typing)")}</summary>
   <div class="lbl" style="margin-top:8px">1 · ${L("在哪里","Where")}</div><div class="pill">${VPLACES().map(([k,t])=>`<button data-vplace="${k}" aria-pressed="${V.place===k}">${esc(t)}</button>`).join("")}</div>
   <div class="lbl" style="margin-top:8px">2 · ${L("什么问题","What")}</div><div class="pill">${VISSUES().map(([k,t])=>`<button data-vissue="${k}" aria-pressed="${V.issue===k}">${esc(t)}</button>`).join("")}</div>
   ${iss?`<div class="vprev">${saysLine({says:iss[4]})}</div>`:""}
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><button class="btn primary" id="vAdd"${V.place&&V.issue?"":` aria-disabled="true"`}>${L("加入清单并投一票","Add to the list and vote")}</button>
   <span class="small muted" id="vAddMsg">${esc(V.msg)||L("加进去以后，用这个浏览器的人都能看到并投票（演示没有服务器）。新加的条目没有模拟票。","Once added, anyone using this browser can see it and vote (the demo has no server). New items have no simulated votes.")}</span></div></details>`;}

/* ---------- C · pairwise duel over the 10 uses ---------- */
const DROUNDS=8;
/* which uses the plan itself lists (S2 p.45); the rest are team additions from the Smart City Strategy actions */
const MOD_SRC={canopy:"sq2",culture:"sq2",smart:"sq2",events:"sq3",rest:"sq3",walk:"sq4"};
function shuffle(a,rnd=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makePairs(rnd=Math.random){const ids=MODULES.map(m=>m.id),seen=new Set(),pairs=[];
  for(let t=0;pairs.length<DROUNDS&&t<12;t++){const s=shuffle(ids,rnd);for(let i=0;i+1<s.length&&pairs.length<DROUNDS;i+=2){const k=[s[i],s[i+1]].sort().join("|");if(!seen.has(k)){seen.add(k);pairs.push([s[i],s[i+1]]);}}}
  return pairs;}
function newDuel(){S.duel={pairs:makePairs(),i:0,res:[]};}
function duelRank(res){const sc={};MODULES.forEach(m=>sc[m.id]={w:0,n:0});
  res.forEach(r=>{if(r.w==="skip")return;sc[r.a].n++;sc[r.b].n++;if(r.w==="tie"){sc[r.a].w+=.5;sc[r.b].w+=.5;}else sc[r.w].w++;});
  return MODULES.map(m=>({m,w:sc[m.id].w,n:sc[m.id].n,p:sc[m.id].n?sc[m.id].w/sc[m.id].n:null})).filter(x=>x.n).sort((x,y)=>y.p-x.p||y.n-x.n);}
const duelsOf=rs=>[].concat(...rs.map(r=>r.duel));
const modSrc=id=>MOD_SRC[id]?(()=>{const c=CLAIMS.find(x=>x.id===MOD_SRC[id]);return `${L("总规列出","Listed in the plan")} ${chip(c.src,c.pg,c.id)}`;})():`<span class="tag t-design">${L("团队补充的用途","Use added by the team")}</span>`;
const fmtW=w=>Number.isInteger(w)?w:w.toFixed(1);
const modName=id=>T(MODULES.find(m=>m.id===id));
function rankList(r){return `<ol class="drank">${r.map((x,i)=>`<li><span class="dn">${i+1}</span><span class="dic sm" aria-hidden="true">${ICON[x.m.id](GROUPS[x.m.g].c)}</span><span class="dl">${T(x.m)} ${roleTag(x.m.role)}</span><span class="db"><span style="width:${Math.round(100*x.p)}%;background:${GROUPS[x.m.g].c}"></span></span><span class="dp">${Math.round(100*x.p)}%<small>${L(`赢 ${fmtW(x.w)}/${x.n}`,`won ${fmtW(x.w)}/${x.n}`)}</small></span></li>`).join("")}</ol>`;}
function duelSide(id){const m=MODULES.find(x=>x.id===id),c=GROUPS[m.g].c;
  return `<div class="dside"><button class="dpick" data-duel="${id}" style="--gc:${c}"><span class="dic" aria-hidden="true">${ICON[id](c)}</span><b>${T(m)}</b></button>
   <div class="dcap">${roleTag(m.role)} ${modSrc(id)}</div></div>`;}
/* how the simulated respondents split on the pair you just answered */
function lastRoundNote(){const d=S.duel;if(!V.sim||!d||!d.i)return "";const last=d.res[d.i-1];
  const rs=duelsOf(simPool()).filter(r=>r.w!=="skip"&&((r.a===last.a&&r.b===last.b)||(r.a===last.b&&r.b===last.a)));
  if(rs.length<5) return `<p class="small muted vlast">${L("上一轮这一对的模拟数据太少，不显示比例。","Too few simulated answers for the last pair to show a split.")} ${SIMTAG()}</p>`;
  const pa=Math.round(100*rs.filter(r=>r.w===last.a).length/rs.length),pb=Math.round(100*rs.filter(r=>r.w===last.b).length/rs.length);
  const you=last.w===last.a||last.w===last.b?L(`你选了「${modName(last.w)}」。`,`You picked ${modName(last.w)}. `):"";
  return `<p class="small vlast">${L("上一轮","Last round")}：${you}${L(`模拟受访者里 ${pa}% 选「${modName(last.a)}」，${pb}% 选「${modName(last.b)}」（n=${rs.length}）`,`${pa}% of simulated respondents picked ${modName(last.a)}, ${pb}% ${modName(last.b)} (n=${rs.length})`)} ${SIMTAG()}</p>`;}
function duelC(){if(!S.duel)newDuel();const d=S.duel,done=d.i>=d.pairs.length;
  const head=`<div class="vh"><div class="eyebrow">C · ${L("二选一","Pick one of two")}</div>
   <span class="dprog" aria-label="${L(`第 ${Math.min(d.i+1,DROUNDS)} / ${DROUNDS} 轮`,`Round ${Math.min(d.i+1,DROUNDS)} of ${DROUNDS}`)}">${d.pairs.map((_,k)=>`<i class="${k<d.i?"d":k===d.i?"c":""}"></i>`).join("")}</span></div><h3 class="vq">${L("如果广场多出 100 m²，你更想给哪一个？","If the square had 100 m² more, which use should get it?")}</h3>`;
  if(!done){const [a,b]=d.pairs[d.i];
    return head+`<div class="duel">${duelSide(a)}<span class="vs" aria-hidden="true">VS</span>${duelSide(b)}</div>
     <div class="pill" style="justify-content:center;margin-top:10px"><button data-duel="tie">${L("差不多","About the same")}</button><button data-duel="skip">${L("跳过","Skip")}</button></div>
     <p class="small muted" style="margin:8px 0 0;text-align:center">${L(`第 ${d.i+1} / ${DROUNDS} 轮 · 1,200 m² 的总面积不变`,`Round ${d.i+1} of ${DROUNDS} · the total stays 1,200 m²`)} ${chip("S2","p.23","sq1")}</p>${lastRoundNote()}`;}
  const r=duelRank(d.res),sr=V.sim?duelRank(duelsOf(simPool())).slice(0,3):[];
  return head+lastRoundNote()+`<p class="small" style="margin:4px 0 8px">${L("你的排序（按赢的比例）：","Your order (share of matchups won):")}</p>
   ${r.length?rankList(r):`<p class="small muted">${L("你都跳过了。","You skipped every round.")}</p>`}
   ${sr.length?`<p class="small" style="margin:8px 0 0">${L(`${simN()} 位模拟受访者的前三：`,`Top three among ${simN()} simulated respondents: `)}${sr.map(x=>T(x.m)).join(L("、",", "))} ${SIMTAG()}</p>`:""}
   <p class="small muted" style="margin:8px 0 0">${L("排序只说明你更想要哪个，不是面积。每次比的组合是从 10 项用途里随机抽的。","The order shows what you'd rather have, not areas. Pairs are drawn at random from the 10 uses.")}</p>
   <button class="btn" id="duelNew" style="margin-top:8px">↻ ${L("换一批再比","New pairs")}</button>`;}

/* ---------- send bar and free text (secondary) ---------- */
function sendBar(){const n=S.seen.length,dn=S.duel?S.duel.res.filter(r=>r.w!=="skip").length:0,subs=subsAll();
  return `<div class="sendbar"><div><b>${L(`你勾了 ${n} 条，比了 ${dn} 轮`,`You ticked ${n} and compared ${dn} pairs`)}</b><div class="small muted">${V.sent?esc(V.sent):subs.length?L(`本浏览器已保存 ${subs.length} 份演示提交，没有发送给 Council。`,`${subs.length} demo submission(s) saved in this browser only. Nothing was sent to Council.`):L("演示版只保存在你的浏览器里，不会发送给任何人。","In this demo your answers stay in your browser and are not sent anywhere.")}</div></div>
   <div class="sendbtns">${V.sent?`<button class="btn" data-tab="council">${L("看 Council 会收到什么 →","See what Council would receive →")}</button>`:""}<button class="btn primary" id="submit">${L("提交（演示）","Submit (demo)")}</button></div></div>`;}
function freeText(){return `<details class="vfree"><summary>${L("还想补充？写几句（可选）","Anything else? Write a few words (optional)")}</summary>
   <label class="f" for="exp">${L("你现在在这一带的体验是什么？比如晚上走、等车、带孩子、做生意。","What is it like around here now? Walking at night, waiting for a bus, with kids, running a shop.")}</label><textarea id="exp">${esc(S.exp)}</textarea>
   <label class="f" for="wish" style="margin-top:8px">${L("这个广场怎样才对你有用？","What would make this square work for you?")}</label><textarea id="wish">${esc(S.wish)}</textarea>
   <p class="small muted">${L("请不要写姓名、电话或住址。按“最少必要数据”原则，我们只问身份和可选的年龄段、邮编","Please leave out names, phone numbers and addresses. Under the minimum-data rule we only ask your role, and optionally age band and postcode")} ${chip("S5","p.30")}。</p></details>`;}
function voteSection(){return `<div class="vgrid"><div class="card vcard" id="voteA">${voteA()}</div><div class="card vcard" id="duelC">${duelC()}</div></div>
  <div class="card vcard" style="margin-top:14px"><div id="sendBox">${sendBar()}</div>${freeText()}</div>`;}
function voteRefresh(which){const m={voteA,duelC,sendBox:sendBar,tallyBox:tallyPanel};(which||Object.keys(m)).forEach(k=>{const e=document.getElementById(k);if(e)e.innerHTML=m[k]();});}

/* returns true when it handled the click */
function voteClick(b){const d=b.dataset;
  if(d.vtab){V.tab=d.vtab;V.more=false;voteRefresh(["voteA"]);return true;}
  if(d.vo){const i=S.seen.indexOf(d.vo);if(i>=0)S.seen.splice(i,1);else S.seen.push(d.vo);V.sent="";voteRefresh(["voteA","sendBox"]);return true;}
  if(d.vsim){V.sim=d.vsim==="1";store.set("cav_sim",V.sim);voteRefresh(["voteA","duelC","tallyBox"]);return true;}
  if(b.id==="vMore"){V.more=true;voteRefresh(["voteA"]);return true;}
  if(d.vplace){V.place=V.place===d.vplace?null:d.vplace;V.msg="";voteRefresh(["voteA"]);return true;}
  if(d.vissue){V.issue=V.issue===d.vissue?null:d.vissue;V.msg="";voteRefresh(["voteA"]);return true;}
  if(b.id==="vAdd"){if(!V.place||!V.issue){V.msg=L("先选地点和问题。","Pick a place and an issue first.");voteRefresh(["voteA"]);return true;}
    const ad=addedAll();let it=ad.find(a=>a.place===V.place&&a.issue===V.issue);
    if(!it){it={id:"u"+Date.now().toString(36),place:V.place,issue:V.issue};ad.push(it);store.set("cav_added",ad);}
    if(!S.seen.includes(it.id))S.seen.push(it.id);
    V.tab=addedObs().find(o=>o.id===it.id).card;V.place=V.issue=null;V.msg="";V.sent="";voteRefresh(["voteA","sendBox"]);return true;}
  if(d.duel){const D=S.duel;if(!D||D.i>=D.pairs.length)return true;const [a,b2]=D.pairs[D.i];D.res.push({a,b:b2,w:d.duel});D.i++;V.sent="";voteRefresh(["duelC","sendBox"]);return true;}
  if(b.id==="duelNew"){newDuel();voteRefresh(["duelC","sendBox"]);return true;}
  if(b.id==="vPreview"){V.preview=!V.preview;voteRefresh(["tallyBox"]);return true;}
  if(b.id==="clearVotes"){store.set("cav_subs",[]);store.set("cav_added",[]);S.seen=[];V.preview=false;V.sent="";voteRefresh(["tallyBox"]);return true;}
  return false;}
/* called after submitDemo() saved the votes: start fresh so votes are not counted twice */
function voteAfterSubmit(){const n=subsAll().length;S.seen=[];S.duel=null;V.sent=L(`已保存为本浏览器第 ${n} 份演示提交，没有发送给 Council。可以换个身份再投一次。`,`Saved as demo submission ${n} in this browser. Nothing was sent to Council. You can vote again as another role.`);}

/* ---------- Council view: tallies by option and by group, 10-person threshold per group ---------- */
const PRIV_N=10;
const pctOf=(a,b)=>b?Math.round(100*a/b):0;
function groupCell(label,g,f){return g.length<PRIV_N?`<span class="gh">${label} <small>${L("少于 10，隐藏","under 10, hidden")}</small></span>`:`<span>${label} <b>${f(g)}</b></span>`;}
function tallyList(rows,P,cards){if(!rows.length)return "";
  return `<ul class="tally">${rows.map(({o,c,s})=>`<li><div class="tl1"><span class="tag t-fact">${cards[o.card]}</span> <b>${esc(obsText(o))}</b> ${o.added?`<span class="tag t-design">${L("在本浏览器添加","Added in this browser")}</span>`:`<span class="tag t-design">${L("团队示例","Team example")}</span>`}</div>
     <div class="tl2"><span class="tbar"><span style="width:${pctOf(c,P.length)}%"></span></span><span class="tn">${c}<small>/${P.length}</small></span>${s?SIMTAG():""}</div>
     <div class="trole">${ROLES.map(r=>groupCell(T(r),P.filter(x=>x.role===r.id),g=>pctOf(cntIn(o.id,g),g.length)+"%")).join("")}</div>
     ${saysLine(o)}<div class="ob-f">${roleTag(o.role)} <span class="small muted">${esc(roleName(o.role))}</span></div></li>`).join("")}</ul>`;}
function tallyPanel(){const P=pool(),n=P.length,mine=mineAll().length,show=n>=PRIV_N||V.preview,ST=V.sim?SIMTAG():"";
  const head=`<div class="vsimrow">${simToggle()}</div>
   <p class="small muted">${V.sim?L(`共 ${n} 份：${n-mine} 份模拟 + ${mine} 份本浏览器的演示提交。`,`${n} in all: ${n-mine} simulated + ${mine} demo submission(s) from this browser.`):L("只算本浏览器里的演示提交，从 0 开始。","Only demo submissions from this browser, starting at 0.")} ${L("每条选项都保留“Council 说”的出处和分工。","Every option keeps its Council source and who delivers it.")}</p>
   ${V.sim?aboutData():""}
   <div class="thr"><div class="thrn">${n}<small>/${PRIV_N}</small></div><div class="thrbar"><span style="width:${Math.min(100,n*10)}%"></span></div>${ST}</div>`;
  if(!n) return head+`<p>${L("还没有演示提交。到“居民故事板”第 4 章勾几条、比几轮，再点“提交（演示）”。","No demo submissions yet. In the resident storyboard, chapter 4, tick a few items, compare a few pairs, then press Submit (demo).")}</p>`;
  const gate=n<PRIV_N?`<div class="banner vgate"><b>${L("少于 10 份。","Fewer than 10.")}</b> ${L("正式版在这之前不显示任何汇总，免得能认出个人。","The full version shows no summary before this, so no one can be singled out.")}
     <button class="btn" id="vPreview">${V.preview?L("隐藏演示预览","Hide demo preview"):L("看演示预览","Show demo preview")}</button></div>`:"";
  if(!show) return head+gate;
  const cards={square:L("广场","Square"),china:L("唐人街","Chinatown"),traffic:L("交通","Traffic")};
  const S0=V.sim?simPool():[];
  const rows=allObs().map(o=>({o,c:cntIn(o.id,P),s:cntIn(o.id,S0)})).sort((x,y)=>y.c-x.c);
  const roles=ROLES.map(r=>[r,P.filter(x=>x.role===r.id)]);
  const ages=AGES.map(a=>[a,P.filter(x=>x.age===a)]).concat([[L("未填","Not given"),P.filter(x=>!x.age)]]).filter(([,g])=>g.length);
  return head+gate+`${V.preview&&n<PRIV_N?`<p class="small"><span class="tag t-gap">${L("预览：正式版不会显示","Preview: the full version would hide this")}</span></p>`:""}
   <h3 class="vt">A · ${L("“我也遇到过”：按选项和身份","“Me too”: by option and role")} ${ST}</h3>
   <p class="small muted">${L("身份那一行是该身份里勾选的比例。每个身份满 10 人才显示。","The role line shows the share of each role that ticked it. A role shows only once it has 10 or more people.")}</p>
   ${tallyList(rows.filter(r=>r.c),P,cards)||`<p class="small muted">${L("还没有人勾选。","Nothing ticked yet.")}</p>`}
   ${rows.some(r=>!r.c)?`<details class="vfree" style="margin-top:8px"><summary>${L(`另外 ${rows.filter(r=>!r.c).length} 条还是 0 票`,`${rows.filter(r=>!r.c).length} more with 0 votes`)}</summary>${tallyList(rows.filter(r=>!r.c),P,cards)}</details>`:""}
   <h3 class="vt">C · ${L("二选一：各用途赢的比例","Pick one of two: share of matchups won")} ${ST}</h3>
   ${(()=>{const rk=duelRank(duelsOf(P));return rk.length?rankList(rk):`<p class="small muted">${L("还没有二选一结果。","No pairwise results yet.")}</p>`;})()}
   <h3 class="vt">${L("按身份：二选一前三","By role: top three uses")} ${ST}</h3>
   <ul class="vgroups">${roles.map(([r,g])=>`<li>${groupCell(`${T(r)} (${g.length<PRIV_N?"<10":g.length})`,g,gg=>duelRank(duelsOf(gg)).slice(0,3).map(x=>T(x.m)).join(L("、",", "))||"—")}</li>`).join("")}</ul>
   <h3 class="vt">${L("按年龄段","By age band")} ${ST}</h3>
   <p class="small">${ages.map(([a,g])=>g.length<PRIV_N?`${esc(a)} <span class="muted">&lt;10</span>`:`${esc(a)} <b>${g.length}</b>`).join(" · ")}</p>
   <p class="small muted">${L("少于 10 人的组只显示“<10”，不给具体数字或票数。","Groups under 10 show only “<10”, with no exact count or votes.")}</p>
   <p class="small muted">${L("分工 D / D+P / P / A 是团队按 Smart City Strategy 的分类做的判断","D / D+P / P / A is the team's reading of the Smart City Strategy's split")} ${chip("S5","p.33")} <span class="tag t-design">${L("假设","Assumption")}</span></p>
   ${mine?`<button class="btn" id="clearVotes">${L("清除本浏览器的演示票和添加项","Clear demo votes and added items in this browser")}</button>`:""}`;}


/* ===== variants/council.js: Council backend and evidence ledger (demo) =====
   Everything here is demo state saved in this browser. A review decision is recorded as made by a
   team member, never as Council approval. No figure comes from outside S1–S5: every count on these
   pages is counted from this page's own data or from demo submissions in this browser.
   Names start with cb / CB so they stay clear of the other shared files. */
const CB_MIN=10;                       // privacy threshold: a group is shown only at 10 or more
const CB={filter:"all",pick:null,preview:false};
const cbSubs=()=>store.get("cav_subs")||[];
const cbWhen=t=>new Date(t).toLocaleString(S.lang==="zh"?"zh-CN":"en-AU",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const cbClaim=id=>CLAIMS.find(c=>c.id===id);
const cbPreview=()=>CB.preview;
const cbMedian=xs=>{const s=xs.slice().sort((a,b)=>a-b),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0;};

/* ---------- review state: ok | edit | rej, plus gap for claims that have no source ---------- */
function cbRev(){return store.get("cav_review")||{};}
function cbState(c){return !c.src?"gap":(cbRev()[c.id]||{}).st||"ok";}
function cbShown(id){const c=cbClaim(id);return !c||cbState(c)==="ok"||cbState(c)==="gap";}
function cbHeldLi(){return `<li class="cb-held"><span class="tag t-gap">${L("未通过核对","Held back")}</span> ${L("这一条在后台被退回或驳回，暂不向居民显示。（演示里保留这行占位，正式版直接不显示。）","A reviewer sent this claim back or rejected it, so residents do not see it. (The demo keeps this placeholder; the full version shows nothing.)")}</li>`;}
function cbSet(id,st,why){const r=cbRev();r[id]={st,why:why||"",at:Date.now()};store.set("cav_review",r);}
const cbNoPage=c=>!!c.src&&!c.pg&&c.src!=="S3";      // S3 is a web page, so it has no page numbers
function cbCounts(){const k={total:CLAIMS.length,sourced:0,ok:0,edit:0,rej:0,gap:0,nopage:0};

  edit:[["word",L("措辞要改","Wording needs work")],["page",L("要补页码","Needs a page number")],["lang",L("中英文不一致","Chinese and English differ")],["quote",L("要补原文","Needs the original wording")]]});
const cbStateT=st=>({ok:L("团队已核对","Team-checked"),edit:L("需修改","Needs edit"),rej:L("已驳回","Rejected"),gap:L("证据空白","Evidence gap")}[st]);

/* ---------- ledger: filters, groups, one row per claim ---------- */

function cbRow(c){const st=cbState(c),r=cbRev()[c.id],pick=CB.pick&&CB.pick.id===c.id?CB.pick.st:null,card=CARDS.find(x=>x.id===c.card);

  return `<article class="cb-row cbs-${st}" id="lr-${c.id}">

   ${CB.filter==="nopage"?`<p class="small muted">${L("S4 是 PDF，但我们整理这些条目时没有记页码。证据标准要求来源能定位，所以这里把它们列出来，等补上页码。","S4 is a PDF, but we did not record page numbers when compiling these claims. The evidence standard asks for a source that can be located, so they are listed here until the pages are added.")} ${chip("S1","p.13")}</p>`:""}

   ${st(`data-tab="res"`,4,L("居民端","Residents"),L("只显示通过核对的条目","Only claims that passed review are shown"),`<span class="tag t-design">${L(`${k.ok} 条显示 · ${k.edit+k.rej} 条不显示`,`${k.ok} shown · ${k.edit+k.rej} hidden`)}</span>`)}

function cbStandard(){const k=cbCounts(),tag=(c,t)=>`<span class="tag ${c}">${t}</span>`,done=tag("t-fact",L("已做","Done")),part=tag("t-infer",L("部分","Partly")),todo=tag("t-gap",L("还没做","Not yet"));

   [L("清洗过程","Cleaning"),L(`条目是人工摘录的，没有自动清洗；${k.nopage} 条 S4 条目还缺页码`,`Claims were extracted by hand with no automated cleaning; ${k.nopage} S4 claims still lack a page number`),part],
   [L("缺失或有偏的群体","Missing or biased groups"),L("演示没有真实提交；投票汇总用的是标明的模拟数据。代表性检查的版式在 Council 后台，ABS 数据还没读","The demo has no real submissions; the vote tally uses simulated data, labelled as such. The representativeness check is laid out in the Council backend; the ABS data is not read yet"),todo],
   [L("至少一个人工验证步骤","At least one human check"),L(`本清单逐条核对：${k.ok} / ${k.sourced} 条通过。核对人是团队成员，不是 Council`,`This ledger, claim by claim: ${k.ok} of ${k.sourced} passed. The reviewer is a team member, not Council`),done],
   [L("AI 使用情况","Use of AI"),L("演示页面运行时不调用 AI：条目来自来源原文，数字由透明公式算出。正式版由 AI 提取和起草，规划师批准","The demo page calls no AI when it runs: claims come from the source wording and figures from an open formula. In the full version AI extracts and drafts, and a planner approves"),done],
   [L("区分事实、假设和生成内容","Facts, assumptions and generated content kept apart"),L("四种标签：来源原文、我们的设计、假设、证据空白","Four tags: source wording, our design, assumption, evidence gap"),done]];
  return `<p class="small muted">${L("赛题对每份数据的要求，和本演示做到哪一步。","What the brief asks of each dataset, and how far this demo gets.")} ${chip("S1","p.13")}</p>
   <div class="cb-kv h"><span>${L("要求","Requirement")}</span><span>${L("本演示","This demo")}</span><span>${L("状态","Status")}</span></div>
   ${rows.map(r=>`<div class="cb-kv"><b>${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span></div>`).join("")}`;}

   <section><div class="sec-h"><h2>${L("正式版流程","How the full version works")}</h2><span class="small muted">${L("点一步，跳到对应的地方","Tap a step to go there")}</span></div>${cbPipe()}</section>
   <section class="card" id="cb-ledger"><div class="sec-h"><h2>${L("证据核对清单","Evidence ledger")} (${CLAIMS.length})</h2><span class="small muted">${L("驳回或退回一条，再回居民故事板看：那一条不再显示。","Reject or send back a claim, then look at the resident storyboard: it is no longer shown.")}</span></div>${cbLedger()}</section>

   <section class="card"><div class="sec-h"><h2>${L("模型系数","Model coefficients")}</h2>${ASSUME()}</div>${coefTable()}</section></div>`;}

  const tile=(attr,num,t,s,cls)=>`<button class="cb-tile ${cls||""}" ${attr}><span class="cb-tn">${num}</span><span class="cb-tt">${t}</span><small>${s}</small></button>`;

   ${tile(`data-cb="filter" data-val="${k.rej&&!k.edit?"rej":"edit"}"`,held,L("条目被退回或驳回","Sent back or rejected"),L("居民端不显示","Hidden from residents"),held?"warn":"")}
   ${tile(`data-cb="go" data-val="council#cb-p"`,`${p.keep}<i>/5</i>`,L("原则保持","Principles kept"),p.weak+p.fail?L(`削弱 ${p.weak} · 不满足 ${p.fail}`,`${p.weak} weakened · ${p.fail} not met`):L("当前分配没有削弱任何一条","The current split weakens none"),p.fail?"bad":p.weak?"warn":"")}
   ${tile(`data-cb="go" data-val="council#cb-fb"`,n,L("演示提交","Demo submissions"),g.ok?L(`${g.ok} 个群体达到 ${CB_MIN} 份`,`${g.ok} group(s) reached ${CB_MIN}`):L(`还没有群体达到 ${CB_MIN} 份`,`No group has reached ${CB_MIN} yet`))}
   ${tile(`data-cb="go" data-val="council#cb-gaps"`,GAPS().length,L("证据空白","Evidence gaps"),L("列出来，不用估算填上","Listed, not filled with estimates"))}</div>`;}
function cbTodo(){const k=cbCounts(),items=[],go=v=>`data-cb="go" data-val="council#${v}"`;
  if(k.edit) items.push([L(`${k.edit} 条条目被退回修改，改好后要重新批准`,`${k.edit} claim(s) were sent back; they need approving again once fixed`),`data-cb="filter" data-val="edit"`,L("去台账","Open the ledger")]);

/* ---------- resident feedback: per-group threshold, summary, representativeness ---------- */
function cbReact(subs,cid){const c={yes:0,unsure:0,no:0};subs.forEach(s=>{const v=(s.react||{})[cid];if(v in c)c[v]++;});return c;}
function cbReactRow(subs,cd){const c=cbReact(subs,cd.id),n=subs.length,said=c.yes+c.unsure+c.no,w=v=>n?100*v/n:0;
  return `<div class="cb-line"><b>${T(cd)}</b><div class="cb-bar" aria-hidden="true"><span class="cb-y" style="width:${w(c.yes)}%"></span><span class="cb-u" style="width:${w(c.unsure)}%"></span><span class="cb-no" style="width:${w(c.no)}%"></span></div>
   <small>${L(`支持 ${c.yes} · 不确定 ${c.unsure} · 有顾虑 ${c.no} · 没表态 ${n-said}`,`Support ${c.yes} · Not sure ${c.unsure} · Concerned ${c.no} · No view ${n-said}`)}</small></div>`;}
function cbSummary(subs){const n=subs.length,gsumOf=(a,g)=>MODULES.filter(m=>m.g===g).reduce((s,m)=>s+(+a[m.id]||0),0);
  const pr=pCheckData(PRESETS.base.a).map((r,i)=>{const sts=subs.map(s=>pCheckData(s.a)[i].st);return {ids:r.ids,weak:sts.filter(x=>x==="weak").length,fail:sts.filter(x=>x==="fail").length};});
  const pri=DIMS.map(d=>({d,k:subs.filter(s=>(s.pri||[]).includes(d.id)).length})).filter(x=>x.k).sort((x,y)=>y.k-x.k);
  return `<div class="cb-blk"><h3>${L("对总规三件事的态度","Views on the plan's three items")}</h3>${CARDS.map(cd=>cbReactRow(subs,cd)).join("")}</div>
   <div class="cb-blk"><h3>${L("提交的分法：四大类面积的中位数","Submitted splits: median area by group")}</h3>
    ${Object.keys(GROUPS).map(g=>{const md=cbMedian(subs.map(s=>gsumOf(s.a,g))),b0=gsumOf(PRESETS.base.a,g);
      return `<div class="cb-line"><b style="color:${GROUPS[g].c}">${T(GROUPS[g])}</b> <span class="cb-mono">${L("方案 0","Scenario 0")} ${fmt(b0)} m² → ${L("中位数","median")} ${fmt(md)} m²</span></div>`;}).join("")}</div>
   <div class="cb-blk"><h3>${L("这些分法对总规原则的影响","What these splits do to the plan's principles")}</h3>
    ${pr.map(r=>`<div class="cb-line"><b>${r.ids.join(" · ")}</b> <span class="cb-mono">${L(`${n} 份里：削弱 ${r.weak} 份 · 不满足 ${r.fail} 份`,`Of ${n}: weakened in ${r.weak} · not met in ${r.fail}`)}</span></div>`).join("")}</div>
   <div class="cb-blk"><h3>${L("最在乎的维度","Dimensions people care about most")}</h3><p class="small">${pri.length?pri.map(x=>`${T(x.d)} ${x.k}`).join(" · "):"—"}</p></div>`;}
function cbRep(subs,show){const known=subs.filter(s=>s.lang),zh=known.filter(s=>s.lang==="zh").length;
  const no=`<span class="muted">${L("不能比较","Cannot be compared")}</span>`,gap=`<span class="tag t-gap">${L("证据空白","Evidence gap")}</span>`;
  const rows=[
   [`${L("56.4% 的居民在家说英语以外的语言（2021）","56.4% of residents speak a language other than English at home (2021)")} ${chip("S5","p.16–17")}`,
    L("用中文界面提交的份数。只是代理指标：界面语言不等于在家说的语言","Submissions made in the Chinese interface. A proxy only: interface language is not language at home"),
    show&&known.length?L(`${zh} / ${known.length} 份用中文界面`,`${zh} of ${known.length} used the Chinese interface`):`<span class="muted">${L(`不足 ${CB_MIN} 份，不计算`,`Fewer than ${CB_MIN}: not worked out`)}</span>`],
   [`${L("华人背景占 22.3%，是 LGA 最大的文化群体","22.3% Chinese ancestry, the LGA's largest cultural group")} ${chip("S3","")}`,L("本原型不问文化背景","This prototype does not ask about cultural background"),no],
   [`${L("各身份（居民、商户、通勤者、访客）在人口里的占比","Share of each role (resident, business, commuter, visitor) in the population")} ${gap}`,L("我们收集了身份，但来源里没有对应的基准","We collect the role, but no source gives a matching benchmark"),no],
   [`${L("年龄段、在家说的语言：ABS Census","Age bands and language at home: ABS Census")} <span class="tag t-infer">${L("来源待读","Source not read yet")}</span>`,L("读完 ABS 后再对比；这一版没有问年龄段","To compare once the ABS data is read; this version does not ask for an age band"),no]];
  return `<div class="cb-blk" id="cb-rep"><h3>${L("代表性检查","Representativeness check")}</h3>
   <p class="small muted">${L("正式版对比 ABS Census 的人口结构。ABS 数据我们还没读，所以这里只用手上来源里的两个数字做基准，不写任何没有来源的人口数字。","The full version compares against ABS Census profiles. We have not read the ABS data yet, so only two figures from sources we hold serve as benchmarks, and no unsourced population figure is stated.")}</p>
   <div class="cb-kv h"><span>${L("基准","Benchmark")}</span><span>${L("我们手上能比的","What we can set against it")}</span><span>${L("现在","Now")}</span></div>
   ${rows.map(r=>`<div class="cb-kv"><span>${r[0]}</span><span>${r[1]}</span><span>${r[2]}</span></div>`).join("")}</div>`;}
function cbFeedback(){const subs=cbSubs(),n=subs.length,g=cbGroups(),pv=cbPreview(),show=n>=CB_MIN||(pv&&n>0);
  const head=`<p class="small muted">${L(`同一群体达到 ${CB_MIN} 份才显示汇总，免得从汇总里认出个人。这一栏只算本浏览器里的演示提交（分法、态度、最在乎的维度），不含模拟票，也没有发送给任何人。`,`A group's summary shows only once it reaches ${CB_MIN}, so no one can be picked out. This card counts only demo submissions saved in this browser (splits, views, top concerns). It leaves out the simulated votes, and nothing is sent anywhere.`)}</p>
   <div class="cb-thr"><b>${n}</b><span>${L("份演示提交","demo submission(s)")}</span></div>
   <ul class="cb-grps">${g.rows.map(x=>`<li><span>${T(x.r)}</span><span class="${x.n>=CB_MIN?"ok":"muted"}">${x.n>=CB_MIN?L(`≥ ${CB_MIN} · 可单独显示`,`≥ ${CB_MIN} · shown on its own`):L(`< ${CB_MIN} · 已隐藏`,`< ${CB_MIN} · hidden`)}</span></li>`).join("")}</ul>`;
  let body;
  if(!n) body=`<div class="cb-ghost"><b>${L("还没有演示提交。","No demo submissions yet.")}</b> ${L(`达到 ${CB_MIN} 份后，这里会显示：`,`Once there are ${CB_MIN}, this shows:`)}
     <ul><li>${L("居民对总规三件事的态度：支持、不确定、有顾虑","Views on the plan's three items: support, not sure, concerned")}</li><li>${L("提交的分法里，四大类面积的中位数","Median area by group across the submitted splits")}</li><li>${L("这些分法削弱了哪条总规原则","Which plan principles those splits weaken")}</li></ul>
     <button class="btn cb-sm" data-cb="go" data-val="res#c-say">${L("去居民故事板提交一份","Go and submit one as a resident")} →</button></div>`;
  else body=`${n<CB_MIN?`<div class="cb-gate"><span><b>${L(`不足 ${CB_MIN} 份。`,`Fewer than ${CB_MIN}.`)}</b> ${L("正式版在这之前不显示任何汇总。","The full version shows no summary before this.")}</span><button class="btn cb-sm" data-cb="preview">${pv?L("收起演示预览","Hide the demo preview"):L("看演示预览","Show a demo preview")}</button></div>`:""}
    ${show?`${n<CB_MIN?`<p class="small" style="margin-top:8px"><span class="tag t-gap">${L("预览：正式版不会显示","Preview: the full version would hide this")}</span></p>`:""}${cbSummary(subs)}
      ${g.rows.filter(x=>x.n>=CB_MIN).map(x=>`<div class="cb-blk"><h3>${T(x.r)} (${x.n})</h3>${CARDS.map(cd=>cbReactRow(subs.filter(s=>s.role===x.r.id),cd)).join("")}</div>`).join("")}`:""}
    <button class="btn cb-sm" id="clearSubs" style="margin-top:12px">${L("清除本浏览器的演示提交","Clear demo submissions in this browser")}</button>`;
  return head+body+cbRep(subs,show);}

/* ---------- written comments: one next step each ---------- */
const cbRoutes=()=>store.get("cav_triage")||{};
const CB_ROUTES=()=>[["",L("还没定","Not decided")],["D",L("交给广场设计（D）","To the square's design (D)")],["P",L("找伙伴一起做（P）","Take to partners (P)")],["A",L("写进倡导简报（A）","Into the advocacy brief (A)")],["gap",L("记为证据空白","Log as an evidence gap")],["none",L("无需处理","No action needed")]];
function cbTexts(){const out=[];cbSubs().forEach(s=>{
  if(s.exp&&s.exp.trim())out.push({k:s.t+"e",q:L("现在在这一带的体验","What it is like here now"),txt:s.exp.trim()});
  if(s.wish&&s.wish.trim())out.push({k:s.t+"w",q:L("广场怎样才有用","What would make the square work"),txt:s.wish.trim()});});return out;}
function cbTriage(){const xs=cbTexts(),rt=cbRoutes(),cnt=k=>xs.filter(x=>(rt[x.k]||"")===k).length;
  const note=`<p class="small muted">${L("每条文字意见由规划师选一个去向。这里不显示身份等信息，免得从一条意见认出个人。正式版由 AI 建议主题，规划师确认；演示版不用 AI。","A planner picks one next step for each written comment. Role and other details are left out so a single comment cannot identify a person. In the full version AI suggests themes and a planner confirms; the demo uses no AI.")}</p>`;
  if(!xs.length) return note+`<div class="cb-ghost">${L("还没有文字意见。居民在故事板第 4 章写的两段话会出现在这里。","No written comments yet. The two answers residents write in chapter 4 of the storyboard appear here.")}</div>`;
  return note+`<p class="small">${CB_ROUTES().map(([k,t])=>`${t} ${cnt(k)}`).join(" · ")}</p>
   <ul class="cb-tri">${xs.map(x=>`<li><div class="small muted">${x.q}</div><p>“${esc(x.txt)}”</p><label>${L("去向","Next step")} <select data-cbroute="${x.k}">${CB_ROUTES().map(([k,t])=>`<option value="${k}"${(rt[x.k]||"")===k?" selected":""}>${t}</option>`).join("")}</select></label></li>`).join("")}</ul>`;}

 {id:"tr6",to:L("TfNSW：交通研究的合作方","TfNSW, Council's partner in the traffic study"),toC:[["S2","p.54"]],
  ask:L("把广场周边的步行过街和路缘接驳，写进交通研究的范围。","Put walking crossings and kerbside access around the square into the scope of the traffic study.")},
 {id:"tr7",to:L("由 Council 确定","For Council to decide"),toC:[],
  ask:L("第二期总规研究车站和 Argyle St 公交换乘站时，把走到广场的这一段一起考虑。","When Phase 2 looks at the station and the Argyle St bus interchange, include the walk to the square.")},
 {id:"sq10",to:L("州和联邦政府：拨款","State and Federal governments: grants"),toC:[["S2","p.54","sq10"]],

   <div class="cb-roles">${tiers.map(([k,t,d])=>`<div class="cb-role"><b>${k}</b><span class="t">${t}</span><div class="big">${fmt(by[k])} m²</div><small>${d}</small></div>`).join("")}
    <div class="cb-role a"><b>A</b><span class="t">${L("向州政府等争取","Advocate to others")}</span><div class="big">${L(`${CB_ASKS().length} 件事`,`${CB_ASKS().length} asks`)}</div>
     <ul>${CB_ASKS().map(a=>{const c=cbClaim(a.id);return cbShown(a.id)?`<li>${T(c)} ${chip(c.src,c.pg,c.id)}</li>`:`<li class="cb-held">${L("依据的条目未通过核对，先不列入。","The claim behind this did not pass review, so it is left out for now.")} <button class="cb-link" data-cb="filter" data-val="${cbState(c)}">${L("去台账","Open the ledger")}</button></li>`;}).join("")}</ul></div></div>
   <p class="small" style="margin:10px 0 2px"><b>${L("另外两件事不在广场里面，要等 Council 的其他工作和社区伙伴：","Two more things sit outside the square and wait on other Council work and community partners:")}</b></p>${claimsById(["ct6","ct7"])}`;}

/* ---------- advocacy brief: a template draft from approved claims, approved by a person ---------- */
function cbBriefSig(){return JSON.stringify([["sq1"].concat(CB_ASKS().map(a=>a.id)).map(id=>id+cbState(cbClaim(id))),cbSubs().length,Object.values(cbRoutes()).filter(v=>v==="A").length]);}
function cbBriefState(){const b=store.get("cav_brief");return !b?"none":b.st==="ok"&&b.sig!==cbBriefSig()?"stale":b.st;}
function cbBriefDoc(){const subs=cbSubs(),n=subs.length,c=cbReact(subs,"traffic"),routed=Object.values(cbRoutes()).filter(v=>v==="A").length,our=`<span class="tag t-design">${L("我们的设计","Our design")}</span>`;
  const fact=id=>{const x=cbClaim(id);return `${T(x)} ${chip(x.src,x.pg,x.id)}`;};
  return `<div class="cb-doc"><h4>${L("倡导简报草稿：Woodhouse Square 需要其他方配合的事","Advocacy brief, draft: what Woodhouse Square needs from others")}</h4>
   <p class="small muted">${L("演示草稿，不是 Council 文件。发不发、发给谁，由 Council 决定。依据的战略行动：3.1.2 用数据向 NSW 政府倡导改善出行","A demo draft, not a Council document. Whether it is sent, and to whom, is for Council. Strategy action behind it: 3.1.2, use data to advocate to the NSW Government for better mobility")} ${chip("S5","p.44")}</p>
   <h5>1 · ${L("背景","Background")}</h5><p>${cbShown("sq1")?fact("sq1"):L("（背景条目未通过核对，不能引用。）","(The background claim did not pass review and cannot be quoted.)")}</p>
   <h5>2 · ${L("请求","Asks")}</h5><ol>${CB_ASKS().map(a=>cbShown(a.id)?`<li><b>${L("事实：","Fact:")}</b> ${fact(a.id)}<br><b>${L("请求：","Ask:")}</b> ${a.ask} ${our}<br><span class="small muted">${L("对象：","To:")} ${a.to} ${a.toC.map(x=>chip(x[0],x[1],x[2])).join(" ")}</span></li>`
     :`<li class="cb-held">${L("这一项依据的条目未通过核对，已从简报里拿掉。","The claim behind this ask did not pass review, so the ask is left out.")}</li>`).join("")}</ol>
   <h5>3 · ${L("居民意见","What residents said")}</h5><p>${n>=CB_MIN?L(`对“为行人改造交通”：支持 ${c.yes} · 不确定 ${c.unsure} · 有顾虑 ${c.no}（共 ${n} 份，是本浏览器里的演示提交，不是真实居民数据）。`,`On “Traffic changes for pedestrians”: support ${c.yes} · not sure ${c.unsure} · concerned ${c.no} (${n} in all; demo submissions in this browser, not real resident data).`):L(`演示提交不足 ${CB_MIN} 份，简报不引用居民数据。`,`Fewer than ${CB_MIN} demo submissions, so the brief quotes no resident data.`)}${routed?" "+L(`另有 ${routed} 条文字意见被分到倡导事项。`,`${routed} written comment(s) were also routed to advocacy.`):""}</p>
   <h5>4 · ${L("还缺的证据","Evidence still missing")}</h5><ul>${GAPS().filter(g=>g.id==="g-traffic"||g.id==="g-fund").map(g=>`<li>${g.t} ${g.chips.map(x=>chip(x[0],x[1],x[2])).join(" ")}</li>`).join("")}</ul></div>`;}
function cbBrief(){const st=cbBriefState(),b=store.get("cav_brief"),btn=(v,t,p)=>`<button class="btn cb-sm${p?" primary":""}" data-cb="brief" data-val="${v}">${t}</button>`;
  const stT={none:[L("还没有草稿","No draft yet"),"cb-neutral"],draft:[L("草稿 · 等人工批准","Draft · waiting for a person to approve"),"t-infer"],ok:[L("已批准","Approved"),"t-fact"],stale:[L("批准后内容变了 · 要重新批准","Changed since approval · approve again"),"t-gap"]}[st];
  return `<div class="cb-briefbox"><div class="sec-h"><h3>${L("倡导简报","Advocacy brief")}</h3><span class="tag ${stT[1]}">${stT[0]}</span></div>
   <p class="small muted">${L("正式版由 AI 起草，规划师批准后才能发出。演示版按模板把通过核对的条目拼成草稿，页面没有调用 AI；每句事实都带来源。","In the full version AI drafts it and a planner must approve before it goes out. The demo fills a template with claims that passed review and calls no AI; every fact keeps its source.")}</p>
   ${st==="none"?`<div class="cb-ghost">${L(`草稿会包含：背景、${CB_ASKS().length} 条请求（每条配一条有来源的事实）、居民意见、还缺的证据。`,`The draft will hold: background, ${CB_ASKS().length} asks (each with a sourced fact), what residents said, and the evidence still missing.`)}</div><div class="cb-acts" style="margin-top:8px">${btn("make",L("生成草稿","Make the draft"),1)}</div>`
    :`${cbBriefDoc()}<div class="cb-acts">${st==="ok"?`<span class="small">${L("批准人：团队成员（演示）","Approved by: a team member (demo)")} · ${cbWhen(b.at)}</span>${btn("make",L("撤回批准","Withdraw approval"))}`:`${btn("approve",st==="stale"?L("重新批准（团队成员，演示）","Approve again (team member, demo)"):L("批准（团队成员，演示）","Approve (team member, demo)"),1)}${btn("drop",L("丢弃草稿","Discard the draft"))}`}</div>`}</div>`;}

/* ---------- strategy indicators with "Baseline TBC" (S5) ---------- */
function cbIndicators(){const subs=cbSubs(),n=subs.length,show=n>=CB_MIN||(cbPreview()&&n>0),c=cbReact(subs,"traffic");
  const hid=`<span class="muted">${L(`不足 ${CB_MIN} 份，不显示`,`Fewer than ${CB_MIN}: not shown`)}</span>`,none=`<span class="tag t-gap">${L("还没有对应的问题","No matching question yet")}</span>`;
  const rows=[
   [L("社区对气候适应措施的满意度","Community satisfaction with climate adaptation measures"),"p.39",L("把“遮荫面积”或“雨水滞留”选为最在乎的份数。只说明在乎，不等于满意","Submissions that pick shaded area or stormwater as a top concern. This shows concern, not satisfaction"),
    show?L(`${subs.filter(s=>(s.pri||[]).some(p=>p==="shade"||p==="storm")).length} / ${n} 份`,`${subs.filter(s=>(s.pri||[]).some(p=>p==="shade"||p==="storm")).length} of ${n}`):hid],

    show?L(`支持 ${c.yes} · 不确定 ${c.unsure} · 有顾虑 ${c.no}`,`Support ${c.yes} · Not sure ${c.unsure} · Concerned ${c.no}`):hid],
   [L("包含智慧基础设施的公共领域项目占比","Share of public domain projects that include smart infrastructure"),"p.51",L("不靠居民输入。广场如果保留智慧照明与传感器，可以算作一个项目","Not from resident input. If the square keeps smart lighting and sensors it can count as one project"),`<span class="muted">${L("由 Council 统计","For Council to count")}</span>`],
   [L("社区和访客对寻路的满意度","Community and visitor satisfaction with wayfinding"),"p.63",L("可以在提交前加一题","A question could be added before submitting"),none],
   [L("社区对 Council 数字体验的满意度","Community satisfaction with Council's digital experience"),"p.63",L("可以在提交后加一题，问这个工具好不好用","A question could be added after submitting, asking how the tool worked for them"),none]];

   <div class="cb-kv h"><span>${L("战略指标（基线待定）","Strategy indicator (baseline TBC)")}</span><span>${L("可用的居民输入","Resident input that could feed it")}</span><span>${L("现在","Now")}</span></div>
