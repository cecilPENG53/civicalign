<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicAlign Design Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Shared tokens and components for the three CivicAlign variants.
   Navy civic chrome, a green "evidence" accent, four use-group colours from GROUPS. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#e9eef3; --fg:#13202e; --muted:#566476; --line:#d3dce5;
  --chrome:#0e1c33; --chrome-2:#18294a; --chrome-3:#243a63; --chrome-fg:#eaf0f9; --chrome-mut:#9fb0cb;
  --accent:#1f6b57; --accent-soft:#d8ece4; --on-accent:#ffffff;
  --base:#8e9bab; --fact:#1f6b57; --fact-bg:#dcefe6; --infer:#93580a; --infer-bg:#fbecd2;
  --design:#2c5aa0; --design-bg:#dfe8f7; --gap:#b23a3a; --gap-bg:#f8dfdf;
  --map-bg:#e7ecf0; --map-bld:#cfd7de; --map-road:#ffffff; --map-road-edge:#c2ccd6; --map-green:#cfe6c9; --map-rail:#6d7a86;
  --p-base:#e4e9f0; --p-base-fg:#23324a; --p-green:#e0f1e2; --p-green-fg:#245a2c; --p-night:#fbecd6; --p-night-fg:#7a4a0c;
  --shadow:0 1px 2px rgba(16,32,52,.06),0 6px 18px rgba(16,32,52,.07);
  --f-display:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b121b; --surface:#121c28; --surface-2:#1a2635; --fg:#e4ebf3; --muted:#98a7b9; --line:#283749;
  --chrome:#070e19; --chrome-2:#101d33; --chrome-3:#1c3054; --chrome-fg:#e4ebf6; --chrome-mut:#8ea1bf;
  --accent:#6cc3a6; --accent-soft:#183a30; --on-accent:#08140f;
  --base:#66768a; --fact:#7fd0b2; --fact-bg:#173629; --infer:#f0b257; --infer-bg:#3a2c14; --design:#8fb3f0; --design-bg:#1b2944; --gap:#f08a8a; --gap-bg:#3d1f1f;
  --map-bg:#141f2b; --map-bld:#2a3847; --map-road:#3a4a5c; --map-road-edge:#243142; --map-green:#21402c; --map-rail:#8b9aab;
  --p-base:#1f2c3f; --p-base-fg:#d6e0ee; --p-green:#1d3a25; --p-green-fg:#bfe5c4; --p-night:#3a2c14; --p-night-fg:#f2cf98;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b121b; --surface:#121c28; --surface-2:#1a2635; --fg:#e4ebf3; --muted:#98a7b9; --line:#283749;
  --chrome:#070e19; --chrome-2:#101d33; --chrome-3:#1c3054; --chrome-fg:#e4ebf6; --chrome-mut:#8ea1bf;
  --accent:#6cc3a6; --accent-soft:#183a30; --on-accent:#08140f;
  --base:#66768a; --fact:#7fd0b2; --fact-bg:#173629; --infer:#f0b257; --infer-bg:#3a2c14; --design:#8fb3f0; --design-bg:#1b2944; --gap:#f08a8a; --gap-bg:#3d1f1f;
  --map-bg:#141f2b; --map-bld:#2a3847; --map-road:#3a4a5c; --map-road-edge:#243142; --map-green:#21402c; --map-rail:#8b9aab;
  --p-base:#1f2c3f; --p-base-fg:#d6e0ee; --p-green:#1d3a25; --p-green-fg:#bfe5c4; --p-night:#3a2c14; --p-night-fg:#f2cf98;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.tag{display:inline-block;font-size:11.5px;line-height:1.5;border-radius:4px;padding:0 6px;font-weight:500;white-space:nowrap;vertical-align:1px}
.t-fact{background:var(--fact-bg);color:var(--fact)} .t-infer{background:var(--infer-bg);color:var(--infer)}
.t-design{background:var(--design-bg);color:var(--design)} .t-gap{background:var(--gap-bg);color:var(--gap)}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:4px;padding:0 6px;white-space:nowrap;line-height:1.6;vertical-align:1px}
.src:hover{text-decoration:underline}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.pill button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.pill button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tgl{display:inline-flex;border:1px solid var(--chrome-3);border-radius:8px;overflow:hidden}
.tgl button{border:0;background:transparent;color:var(--chrome-fg);padding:5px 10px;font-size:13px}
.tgl button[aria-pressed="true"]{background:var(--chrome-fg);color:var(--chrome)}
/* source drawer (markup from app/template.html openDrawer) */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);z-index:60;padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 20px;overflow-y:auto}
.drawer h2{font-size:19px;margin:4px 0 10px}
.drawer blockquote{margin:10px 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);font-size:14px}
.drawer .x{float:right;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px}
.drawer a{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.4);z-index:59}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
/* linked sliders */
input[type=range].rg{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:4px 0 0;--c:var(--accent);--p:50%}
input[type=range].rg::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--c) var(--p),var(--surface-2) var(--p))}
input[type=range].rg::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--c) var(--p),var(--surface-2) var(--p))}
input[type=range].rg::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--c);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range].rg::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.gcards{display:grid;gap:10px}
.gcard{--gc:#888;border:1px solid color-mix(in srgb,var(--gc) 40%,var(--line));background:color-mix(in srgb,var(--gc) 8%,var(--surface));border-radius:12px;padding:10px 12px 8px}
.gtop{display:flex;align-items:center;gap:10px}
.gic{flex:0 0 34px;height:34px;border-radius:9px;background:var(--gc);display:grid;place-items:center}
.gic svg{width:20px;height:20px}
.gname{flex:1;min-width:0} .gname b{display:block;font-size:15px;line-height:1.3} .gname small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.gval{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--gc);font-variant-numeric:tabular-nums;line-height:1}
.gval small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);text-align:right;margin-top:3px}
.mods{margin-top:6px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px;gap:8px;align-items:center;padding:4px 0}
@media (max-width:480px){.mod{grid-template-columns:minmax(0,1fr) 64px}.mod input{grid-column:1/-1;order:3}}
.mod .nm{font-size:13px;min-width:0;line-height:1.35}
.mod .nm small{display:block;color:var(--muted);font-size:11px}
.mod output{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.mic{display:inline-block;vertical-align:-3px;margin-right:6px}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;margin-top:10px}
details.more summary{cursor:pointer;font-weight:500;font-size:14px}
/* quick-compare scenario buttons */
.pzs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pz{border:2px solid transparent;border-radius:10px;padding:9px 8px;font-size:12.5px;font-weight:600;text-align:left;line-height:1.3;min-width:0}
.pz small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:2px}
.pz-base{background:var(--p-base);color:var(--p-base-fg)} .pz-green{background:var(--p-green);color:var(--p-green-fg)} .pz-night{background:var(--p-night);color:var(--p-night-fg)}
.pz[aria-pressed="true"]{border-color:currentColor}
@media (max-width:420px){.pzs{grid-template-columns:1fr}}
/* allocation bar */
.abar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.abar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;transition:width .15s}
/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--kc,var(--accent))}
.kh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.kh b{font-weight:500;color:var(--fg);display:flex;align-items:center;gap:6px}
.kv{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;letter-spacing:-.01em}
.kv small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.kd{font-size:12.5px;font-weight:500;margin-top:2px} .kn{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.delta-up{color:var(--fact)} .delta-down{color:var(--gap)}
/* plaza diagram */
.plaza{width:100%;height:auto;display:block}
.plaza text{font-family:var(--f-body)}
/* results rows */
.res{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.res{grid-template-columns:1fr}}
.res:last-child{border-bottom:0}
.res .dn{font-size:14px;font-weight:500}
.res .dn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.res .dn.pri::after{content:" ★";color:var(--accent)}
.track{position:relative;height:30px}
.track .rng{position:absolute;height:9px;border-radius:5px;transition:left .15s,width .15s}
.track .r0{top:3px;background:var(--base)} .track .r1{top:17px;background:var(--accent)}
.vals{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.45}
.vals .y{color:var(--accent)}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.status{font-size:12px;border-radius:4px;padding:0 6px;white-space:nowrap}
.st-ok{background:var(--fact-bg);color:var(--fact)} .st-gap{background:var(--gap-bg);color:var(--gap)}
ul.claims{list-style:none;margin:0;padding:0}
ul.claims li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
ul.claims li:last-child{border-bottom:0}
.kind{font-size:11.5px;font-weight:500;color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.ok{color:var(--fact)} .bad{color:var(--gap)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
/* base map */
.basemap{width:100%;height:100%;display:block;background:var(--map-bg)}
.basemap .lab{font-family:var(--f-body);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px;fill:var(--fg)}
.hl{transition:opacity .35s}
footer.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer.foot .wrap{padding-block:16px 28px}
.disc{background:var(--infer-bg);color:var(--fg);font-size:13px}
.disc .wrap{padding-block:7px}
.disc b{color:var(--infer)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Council backend and evidence ledger (variants/council.js), plus the shared P1–P6 check and gap list.
   Appended to base.css at build time, so it uses the same tokens. */
.cb h2{font-size:18px}
.cb h3{font-size:15px}
.cb [id^="cb-"]{scroll-margin-top:14px}
.cb-mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.cb-neutral{background:var(--surface-2);color:var(--muted)}
.cb-sm{padding:5px 12px;font-size:13px;white-space:nowrap;flex:none}
.cb-link{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;text-decoration:underline}
.cb-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cb-ghost{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.cb-ghost ul{margin:6px 0 8px;padding-left:18px}
.cb-blk{margin-top:14px}
.cb-blk h3{margin-bottom:4px}
ul.claims li.cb-held,li.cb-held{color:var(--muted);font-size:13px}

/* decision card */
.cb-dec{border-left:4px solid var(--accent)}
.cb-dcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:4px}
@media (max-width:980px){.cb-dcs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cb-dcs{grid-template-columns:1fr}}
.cb-dc{border-top:2px solid var(--line);padding-top:8px;min-width:0}
.cb-dc h3{font-size:15.5px;margin:2px 0 6px;line-height:1.35}
.cb-dc p,.cb-dc li{font-size:13.5px}
.cb-dc ul{margin:0 0 8px;padding-left:18px}
.cb-dc li{margin-bottom:3px}

/* status tiles */
.cb-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.cb-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.cb-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cb-tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.cb-tile:hover,.cb-step:hover{border-color:var(--accent)}
.cb-tn{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cb-tn i{font-style:normal;font-size:15px;color:var(--muted);font-weight:500}
.cb-tt{font-size:13.5px;font-weight:600}
.cb-tile small{font-size:12px;color:var(--muted);line-height:1.35}
.cb-tile.warn .cb-tn{color:var(--infer)}
.cb-tile.bad .cb-tn{color:var(--gap)}

/* to-do list */
.cb-todo{list-style:none;margin:8px 0 0;padding:0}
.cb-todo li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cb-todo li:last-child{border-bottom:0}
@media (max-width:520px){.cb-todo li{flex-direction:column;align-items:flex-start}}

/* P1–P6 check (shared.js pCheckList) */
.pc{display:grid;gap:8px;margin-top:8px}
.pc-r{border:1px solid var(--line);border-left:4px solid var(--fact);border-radius:10px;padding:8px 12px;background:var(--surface);min-width:0}
.pc-weak{border-left-color:var(--infer)}
.pc-fail{border-left-color:var(--gap)}
.pc-na{border-left-color:var(--base)}
.pc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:14px}
.pc-h .status{flex:none;margin-top:2px}
.pc-m{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:2px 10px;font-size:13px;margin-top:4px;align-items:baseline}
@media (max-width:520px){.pc-m{grid-template-columns:1fr}}
.pc-k{color:var(--muted)}
.pc-v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.pc-t{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.pcv-keep{color:var(--fact)} .pcv-weak{color:var(--infer)} .pcv-fail{color:var(--gap)}
.pc-n{font-size:12.5px;color:var(--muted);margin-top:4px}
.pcs-keep{background:var(--fact-bg);color:var(--fact)}
.pcs-weak{background:var(--infer-bg);color:var(--infer)}
.pcs-fail{background:var(--gap-bg);color:var(--gap)}
.pcs-na{background:var(--surface-2);color:var(--muted)}

/* evidence gaps (shared.js gapsList) */
.gaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px;margin-top:8px}
.gap{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;background:var(--surface)}
.gap-t{font-size:14.5px;margin-bottom:6px}
.gap dl{margin:0;display:grid;gap:4px}
.gap dl div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;font-size:13px}
.gap dt{color:var(--muted)}
.gap dd{margin:0}
.rtag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:600;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 5px;line-height:1.5}

/* ledger */
.cb-filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.cb-filter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.cb-filter button i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.cb-filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cb-filter button[aria-pressed="true"] i{color:inherit}
.cb-grp{border-top:1px solid var(--line);padding-top:6px;margin-top:8px}
.cb-grp summary{cursor:pointer;font-weight:600;font-family:var(--f-display);font-size:15px;padding:4px 0}
.cb-row{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1.1fr) 236px;gap:6px 14px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start}
.cb-row:last-child{border-bottom:0}
@media (max-width:900px){.cb-row{grid-template-columns:1fr;gap:4px}}

function compute(a, plant, year){
  const out={};
  const cr = CROWN[plant][year];
  const sh = [0,1].map(i=>Math.min(TOTAL, a.canopy*cr[i] + a.rest*COEF.restShade[i]));
  out.shade = sh;
  const cs = plant==="deep"?COEF.storm.canopy_deep:COEF.storm.canopy_planter;
  out.storm = [0,1].map(i=>a.blue*COEF.storm.blue[i] + a.canopy*cs[i]);
  out.econ = [0,1].map(i=>a.events*COEF.econ.events[i]+a.rest*COEF.econ.rest[i]+a.culture*COEF.econ.culture[i]);
  out.access = [0,1].map(i=>100*a.walk*COEF.walkClear[i]/TOTAL);
  const proxy=(w,extra)=>{let s=0;for(const k in w){s+= (k==="shade"?extra:a[k])*w[k];}return s;};
  const sMid=(sh[0]+sh[1])/2;
  out.safety = [0.85,1.15].map(f=>Math.min(100,proxy(W.safety)*f));
  out.incl = [0.85,1.15].map(f=>Math.min(100,proxy(W.incl,sMid)*f));
  out.culture = [0.85,1.15].map(f=>Math.min(100,proxy(W.culture)*f));
  const yrs = year-2026;
  out.cost = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*(COEF.capex[m.id][i]+COEF.opex[m.id][i]*yrs);}return c/1000;});
  out.carbon = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*COEF.carbon[m.id][i];}return c;});
  return out;
}

function normalise(){ // keep the total at exactly 1,200 m² after rounding
  let d=TOTAL-sum(S.a); if(!d) return;
  const ids=MODULES.map(m=>m.id).sort((x,y)=>S.a[y]-S.a[x]);
  for(const id of ids){ const nv=Math.max(0,S.a[id]+d); d-=nv-S.a[id]; S.a[id]=nv; if(!d) break; }
}
function setModule(id,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const others=MODULES.filter(m=>m.id!==id), rest=others.reduce((s,m)=>s+S.a[m.id],0), target=TOTAL-v;
  others.forEach(m=>{S.a[m.id]= rest>0 ? r10(S.a[m.id]*target/rest) : r10(target/others.length);});
  S.a[id]=v; normalise();
}
function setGroup(g,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const inG=MODULES.filter(m=>m.g===g), outG=MODULES.filter(m=>m.g!==g);
  const gt=inG.reduce((s,m)=>s+S.a[m.id],0), ot=outG.reduce((s,m)=>s+S.a[m.id],0);
  inG.forEach(m=>{S.a[m.id]= gt>0 ? r10(S.a[m.id]*v/gt) : r10(v/inG.length);});
  outG.forEach(m=>{S.a[m.id]= ot>0 ? r10(S.a[m.id]*(TOTAL-v)/ot) : r10((TOTAL-v)/outG.length);});
  normalise();
}

/* ---------- computeV: compute() with proxy scores rescaled ----------
   compute() clamps safety, inclusion and culture at 100, so strong splits read "100–100". Here they become a
   relative index against Scenario 0: index = 100·raw/(raw + raw₀), so Scenario 0 ≈ 50 and the scale never clamps. */
function proxyRaw(a,plant,year){const cr=CROWN[plant][year],sh=[0,1].map(i=>Math.min(TOTAL,a.canopy*cr[i]+a.rest*COEF.restShade[i])),sMid=(sh[0]+sh[1])/2;
  const f=w=>{let t=0;for(const k in w)t+=(k==="shade"?sMid:a[k])*w[k];return t;};return {safety:f(W.safety),incl:f(W.incl),culture:f(W.culture)};}
function computeV(a,plant,year){const o=compute(a,plant,year),r=proxyRaw(a,plant,year),r0=proxyRaw(PRESETS.base.a,"planter",year);
  for(const k of ["safety","incl","culture"])o[k]=[0.85,1.15].map(f=>100*r[k]*f/(r[k]*f+r0[k]));return o;}

/* ---------- KPI cards (all values are ranges from team-assumed coefficients) ---------- */
function kpiData(id){
  const you=computeV(S.a,S.plant,S.year), base=computeV(PRESETS.base.a,"planter",S.year);
  const d=DIMS.find(x=>x.id===id), y=you[id], b=base[id];
  const ym=(y[0]+y[1])/2, bm=(b[0]+b[1])/2, raw=(ym-bm)/Math.max(Math.abs(bm),1), rel=d.better==="low"?-raw:raw;
  return {y,b,raw,good:rel>0.005,bad:rel<-0.005,p:Math.round(raw*100)};
}
function deltaHTML(k){return `<div class="kd ${k.good?"delta-up":k.bad?"delta-down":"muted"}">${k.p>0?"▲":k.p<0?"▼":"="} ${fmt(Math.abs(k.p))}% ${L("对比方案 0","vs Scenario 0")}${k.good?L("，更好",", better"):k.bad?L("，更差",", worse"):""}</div>`;}

  {id:"cost",c:GROUPS.smart.c,ic:"smart",label:L("建设 + 维护成本","Build + upkeep cost"),f:v=>fmt(v/1000,2),u:"$M",note:()=>L(`到 ${S.year} 年累计；资金来源未定`,`Total to ${S.year}; funding not settled`)+" "+chip("S2","p.54","sq10")}
];
function kpiCards(ids){return `<div class="kpis">${KPI_DEF().filter(d=>!ids||ids.includes(d.id)).map(d=>{const k=kpiData(d.id);return `<div class="kpi" style="--kc:${d.c}">

/* ---------- 9-dimension results, as in screen 4 of app/template.html ---------- */
function resultsRows(){
  const base=computeV(PRESETS.base.a,"planter",S.year), you=computeV(S.a,S.plant,S.year);
  let ws=0,acc=0;
  const rows=DIMS.map(d=>{
    const b=base[d.id], y=you[d.id], max=Math.max(b[1],y[1],1)*1.1, bm=(b[0]+b[1])/2, ym=(y[0]+y[1])/2;
    const raw=(ym-bm)/Math.max(Math.abs(bm),1); let rel=d.better==="low"?-raw:raw; rel=Math.max(-1,Math.min(1,rel));
    const w=S.pri.includes(d.id)?3:1; ws+=w; acc+=w*rel;
    const dec=d.id==="storm"?1:0, p=Math.round(raw*100), good=rel>0.005, bad=rel<-0.005;
    return `<div class="res"><div class="dn ${S.pri.includes(d.id)?"pri":""}">${T(d)}<small>${d.type==="proxy"?L("相对指数，方案 0 ≈ 50","Index, Scenario 0 ≈ 50"):d.unit} · ${d.type==="proxy"?L("代理指标","Proxy score"):L("估算","Estimate")}${d.flag?` · ${TRAFFIC_WAIT()}`:""}</small></div>
      <div class="track" aria-hidden="true"><span class="rng r0" style="left:${100*b[0]/max}%;width:${Math.max(1,100*(b[1]-b[0])/max)}%"></span><span class="rng r1" style="left:${100*y[0]/max}%;width:${Math.max(1,100*(y[1]-y[0])/max)}%"></span></div>
      <div class="vals"><span class="muted">${L("方案 0","Scen. 0")} ${fmt(b[0],dec)}–${fmt(b[1],dec)}</span><br><span class="y">${L("你的","Yours")} ${fmt(y[0],dec)}–${fmt(y[1],dec)}</span> <span class="${good?"delta-up":bad?"delta-down":"muted"}">${p>0?"▲":p<0?"▼":"="}${fmt(Math.abs(p))}%</span></div></div>`;
  }).join("");
  return {rows,fit:Math.round(100*acc/ws)};
}

  // zones west→east: green | active | smart | move (walking along the Wentworth St frontage)

    if(d.year){S.year=+d.year;document.querySelectorAll("[data-year]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.year===S.year));ctx.live();return;}
    if(d.role){S.role=d.role;ctx.render();return;}

  });
  let raf=0;

      if(t.dataset.mod) setModule(t.dataset.mod,+t.value); else setGroup(t.dataset.grp,+t.value);

/* tween the map's viewBox */
function tweenVB(svg,to,ms=650,onF){if(!svg)return;const from=svg.getAttribute("viewBox").split(" ").map(Number);if(svg._raf)cancelAnimationFrame(svg._raf);
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;if(reduce){svg.setAttribute("viewBox",to.join(" "));onF&&onF();return;}
  const t0=performance.now();const step=t=>{const u=Math.min(1,(t-t0)/ms),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;svg.setAttribute("viewBox",from.map((f,i)=>(f+(to[i]-f)*e).toFixed(1)).join(" "));onF&&onF();if(u<1)svg._raf=requestAnimationFrame(step);};svg._raf=requestAnimationFrame(step);}


/* ===== variants/iso.js: 2.5D isometric plaza for option D =====
   The square is 48 tiles of 25 m² (8 west→east × 6 north→south). Tiles are handed to uses in proportion to
   S.a, filled column by column from the west, so trees sit at the back and walking + kerb face Wentworth St.
   Edges after S2 p.45 / p.43 and S4 (one-way southbound). Indicative only, not a layout design. */
const ISO={C:8,R:6,HW:36,HH:18};
const ISO_ORDER=["canopy","blue","culture","rest","events","smart","circ","bike","walk","kerb"];
const ip=(c,r,z=0)=>[(c-r)*ISO.HW,(c+r)*ISO.HH-z];
const P=a=>a.map(p=>p.map(v=>+v.toFixed(1)).join(",")).join(" ");
function tileMap(a){
  const n=ISO.C*ISO.R, raw=ISO_ORDER.map(id=>a[id]/TOTAL*n), fl=raw.map(Math.floor);
  let rem=n-fl.reduce((s,v)=>s+v,0);
  raw.map((v,i)=>[v-fl[i],i]).sort((x,y)=>y[0]-x[0]).slice(0,rem).forEach(([,i])=>fl[i]++);
  const out=[]; ISO_ORDER.forEach((id,i)=>{for(let k=0;k<fl[i];k++)out.push(id);}); return out;
}

  pCheckData(S.a).filter(r=>r.st!=="keep").forEach(r=>items.push([L(`居民当前的分配${r.st==="fail"?"不满足":"削弱了"} ${r.ids.join(" · ")}`,`The resident's current split ${r.st==="fail"?"does not meet":"weakens"} ${r.ids.join(" · ")}`),go("cb-p"),L("看检查","See the check")]));
  const un=cbTexts().filter(x=>!cbRoutes()[x.k]).length;

  return items.length?`<ul class="cb-todo">${items.map(i=>`<li><span>${i[0]}</span><button class="btn cb-sm" ${i[1]}>${i[2]} →</button></li>`).join("")}</ul>`

function cbReact(subs,cid){const c={yes:0,unsure:0,no:0};subs.forEach(s=>{const v=(s.react||{})[cid];if(v in c)c[v]++;});return c;}
function cbReactRow(subs,cd){const c=cbReact(subs,cd.id),n=subs.length,said=c.yes+c.unsure+c.no,w=v=>n?100*v/n:0;
  return `<div class="cb-line"><b>${T(cd)}</b><div class="cb-bar" aria-hidden="true"><span class="cb-y" style="width:${w(c.yes)}%"></span><span class="cb-u" style="width:${w(c.unsure)}%"></span><span class="cb-no" style="width:${w(c.no)}%"></span></div>
   <small>${L(`支持 ${c.yes} · 不确定 ${c.unsure} · 有顾虑 ${c.no} · 没表态 ${n-said}`,`Support ${c.yes} · Not sure ${c.unsure} · Concerned ${c.no} · No view ${n-said}`)}</small></div>`;}
function cbSummary(subs){const n=subs.length,gsumOf=(a,g)=>MODULES.filter(m=>m.g===g).reduce((s,m)=>s+(+a[m.id]||0),0);

  const pri=DIMS.map(d=>({d,k:subs.filter(s=>(s.pri||[]).includes(d.id)).length})).filter(x=>x.k).sort((x,y)=>y.k-x.k);
  return `<div class="cb-blk"><h3>${L("对总规三件事的态度","Views on the plan's three items")}</h3>${CARDS.map(cd=>cbReactRow(subs,cd)).join("")}</div>
   <div class="cb-blk"><h3>${L("提交的分法：四大类面积的中位数","Submitted splits: median area by group")}</h3>
    ${Object.keys(GROUPS).map(g=>{const md=cbMedian(subs.map(s=>gsumOf(s.a,g))),b0=gsumOf(PRESETS.base.a,g);
      return `<div class="cb-line"><b style="color:${GROUPS[g].c}">${T(GROUPS[g])}</b> <span class="cb-mono">${L("方案 0","Scenario 0")} ${fmt(b0)} m² → ${L("中位数","median")} ${fmt(md)} m²</span></div>`;}).join("")}</div>
   <div class="cb-blk"><h3>${L("这些分法对总规原则的影响","What these splits do to the plan's principles")}</h3>
    ${pr.map(r=>`<div class="cb-line"><b>${r.ids.join(" · ")}</b> <span class="cb-mono">${L(`${n} 份里：削弱 ${r.weak} 份 · 不满足 ${r.fail} 份`,`Of ${n}: weakened in ${r.weak} · not met in ${r.fail}`)}</span></div>`).join("")}</div>
   <div class="cb-blk"><h3>${L("最在乎的维度","Dimensions people care about most")}</h3><p class="small">${pri.length?pri.map(x=>`${T(x.d)} ${x.k}`).join(" · "):"—"}</p></div>`;}
function cbRep(subs,show){const known=subs.filter(s=>s.lang),zh=known.filter(s=>s.lang==="zh").length;
  const no=`<span class="muted">${L("不能比较","Cannot be compared")}</span>`,gap=`<span class="tag t-gap">${L("证据空白","Evidence gap")}</span>`;
  const rows=[
   [`${L("56.4% 的居民在家说英语以外的语言（2021）","56.4% of residents speak a language other than English at home (2021)")} ${chip("S5","p.16–17")}`,
    L("用中文界面提交的份数。只是代理指标：界面语言不等于在家说的语言","Submissions made in the Chinese interface. A proxy only: interface language is not language at home"),
    show&&known.length?L(`${zh} / ${known.length} 份用中文界面`,`${zh} of ${known.length} used the Chinese interface`):`<span class="muted">${L(`不足 ${CB_MIN} 份，不计算`,`Fewer than ${CB_MIN}: not worked out`)}</span>`],
   [`${L("华人背景占 22.3%，是 LGA 最大的文化群体","22.3% Chinese ancestry, the LGA's largest cultural group")} ${chip("S3","")}`,L("本原型不问文化背景","This prototype does not ask about cultural background"),no],
   [`${L("各身份（居民、商户、通勤者、访客）在人口里的占比","Share of each role (resident, business, commuter, visitor) in the population")} ${gap}`,L("我们收集了身份，但来源里没有对应的基准","We collect the role, but no source gives a matching benchmark"),no],

  return `<div class="cb-blk" id="cb-rep"><h3>${L("代表性检查","Representativeness check")}</h3>
   <p class="small muted">${L("正式版对比 ABS Census 的人口结构。ABS 数据我们还没读，所以这里只用手上来源里的两个数字做基准，不写任何没有来源的人口数字。","The full version compares against ABS Census profiles. We have not read the ABS data yet, so only two figures from sources we hold serve as benchmarks, and no unsourced population figure is stated.")}</p>

   ${rows.map(r=>`<div class="cb-kv"><span>${r[0]}</span><span>${r[1]}</span><span>${r[2]}</span></div>`).join("")}</div>`;}
function cbFeedback(){const subs=cbSubs(),n=subs.length,g=cbGroups(),pv=cbPreview(),show=n>=CB_MIN||(pv&&n>0);
  const head=`<p class="small muted">${L(`同一群体达到 ${CB_MIN} 份才显示汇总，免得从汇总里认出个人。演示版没有真实提交，只有本浏览器里的演示提交，没有发送给任何人。`,`A group's summary shows only once it reaches ${CB_MIN}, so no one can be picked out. The demo has no real submissions, only demo submissions saved in this browser; nothing is sent anywhere.`)}</p>

   <ul class="cb-grps">${g.rows.map(x=>`<li><span>${T(x.r)}</span><span class="${x.n>=CB_MIN?"ok":"muted"}">${x.n>=CB_MIN?L(`≥ ${CB_MIN} · 可单独显示`,`≥ ${CB_MIN} · shown on its own`):L(`< ${CB_MIN} · 已隐藏`,`< ${CB_MIN} · hidden`)}</span></li>`).join("")}</ul>`;

     <ul><li>${L("居民对总规三件事的态度：支持、不确定、有顾虑","Views on the plan's three items: support, not sure, concerned")}</li><li>${L("提交的分法里，四大类面积的中位数","Median area by group across the submitted splits")}</li><li>${L("这些分法削弱了哪条总规原则","Which plan principles those splits weaken")}</li></ul>
     <button class="btn cb-sm" data-cb="go" data-val="res#c-say">${L("去居民故事板提交一份","Go and submit one as a resident")} →</button></div>`;
  else body=`${n<CB_MIN?`<div class="cb-gate"><span><b>${L(`不足 ${CB_MIN} 份。`,`Fewer than ${CB_MIN}.`)}</b> ${L("正式版在这之前不显示任何汇总。","The full version shows no summary before this.")}</span><button class="btn cb-sm" data-cb="preview">${pv?L("收起演示预览","Hide the demo preview"):L("看演示预览","Show a demo preview")}</button></div>`:""}
    ${show?`${n<CB_MIN?`<p class="small" style="margin-top:8px"><span class="tag t-gap">${L("预览：正式版不会显示","Preview: the full version would hide this")}</span></p>`:""}${cbSummary(subs)}
      ${g.rows.filter(x=>x.n>=CB_MIN).map(x=>`<div class="cb-blk"><h3>${T(x.r)} (${x.n})</h3>${CARDS.map(cd=>cbReactRow(subs.filter(s=>s.role===x.r.id),cd)).join("")}</div>`).join("")}`:""}
    <button class="btn cb-sm" id="clearSubs" style="margin-top:12px">${L("清除本浏览器的演示提交","Clear demo submissions in this browser")}</button>`;
  return head+body+cbRep(subs,show)+(typeof tallyPanel==="function"?`<div class="cb-blk" id="tallyBox">${tallyPanel()}</div>`:"");}

/* ---------- events: own listeners, so the shared click handler stays untouched ---------- */
function cbRedraw(){if(typeof render==="function")render();}
function cbGo(v){const [tab,anchor]=v.split("#");
  if(typeof goTab==="function")goTab(tab,anchor);else{const el=document.getElementById(anchor);if(el)el.scrollIntoView();}}
function cbClick(b){const d=b.dataset;
  if(d.cb==="go"){cbGo(d.val);return;}
  if(d.cb==="filter"){CB.filter=d.val;CB.pick=null;
    if(typeof goTab==="function"&&!document.getElementById("cb-ledger"))goTab("ledger","cb-ledger");else cbRedraw();return;}
  if(d.cb==="rev"){if(d.val==="ok"){cbSet(d.cid,"ok");CB.pick=null;}else CB.pick={id:d.cid,st:d.val};cbRedraw();return;}
  if(d.cb==="why"){if(CB.pick)cbSet(CB.pick.id,CB.pick.st,d.val);CB.pick=null;cbRedraw();return;}
  if(d.cb==="cancel"){CB.pick=null;cbRedraw();return;}
  if(d.cb==="resetrev"){store.set("cav_review",{});CB.pick=null;cbRedraw();return;}
  if(d.cb==="preview"){CB.preview=!CB.preview;cbRedraw();return;}
  if(d.cb==="brief"){
    if(d.val==="make")store.set("cav_brief",{st:"draft",at:Date.now()});
    if(d.val==="approve")store.set("cav_brief",{st:"ok",at:Date.now(),sig:cbBriefSig()});
    if(d.val==="drop")store.set("cav_brief",null);
    cbRedraw();return;}
}
