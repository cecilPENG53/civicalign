<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicAlign Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Shared tokens and components for the three CivicAlign variants.
   Navy civic chrome, a green "evidence" accent, four use-group colours from GROUPS. */
:root{
  --bg:#f2f5f8; --surface:#ffffff; --surface-2:#e9eef3; --fg:#13202e; --muted:#566476; --line:#d3dce5;
  --chrome:#0e1c33; --chrome-2:#18294a; --chrome-3:#243a63; --chrome-fg:#eaf0f9; --chrome-mut:#9fb0cb;
  --accent:#1f6b57; --accent-soft:#d8ece4; --on-accent:#ffffff;
  --base:#8e9bab; --fact:#1f6b57; --fact-bg:#dcefe6; --infer:#93580a; --infer-bg:#fbecd2;
  --design:#2c5aa0; --design-bg:#dfe8f7; --gap:#b23a3a; --gap-bg:#f8dfdf;
  --map-bg:#e7ecf0; --map-bld:#cfd7de; --map-road:#ffffff; --map-road-edge:#c2ccd6; --map-green:#cfe6c9; --map-rail:#6d7a86;
  --p-base:#e4e9f0; --p-base-fg:#23324a; --p-green:#e0f1e2; --p-green-fg:#245a2c; --p-night:#fbecd6; --p-night-fg:#7a4a0c;
  --shadow:0 1px 2px rgba(16,32,52,.06),0 6px 18px rgba(16,32,52,.07);
  --f-display:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b121b; --surface:#121c28; --surface-2:#1a2635; --fg:#e4ebf3; --muted:#98a7b9; --line:#283749;
  --chrome:#070e19; --chrome-2:#101d33; --chrome-3:#1c3054; --chrome-fg:#e4ebf6; --chrome-mut:#8ea1bf;
  --accent:#6cc3a6; --accent-soft:#183a30; --on-accent:#08140f;
  --base:#66768a; --fact:#7fd0b2; --fact-bg:#173629; --infer:#f0b257; --infer-bg:#3a2c14; --design:#8fb3f0; --design-bg:#1b2944; --gap:#f08a8a; --gap-bg:#3d1f1f;
  --map-bg:#141f2b; --map-bld:#2a3847; --map-road:#3a4a5c; --map-road-edge:#243142; --map-green:#21402c; --map-rail:#8b9aab;
  --p-base:#1f2c3f; --p-base-fg:#d6e0ee; --p-green:#1d3a25; --p-green-fg:#bfe5c4; --p-night:#3a2c14; --p-night-fg:#f2cf98;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b121b; --surface:#121c28; --surface-2:#1a2635; --fg:#e4ebf3; --muted:#98a7b9; --line:#283749;
  --chrome:#070e19; --chrome-2:#101d33; --chrome-3:#1c3054; --chrome-fg:#e4ebf6; --chrome-mut:#8ea1bf;
  --accent:#6cc3a6; --accent-soft:#183a30; --on-accent:#08140f;
  --base:#66768a; --fact:#7fd0b2; --fact-bg:#173629; --infer:#f0b257; --infer-bg:#3a2c14; --design:#8fb3f0; --design-bg:#1b2944; --gap:#f08a8a; --gap-bg:#3d1f1f;
  --map-bg:#141f2b; --map-bld:#2a3847; --map-road:#3a4a5c; --map-road-edge:#243142; --map-green:#21402c; --map-rail:#8b9aab;
  --p-base:#1f2c3f; --p-base-fg:#d6e0ee; --p-green:#1d3a25; --p-green-fg:#bfe5c4; --p-night:#3a2c14; --p-night-fg:#f2cf98;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow-x:hidden}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.tag{display:inline-block;font-size:11.5px;line-height:1.5;border-radius:4px;padding:0 6px;font-weight:500;white-space:nowrap;vertical-align:1px}
.t-fact{background:var(--fact-bg);color:var(--fact)} .t-infer{background:var(--infer-bg);color:var(--infer)}
.t-design{background:var(--design-bg);color:var(--design)} .t-gap{background:var(--gap-bg);color:var(--gap)}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:0;border-radius:4px;padding:0 6px;white-space:nowrap;line-height:1.6;vertical-align:1px}
.src:hover{text-decoration:underline}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.pill button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.pill button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tgl{display:inline-flex;border:1px solid var(--chrome-3);border-radius:8px;overflow:hidden}
.tgl button{border:0;background:transparent;color:var(--chrome-fg);padding:5px 10px;font-size:13px}
.tgl button[aria-pressed="true"]{background:var(--chrome-fg);color:var(--chrome)}
/* source drawer (markup from app/template.html openDrawer) */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);z-index:60;padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 20px;overflow-y:auto}
.drawer h2{font-size:19px;margin:4px 0 10px}
.drawer blockquote{margin:10px 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);font-size:14px}
.drawer .x{float:right;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 10px}
.drawer a{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.4);z-index:59}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
/* linked sliders */
input[type=range].rg{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:4px 0 0;--c:var(--accent);--p:50%}
input[type=range].rg::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--c) var(--p),var(--surface-2) var(--p))}
input[type=range].rg::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--c) var(--p),var(--surface-2) var(--p))}
input[type=range].rg::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--surface);border:3px solid var(--c);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range].rg::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.gcards{display:grid;gap:10px}
.gcard{--gc:#888;border:1px solid color-mix(in srgb,var(--gc) 40%,var(--line));background:color-mix(in srgb,var(--gc) 8%,var(--surface));border-radius:12px;padding:10px 12px 8px}
.gtop{display:flex;align-items:center;gap:10px}
.gic{flex:0 0 34px;height:34px;border-radius:9px;background:var(--gc);display:grid;place-items:center}
.gic svg{width:20px;height:20px}
.gname{flex:1;min-width:0} .gname b{display:block;font-size:15px;line-height:1.3} .gname small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.gval{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--gc);font-variant-numeric:tabular-nums;line-height:1}
.gval small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);text-align:right;margin-top:3px}
.mods{margin-top:6px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px;gap:8px;align-items:center;padding:4px 0}
@media (max-width:480px){.mod{grid-template-columns:minmax(0,1fr) 64px}.mod input{grid-column:1/-1;order:3}}
.mod .nm{font-size:13px;min-width:0;line-height:1.35}
.mod .nm small{display:block;color:var(--muted);font-size:11px}
.mod output{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.mic{display:inline-block;vertical-align:-3px;margin-right:6px}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;margin-top:10px}
details.more summary{cursor:pointer;font-weight:500;font-size:14px}
/* quick-compare scenario buttons */
.pzs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pz{border:2px solid transparent;border-radius:10px;padding:9px 8px;font-size:12.5px;font-weight:600;text-align:left;line-height:1.3;min-width:0}
.pz small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:2px}
.pz-base{background:var(--p-base);color:var(--p-base-fg)} .pz-green{background:var(--p-green);color:var(--p-green-fg)} .pz-night{background:var(--p-night);color:var(--p-night-fg)}
.pz[aria-pressed="true"]{border-color:currentColor}
@media (max-width:420px){.pzs{grid-template-columns:1fr}}
/* allocation bar */
.abar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.abar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;transition:width .15s}
/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--kc,var(--accent))}
.kh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.kh b{font-weight:500;color:var(--fg);display:flex;align-items:center;gap:6px}
.kv{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px;letter-spacing:-.01em}
.kv small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.kd{font-size:12.5px;font-weight:500;margin-top:2px} .kn{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.delta-up{color:var(--fact)} .delta-down{color:var(--gap)}
/* plaza diagram */
.plaza{width:100%;height:auto;display:block}
.plaza text{font-family:var(--f-body)}
/* results rows */
.res{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.res{grid-template-columns:1fr}}
.res:last-child{border-bottom:0}
.res .dn{font-size:14px;font-weight:500}
.res .dn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.res .dn.pri::after{content:" ★";color:var(--accent)}
.track{position:relative;height:30px}
.track .rng{position:absolute;height:9px;border-radius:5px;transition:left .15s,width .15s}
.track .r0{top:3px;background:var(--base)} .track .r1{top:17px;background:var(--accent)}
.vals{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.45}
.vals .y{color:var(--accent)}
.keyrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.status{font-size:12px;border-radius:4px;padding:0 6px;white-space:nowrap}
.st-ok{background:var(--fact-bg);color:var(--fact)} .st-gap{background:var(--gap-bg);color:var(--gap)}
ul.claims{list-style:none;margin:0;padding:0}
ul.claims li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
ul.claims li:last-child{border-bottom:0}
.kind{font-size:11.5px;font-weight:500;color:var(--muted);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.ok{color:var(--fact)} .bad{color:var(--gap)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
/* base map */
.basemap{width:100%;height:100%;display:block;background:var(--map-bg)}
.basemap .lab{font-family:var(--f-body);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px;fill:var(--fg)}
.hl{transition:opacity .35s}
footer.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer.foot .wrap{padding-block:16px 28px}
.disc{background:var(--infer-bg);color:var(--fg);font-size:13px}
.disc .wrap{padding-block:7px}
.disc b{color:var(--infer)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Layout (C · Map-first): the OSM base map fills the screen. Five numbered hotspots open evidence cards;
   a floating panel on the left holds the allocation, results and feedback; KPI cards float top-right
   over the map. Below 900px everything stacks under a shorter map. */
html,body{height:100%}
body{display:flex;flex-direction:column}
.bar{background:var(--chrome);color:var(--chrome-fg);flex:0 0 auto}
.bar .wrap{max-width:none;display:flex;align-items:center;gap:10px 14px;padding-block:9px;flex-wrap:wrap}
.bar .brand{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.mark{flex:0 0 32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3fae8c,#2c6fb4);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;font-size:13px}
.brand>div{min-width:0}
.brand b{font-family:var(--f-display);font-size:17px;line-height:1.1;display:block}
.brand span{font-size:12px;color:var(--chrome-mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn{border:1px solid var(--chrome-3);background:var(--chrome-2);color:var(--chrome-fg);border-radius:8px;padding:5px 10px;font-size:13px}
.disc .wrap{max-width:none}
.stage{position:relative;flex:1 1 auto;min-height:560px;overflow:hidden}
.mapbox{position:absolute;inset:0}
.mapbox svg{cursor:default}
.hot{cursor:pointer;outline:none}
.hot:focus-visible .hs>circle:nth-child(2){stroke:var(--accent);stroke-width:4}
@media (prefers-reduced-motion:no-preference){.hot .pulse{animation:pulse 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}}
.float{position:absolute;z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel{left:max(14px,env(safe-area-inset-left,0px));top:14px;bottom:14px;width:340px;display:flex;flex-direction:column;overflow:hidden}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);flex:0 0 auto}
.ptabs button{border:0;background:transparent;padding:10px 6px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2.5px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow-y:auto;padding:12px 14px 16px;display:grid;gap:12px;align-content:start;flex:1 1 auto}
.pbody .gcard{padding:8px 10px 6px}.pbody .gval{font-size:22px}
.right{right:max(14px,env(safe-area-inset-right,0px));top:14px;bottom:14px;width:360px;display:flex;flex-direction:column;gap:10px;z-index:5;position:absolute;pointer-events:none}
.right>*{pointer-events:auto}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:0 0 auto}
.kgrid .kpis{display:contents}
.kgrid .kpi{background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);box-shadow:var(--shadow);padding:9px 11px}
.kgrid .kv{font-size:21px}.kgrid .kn{display:none}.kgrid .kh{font-size:11.5px}.kgrid .kh .tag{font-size:10.5px}
.ev{position:relative;overflow-y:auto;padding:14px 16px;flex:1 1 auto;min-height:0}
.ev h2{font-size:20px;margin:2px 0 8px;display:flex;gap:8px;align-items:center}
.ev .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 4px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.chips button i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono)}
.chips button[aria-pressed="true"]{border-color:var(--fg);font-weight:600}
.zoom{position:absolute;z-index:4;left:368px;bottom:16px;display:grid;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;box-shadow:var(--shadow)}
.compass{position:absolute;z-index:4;left:370px;top:16px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:11px;box-shadow:var(--shadow)}
.maplegend{position:absolute;z-index:4;left:416px;bottom:16px;right:390px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.maplegend span{background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:6px;padding:1px 6px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.fit{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.pbody .res{grid-template-columns:1fr;gap:2px;padding:6px 0}
.dpa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dpac{background:var(--surface-2);border-radius:10px;padding:8px;min-width:0}
.dpac b{font-family:var(--f-mono);color:var(--accent);font-size:12px} .dpac span{display:block;font-size:11.5px;font-weight:500;line-height:1.3}
.dpac .big{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.dpac small{display:none}
.wait{background:var(--gap-bg);color:var(--fg);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.thr{display:flex;align-items:center;gap:12px;margin:8px 0}
.thrn{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1}.thrn small{font-size:14px;color:var(--muted)}
.thrbar{flex:1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}.thrbar span{display:block;height:100%;background:var(--accent)}
.drawer.wide{width:min(820px,100%)}
.drawer.wide h3{font-size:16px;margin:16px 0 6px}
.banner{border-radius:10px;padding:10px 12px;background:var(--design-bg);font-size:14px}

const COEF = {

 econ:{events:[0.5,1.0],rest:[0.15,0.30],culture:[0.1,0.2]},

const W = {safety:{events:0.06,smart:0.8,walk:0.05,culture:0.05},incl:{rest:0.25,walk:0.08,shade:0.03,bike:0.2},culture:{culture:0.3,events:0.06,rest:0.1}};

function compute(a, plant, year){
  const out={};
  const cr = CROWN[plant][year];
  const sh = [0,1].map(i=>Math.min(TOTAL, a.canopy*cr[i] + a.rest*COEF.restShade[i]));
  out.shade = sh;
  const cs = plant==="deep"?COEF.storm.canopy_deep:COEF.storm.canopy_planter;
  out.storm = [0,1].map(i=>a.blue*COEF.storm.blue[i] + a.canopy*cs[i]);
  out.econ = [0,1].map(i=>a.events*COEF.econ.events[i]+a.rest*COEF.econ.rest[i]+a.culture*COEF.econ.culture[i]);
  out.access = [0,1].map(i=>100*a.walk*COEF.walkClear[i]/TOTAL);
  const proxy=(w,extra)=>{let s=0;for(const k in w){s+= (k==="shade"?extra:a[k])*w[k];}return s;};
  const sMid=(sh[0]+sh[1])/2;
  out.safety = [0.85,1.15].map(f=>Math.min(100,proxy(W.safety)*f));
  out.incl = [0.85,1.15].map(f=>Math.min(100,proxy(W.incl,sMid)*f));
  out.culture = [0.85,1.15].map(f=>Math.min(100,proxy(W.culture)*f));
  const yrs = year-2026;
  out.cost = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*(COEF.capex[m.id][i]+COEF.opex[m.id][i]*yrs);}return c/1000;});
  out.carbon = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*COEF.carbon[m.id][i];}return c;});
  return out;
}

const r10=v=>Math.round(v/10)*10;
function normalise(){ // keep the total at exactly 1,200 m² after rounding
  let d=TOTAL-sum(S.a); if(!d) return;
  const ids=MODULES.map(m=>m.id).sort((x,y)=>S.a[y]-S.a[x]);
  for(const id of ids){ const nv=Math.max(0,S.a[id]+d); d-=nv-S.a[id]; S.a[id]=nv; if(!d) break; }
}
function setModule(id,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const others=MODULES.filter(m=>m.id!==id), rest=others.reduce((s,m)=>s+S.a[m.id],0), target=TOTAL-v;
  others.forEach(m=>{S.a[m.id]= rest>0 ? r10(S.a[m.id]*target/rest) : r10(target/others.length);});
  S.a[id]=v; normalise();
}
function setGroup(g,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const inG=MODULES.filter(m=>m.g===g), outG=MODULES.filter(m=>m.g!==g);
  const gt=inG.reduce((s,m)=>s+S.a[m.id],0), ot=outG.reduce((s,m)=>s+S.a[m.id],0);
  inG.forEach(m=>{S.a[m.id]= gt>0 ? r10(S.a[m.id]*v/gt) : r10(v/inG.length);});
  outG.forEach(m=>{S.a[m.id]= ot>0 ? r10(S.a[m.id]*(TOTAL-v)/ot) : r10((TOTAL-v)/outG.length);});
  normalise();
}

   compute() clamps safety, inclusion and culture at 100, so strong splits read "100–100". Here they become a

  const f=w=>{let t=0;for(const k in w)t+=(k==="shade"?sMid:a[k])*w[k];return t;};return {safety:f(W.safety),incl:f(W.incl),culture:f(W.culture)};}

function bindCommon(ctx,extra){
  document.addEventListener("click",e=>{
    const b=e.target.closest("button,[data-close],[data-hot],[data-quest]"); if(!b) return;
    if(extra&&extra(b,e)) return;
    const d=b.dataset;
    if(d.close){closeDrawer();return;}
    if(d.src){openDrawer(d.src,d.pg,d.claim);return;}
    if(b.id==="lZh"||b.id==="lEn"){S.lang=b.id==="lZh"?"zh":"en";store.set("cav_lang",S.lang);ctx.render();return;}
    if(b.id==="themeBtn"){toggleTheme();ctx.render();return;}
    if(d.preset){S.a={...PRESETS[d.preset].a};syncSliders(null);ctx.live();return;}
    if(d.plant){S.plant=d.plant;document.querySelectorAll("[data-plant]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.plant===S.plant));ctx.live();return;}
    if(d.year){S.year=+d.year;document.querySelectorAll("[data-year]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.year===S.year));ctx.live();return;}
    if(d.role){S.role=d.role;ctx.render();return;}
    if(d.pri){const i=S.pri.indexOf(d.pri);if(i>=0)S.pri.splice(i,1);else if(S.pri.length<3)S.pri.push(d.pri);ctx.render();return;}
    if(d.react){S.react[d.react]=S.react[d.react]===d.v?null:d.v;document.querySelectorAll(`[data-react="${d.react}"]`).forEach(x=>x.setAttribute("aria-pressed",S.react[d.react]===x.dataset.v));return;}
    if(b.id==="submit"){submitDemo();ctx.render();return;}
    if(b.id==="clearSubs"){store.set("cav_subs",[]);ctx.render();return;}
  });
  let raf=0;
  document.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.mod||t.dataset.grp){ // linked sliders: update in place so the drag continues
      if(t.dataset.mod) setModule(t.dataset.mod,+t.value); else setGroup(t.dataset.grp,+t.value);
      syncSliders(t); cancelAnimationFrame(raf); raf=requestAnimationFrame(ctx.live); return;}
    if(t.id==="exp"){S.exp=t.value;return;}
    if(t.id==="wish"){S.wish=t.value;return;}
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
  if(window.matchMedia){try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!S.theme)ctx.render();});}catch(e){}}
}

/* tween the map's viewBox */
function tweenVB(svg,to,ms=650,onF){if(!svg)return;const from=svg.getAttribute("viewBox").split(" ").map(Number);if(svg._raf)cancelAnimationFrame(svg._raf);
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;if(reduce){svg.setAttribute("viewBox",to.join(" "));onF&&onF();return;}
  const t0=performance.now();const step=t=>{const u=Math.min(1,(t-t0)/ms),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;svg.setAttribute("viewBox",from.map((f,i)=>(f+(to[i]-f)*e).toFixed(1)).join(" "));onF&&onF();if(u<1)svg._raf=requestAnimationFrame(step);};svg._raf=requestAnimationFrame(step);}


/* ===== variants/iso.js: 2.5D isometric plaza for option D =====
   The square is 48 tiles of 25 m² (8 west→east × 6 north→south). Tiles are handed to uses in proportion to
   S.a, filled column by column from the west, so trees sit at the back and walking + kerb face Wentworth St.
   Edges after S2 p.45 / p.43 and S4 (one-way southbound). Indicative only, not a layout design. */
const ISO={C:8,R:6,HW:36,HH:18};
const ISO_ORDER=["canopy","blue","culture","rest","events","smart","circ","bike","walk","kerb"];
const ip=(c,r,z=0)=>[(c-r)*ISO.HW,(c+r)*ISO.HH-z];
const P=a=>a.map(p=>p.map(v=>+v.toFixed(1)).join(",")).join(" ");
function tileMap(a){
  const n=ISO.C*ISO.R, raw=ISO_ORDER.map(id=>a[id]/TOTAL*n), fl=raw.map(Math.floor);
  let rem=n-fl.reduce((s,v)=>s+v,0);
  raw.map((v,i)=>[v-fl[i],i]).sort((x,y)=>y[0]-x[0]).slice(0,rem).forEach(([,i])=>fl[i]++);
  const out=[]; ISO_ORDER.forEach((id,i)=>{for(let k=0;k<fl[i];k++)out.push(id);}); return out;
}
const tileCR=t=>[Math.floor(t/ISO.R),t%ISO.R];
/* a box in world tile units */
function isoBox(c0,r0,c1,r1,z0,h,top,south,east,extra=""){
  const T=[ip(c0,r0,z0+h),ip(c1,r0,z0+h),ip(c1,r1,z0+h),ip(c0,r1,z0+h)];
  const Sf=[ip(c0,r1,z0),ip(c1,r1,z0),ip(c1,r1,z0+h),ip(c0,r1,z0+h)];
  const Ef=[ip(c1,r0,z0),ip(c1,r1,z0),ip(c1,r1,z0+h),ip(c1,r0,z0+h)];
  return `<polygon points="${P(Sf)}" fill="${south}"/><polygon points="${P(Ef)}" fill="${east}"/><polygon points="${P(T)}" fill="${top}"/>${extra}`;
}
/* local box around a tile centre, offsets in tile units */
function lbox(x0,y0,x1,y1,z0,h,top,s,e){const L=(dc,dr,z)=>[(dc-dr)*ISO.HW,(dc+dr)*ISO.HH-z];

  else if(id==="carbon"){const unit=20,a=Math.round(lo/unit),b=Math.min(18,Math.round(hi/unit));for(let i=0;i<b;i++){const x=8+(i%6)*23,y=14+Math.floor(i/6)*24;g+=`<path d="M${x} ${y+12}h16a5 5 0 0 0-1-10 7 7 0 0 0-13 1 5 5 0 0 0-2 9z" fill="${opt.grey?"#8e9bab":"#7d8794"}" opacity="${i<a?1:.3}"/>`;}}
  return `<svg class="pic" viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`;
}
const PIC_UNIT={shade:L=>L("1 格 = 25 m²","1 cell = 25 m²"),storm:L=>L("水位 = 低–高","Level = low–high"),econ:L=>L("1 人形 = 25 人","1 figure = 25 people"),access:L=>L("路带宽 = 畅通比例","Band = clear share"),safety:L=>L("相对指数，方案 0 = 50","Index, Scenario 0 = 50"),incl:L=>L("相对指数，方案 0 = 50","Index, Scenario 0 = 50"),culture:L=>L("相对指数，方案 0 = 50","Index, Scenario 0 = 50"),cost:L=>L("1 块 = $25 万（下排建设，上排维护）","1 block = $250k (build below, upkeep above)"),carbon:L=>L("1 朵 = 20 t CO₂e","1 cloud = 20 t CO₂e")};


/* ===== C · Map-first ===== */
let VBC=[-215,-120,400,330], ZF=1, SEL="square", PTAB="alloc";
const BBOX={x0:-125,x1:75,y0:-68,y1:142}; // the five hotspots and their labels, in map units
function fitView(){ // frame the hotspots inside the free area between the floating panels
  const mb=document.getElementById("mapbox").getBoundingClientRect(); if(!mb.width) return VBC;
  let l=0,r=mb.width,t=0,b=mb.height;
  if(!matchMedia("(max-width:1099px)").matches){const pr=document.getElementById("panel").getBoundingClientRect(),rr=document.querySelector(".right").getBoundingClientRect();l=pr.right-mb.left+16;r=rr.left-mb.left-16;t=40;b=mb.height-40;}
  else{l=12;r=mb.width-52;t=12;b=mb.height-12;}
  const k=Math.min((r-l)/(BBOX.x1-BBOX.x0),(b-t)/(BBOX.y1-BBOX.y0))*ZF, cx=(BBOX.x0+BBOX.x1)/2, cy=(BBOX.y0+BBOX.y1)/2;
  return [cx-(l+r)/2/k, cy-(t+b)/2/k, mb.width/k, mb.height/k].map(v=>+v.toFixed(1));
}
const HL={square:"square",china:"china",went:"traffic",fitz:"traffic",park:"council"};
const CARD_OF={square:"square",china:"china",went:"traffic",fitz:"traffic",park:"traffic"};

  document.getElementById("legend").innerHTML=`<span><i class="sw" style="border:1.5px dashed var(--fg)"></i>${L("第一期范围","Phase 1 area")}</span><span><i class="sw" style="background:var(--infer)"></i>${L("车站停车场（Council 用地）","Station car park (Council land)")}</span><span><i class="sw" style="background:linear-gradient(90deg,#4f9a5b,#d08a2c,#8a63b8,#3f7cc0)"></i>${L("广场：大致位置，颜色是你的分法","Square: approximate, coloured by your split")}</span><span>${L("底图 OSM 2026-11-10","Base map OSM 10 Nov 2026")}</span>`;
}
function drawMap(){
  VBC=fitView();
  document.getElementById("mapbox").innerHTML=mapSVG2({vb:VBC,hl:HL[SEL],alloc:true,hots:true,sel:SEL,slice:true,noChrome:true});
  fitLabels();
}
function svgEl(){return document.querySelector("#mapbox svg");}
function fitLabels(){ // keep text and hotspots a constant screen size whatever the zoom
  const svg=svgEl(); if(!svg) return; const m=svg.getScreenCTM(); if(!m) return; const k=m.a||1;
  svg.querySelectorAll("text.lab").forEach(t=>{const b=+(t.dataset.fs||(t.dataset.fs=t.getAttribute("font-size")));t.style.fontSize=(b*1.15/k)+"px";t.style.strokeWidth=(3/k)+"px";});
  svg.querySelectorAll(".hs").forEach(h=>h.setAttribute("transform",`scale(${1/k})`));
}
function evidence(){
  const h=HOTS.find(x=>x.id===SEL), i=HOTS.indexOf(h), cid=CARD_OF[SEL], card=CARDS.find(c=>c.id===cid);
  return `<div class="chips" role="group" aria-label="${L("地点","Places")}">${HOTS.map((x,j)=>`<button data-hot="${x.id}" aria-pressed="${x.id===SEL}"><i>${j+1}</i>${T(x)}</button>`).join("")}</div>
   <div class="eyebrow">${L("证据卡","Evidence card")} · ${T(card)} ${chip(card.src,"")}</div>
   <h2><span class="no">${i+1}</span>${T(h)}</h2>
   <p class="small" style="background:var(--surface-2);border-radius:8px;padding:6px 8px">${T(card.intro[S.role])} <span class="tag t-design">${L("团队预写","Team-written")}</span></p>
   ${SEL==="square"?`<div id="plazaBox">${plazaSVG2()}</div>${plazaCaption()}`:""}
   ${(SEL==="went"||SEL==="fitz")?`<div class="wait"><b>${L("交通影响：","Traffic effects: ")}</b>${L("等待 Council 交通研究。还没有交通模型，FY27/28 才聘顾问。","awaits Council traffic study. There is no traffic model yet; consultants come in FY27/28.")} ${chip("S4","","tr6")}</div>`:""}
   ${claimsById(h.claims)}${reactRow(cid)}`;
}
function panel(){
  const tabs=[["alloc",L("分配广场","Share")],["res",L("9 项结果","Results")],["say",L("你的意见","Your say")]];
  let body="";
  if(PTAB==="alloc") body=`<div><div class="lbl">${L("你会怎么分这 1,200 m²？","How would you share 1,200 m²?")}</div><p class="small muted" style="margin:4px 0 0">${L("拉高一项，其他几项按比例让出。","Raise one and the others give way.")}</p></div>
    ${presetButtons()}<p class="small muted" style="margin:-4px 0 0">${L("方案 0 是我们对总规的解读","Scenario 0 is our reading of the plan")} ${chip("S2","p.45","sq2")} ${ASSUME()}</p>
    ${allocBar()}${groupCards()}${moduleRows()}
    <div><div class="lbl">${L("种树方式 · 年份","Planting · year")}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${plantButtons()}${yearButtons()}</div><p class="small muted" style="margin:6px 0 0">${L("深土是否可行待核实","Deep soil is unconfirmed")} ${chip("S2","p.49","tr8")}</p></div>`;
  else if(PTAB==="res"){const r=resultsRows();body=`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><div><div class="lbl">${L("和方案 0 比","Against Scenario 0")}</div>${ASSUME()}</div><div style="text-align:right"><div class="fit ${r.fit>0?"delta-up":r.fit<0?"delta-down":""}">${r.fit>0?"+":""}${r.fit}%</div><div class="small muted">${L("优先项契合度","Priority fit")}</div></div></div>
    <div><div class="lbl" style="margin-bottom:4px">${L("我是","I am")}</div><div class="pill">${ROLES.map(x=>`<button data-role="${x.id}" aria-pressed="${S.role===x.id}">${T(x)}</button>`).join("")}</div></div>
    <div><div class="lbl" style="margin-bottom:4px">${L("最在乎的 3 项","Top 3")} · ${S.pri.length}/3</div><div class="pill">${DIMS.map(d=>`<button data-pri="${d.id}" aria-pressed="${S.pri.includes(d.id)}">${T(d)}</button>`).join("")}</div></div>
    <div id="resRows">${resultsKey()}${r.rows}</div>`;}
  else body=`<div id="dpaBox">${dpaCards()}</div>${feedbackHTML()}`;
  return `<div class="ptabs" role="tablist">${tabs.map(([k,t])=>`<button role="tab" data-ptab="${k}" aria-selected="${PTAB===k}">${t}</button>`).join("")}</div><div class="pbody">${body}</div>`;
}
function councilDrawer(){
  document.getElementById("drawerHost").innerHTML=`<div class="scrim" data-close="1"></div><aside class="drawer wide" role="dialog" aria-modal="true" aria-label="Council">

}

  const g=document.getElementById("sqg"); if(g) g.innerHTML=sqInner({alloc:true,hl:HL[SEL]});

  const pb=document.getElementById("plazaBox"); if(pb) pb.innerHTML=plazaSVG2();

function select(id){SEL=id;drawMap();document.getElementById("ev").innerHTML=evidence();document.getElementById("ev").scrollTop=0;
  if(matchMedia("(max-width:1099px)").matches) document.getElementById("ev").scrollIntoView({behavior:"smooth",block:"start"});}
function zoom(f){
  ZF=f==="reset"?1:Math.max(.5,Math.min(3,ZF/f));
  VBC=fitView(); tweenVB(svgEl(),VBC,350,fitLabels);
}
bindCommon({render,live},b=>{
  const d=b.dataset;
  if(d.hot){select(d.hot);return true;}
  if(d.ptab){PTAB=d.ptab;document.getElementById("panel").innerHTML=panel();return true;}
  if(d.zoom){zoom(d.zoom==="in"?0.75:d.zoom==="out"?1.33:"reset");return true;}
  if(b.id==="councilBtn"){councilDrawer();return true;}
  if(d.role||d.pri){ // keep the panel tab; refresh evidence intro too
    if(d.role)S.role=d.role; else {const i=S.pri.indexOf(d.pri);if(i>=0)S.pri.splice(i,1);else if(S.pri.length<3)S.pri.push(d.pri);}
    document.getElementById("panel").innerHTML=panel();document.getElementById("ev").innerHTML=evidence();return true;}
  if(b.id==="submit"){submitDemo();document.getElementById("panel").innerHTML=panel();return true;}
  return false;
});
document.addEventListener("keydown",e=>{const h=e.target.closest&&e.target.closest("[data-hot]");if(h&&(e.key==="Enter"||e.key===" ")){e.preventDefault();select(h.dataset.hot);}});
let rz=0; window.addEventListener("resize",()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{const sv=svgEl();if(sv){VBC=fitView();sv.setAttribute("viewBox",VBC.join(" "));fitLabels();}});});
render();
