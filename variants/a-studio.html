<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicAlign Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/*__BASE_CSS__*/
/* Layout (A+B · Studio story): navy header with three big tabs. The resident tab scrolls like a story
   (hero → sticky map that reframes per step → the plan → Council's path) and lands in a 2.5D game-style
   studio: linked sliders left, an isometric Woodhouse Square right, pictogram KPIs and pictogram results. */
:root{--sky-a:#dff0f7;--sky-b:#eef5e9;--sky-fg:#13202e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky-a:#18304a;--sky-b:#1d2d2a;--sky-fg:#e4ebf3}}
:root[data-theme="dark"]{--sky-a:#18304a;--sky-b:#1d2d2a;--sky-fg:#e4ebf3}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--chrome)}
.top{background:var(--chrome);color:var(--chrome-fg)}
.top .wrap{padding-block:14px 0}
.brandrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 280px;min-width:0}
.brand>div{min-width:0}
.mark{flex:0 0 40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3fae8c,#2c6fb4);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;letter-spacing:-.02em}
.brand b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.15}
.brand span{font-size:12.5px;color:var(--chrome-mut);display:block}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
.tab{border:0;border-radius:12px 12px 0 0;background:var(--chrome-2);color:var(--chrome-mut);padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}
.tab .tn{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-family:var(--f-mono);font-size:13px}
.tab b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.2;color:var(--chrome-fg)}
.tab small{display:block;font-size:12px;line-height:1.3}
.tab[aria-selected="true"]{background:var(--chrome-3);color:#8fe0c4}
@media (max-width:640px){.tab{padding:10px 8px;flex-direction:column;align-items:flex-start;gap:4px}.tab small{display:none}.tab b{font-size:13.5px}.tab .tn{width:24px;height:24px;flex-basis:24px;font-size:11.5px}}
/* sticky chapter bar */
.chapbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome-3);color:var(--chrome-fg)}
.chapbar .wrap{display:flex;gap:4px;align-items:center;padding-block:6px;overflow-x:auto;scrollbar-width:none}
.chapbar a{color:var(--chrome-mut);text-decoration:none;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chapbar a.on{background:#8fe0c4;color:#0e1c33;font-weight:600}
.prog{position:absolute;left:0;bottom:0;height:3px;background:#3fae8c;width:0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-size:21px}
/* hero: one slim strip */
.hero{background:var(--chrome);color:var(--chrome-fg)}
.hero .wrap{padding-block:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px 24px;flex-wrap:wrap}
.hero h1{font-size:clamp(24px,3.4vw,36px);line-height:1.1;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:#8fe0c4}
.hero .eyebrow{color:#8fe0c4;margin-bottom:6px}
.hero p.lede{color:var(--chrome-mut);font-size:15.5px;max-width:60ch;margin-top:6px}
.hero .go{text-decoration:none;flex:none}
/* background: map on the left, three plain cards on the right, all on one screen */
.scrolly{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;padding-block:24px 8px;align-items:stretch}
.mapwrap{position:relative;height:min(64vh,580px);min-height:400px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
.mapwrap .key{position:absolute;left:10px;bottom:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:8px;padding:6px 10px}
.mapwrap .basemap{height:calc(100% - 40px)}
.mapwrap .mscale,.mapwrap .mnorth{position:absolute;top:10px;display:flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);color:var(--fg);background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:8px;padding:6px 8px;pointer-events:none}
.mapwrap .mscale{left:10px}
.mapwrap .mscale i{display:block;height:5px;border:1.5px solid var(--fg);border-top:0}
.mapwrap .mnorth{right:10px}
.mapwrap .hl,.mapwrap #sqg{transition:opacity .35s}
.mapwrap[data-step="phase"] #sqg,.mapwrap[data-step="phase"] .hl[data-k="council"]{opacity:0!important} /* step 1: no colour yet */
.mapwrap[data-step="phase"] .key .k-plot{display:none}
.mapwrap .lab-plan{transition:opacity .35s}
.mapwrap[data-step="phase"] .lab-plan{opacity:0}
.mapwrap[data-step="square"] .hl[data-k="council"]{opacity:1!important} /* step 3: the square and both plots */
.mapwrap .pks,.mapwrap .key .pkkey{display:none}
.mapwrap.showpk .pks{display:inline}
.mapwrap.showpk .key .pkkey{display:inline}
.steps{display:flex;flex-direction:column;gap:10px;min-width:0}
.step{cursor:pointer}
.step .card{border:2px solid transparent;transition:border-color .2s,box-shadow .2s;padding:14px 16px}
.step.on .card{border-color:var(--accent);box-shadow:var(--shadow)}
.step h3{font-size:19px;margin:0 0 6px}
.step h3 button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px}
.step h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.step .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:999px;background:var(--accent);color:#fff;font:700 13px/1 var(--f-mono);flex:none}
.step p{margin:0}
.step .note{margin-top:4px}
.pkl{margin:2px 0 0;border:0;padding:0 4px}
/* numbered items from Council's site plan (S2 p.7) */
.pkn{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;margin-right:6px;border-radius:999px;border:1.5px solid var(--fg);background:var(--surface);color:var(--fg);font:700 11px/1 var(--f-mono);vertical-align:middle}
.pkn.pkt{background:#f39a2b;border-color:#f39a2b;color:#fff}
.pkl summary{cursor:pointer;font-weight:600;font-size:14px}
.pkl ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:13.5px}
.pkl li.pkg{margin-top:6px;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pkl li.pkg:first-child{margin-top:0}
.mapwrap .key .pkn{width:18px;height:18px;min-width:18px;font-size:10px}
@media (max-width:820px){
  .scrolly{grid-template-columns:1fr;gap:12px}
  .mapwrap{height:44vh;min-height:260px}
}
/* six priorities, 100 points */
.p6-total{display:flex;justify-content:space-between;align-items:center;background:var(--chrome);color:var(--chrome-fg);border-radius:12px;padding:12px 16px;font-size:14px}
.p6-total b{font:700 26px/1 var(--f-display)}
.p6r{margin-top:12px}
.p6r label{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14.5px}
.p6r output{font-family:var(--f-mono);color:var(--accent)}
.p6m{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font-weight:700;font-size:14.5px}
.p6m select{font:inherit;font-weight:500;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.p6mix{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;font-size:13px}
.p6mix li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0}
.p6mix li span:last-child{font-family:var(--f-mono)}
.rolepick{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rolepick label{display:grid;gap:2px}
.rolepick select{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:200px}
/* what the plan says: three cards, the chosen one opens a picture */
.pvtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pvtab{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:2px solid transparent;border-radius:14px;padding:14px 16px;display:grid;gap:4px;box-shadow:var(--shadow)}
.pvtab:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pvtab b{font:700 17px/1.25 var(--f-display);display:flex;gap:8px;align-items:baseline}
.pvtab b .num{font-family:var(--f-mono);color:var(--accent);font-size:13px}
.pvtab span{font-size:14.5px;color:var(--muted)}
.pvtab small{color:var(--accent);font-weight:600;font-size:13px;margin-top:2px}
a.pvtab{text-decoration:none;color:inherit}
a.pvtab:hover{border-color:var(--accent)}
@media (max-width:900px){.pvtabs{grid-template-columns:1fr}}
.planfold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px}
.planfold>summary::-webkit-details-marker{display:none}
.planfold>summary b{display:block;font:700 clamp(20px,2.6vw,28px)/1.2 var(--f-display);margin-top:4px}
.planfold .pf-hint{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600}
.planfold .pf-hint::after{content:" ▾"}
.planfold[open] .pf-hint::after{content:" ▴"}
.planfold .pvtabs{margin-top:16px}
/* item pages */
.dpage{padding-block:22px 48px;max-width:1080px}
.dback{display:inline-block;margin-bottom:14px;font-weight:600;color:var(--accent);text-decoration:none}
.dpage h1{font:700 clamp(28px,4.6vw,46px)/1.08 var(--f-display);letter-spacing:-.02em;margin:4px 0 8px}
.dlede{font-size:17px;color:var(--muted);max-width:60ch;margin:0 0 16px}
.dstage .scene{max-width:860px;margin-inline:auto}
.dh{font-size:21px;margin:26px 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drole{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.drole .card{display:grid;gap:2px;align-content:start}
.drole b{font:700 16px/1.2 var(--f-display)}
.drole small{color:var(--muted);font-size:12.5px}
.drole p{margin:8px 0 0;font-size:15px}
.dtwo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.dtwo h3{font-size:16.5px;margin:0 0 6px}
.dall{margin-top:12px}
.dall summary{cursor:pointer;color:var(--accent);font-weight:600}
.dnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:26px}
.dnav a{text-decoration:none}
@media (max-width:900px){.drole{grid-template-columns:1fr 1fr}.dtwo{grid-template-columns:1fr}}
/* each chapter has its own tint, edge to edge */
#c-plan,#c-path,#c-try,#c-res,#c-say{background:var(--tint);box-shadow:0 0 0 100vmax var(--tint);clip-path:inset(0 -100vmax);padding-bottom:36px}
#c-plan{--tint:color-mix(in srgb,#d08a2c 10%,var(--bg))}
#c-path{--tint:color-mix(in srgb,#3f7cc0 10%,var(--bg))}
#c-try{--tint:color-mix(in srgb,#4f9a5b 11%,var(--bg))}
#c-res{--tint:color-mix(in srgb,#4f9a5b 11%,var(--bg));padding-top:8px}
#c-say{--tint:color-mix(in srgb,#8a63b8 10%,var(--bg))}
/* chapters */
.ch{padding-block:40px 8px}
.ch-h{max-width:760px;margin-bottom:18px}
.ch-h .eyebrow{margin-bottom:6px}
.ch-h h2{font-size:clamp(24px,3.4vw,34px);line-height:1.15;letter-spacing:-.01em}
.ch-h p{color:var(--muted);margin-top:8px;font-size:15.5px}
/* persona banner */
.persona{background:linear-gradient(120deg,var(--chrome-2),var(--chrome-3));color:var(--chrome-fg);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:18px;align-items:start;margin-bottom:14px}
@media (max-width:820px){.persona{grid-template-columns:1fr}}
.persona .eyebrow{color:#8fe0c4}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.roles button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--chrome-fg);border-radius:999px;padding:5px 12px;font-size:13.5px}
.roles button[aria-pressed="true"]{background:#eaf0f9;color:#0e1c33;border-color:#eaf0f9;font-weight:600}
.pris{display:flex;flex-wrap:wrap;gap:5px}
.pris button{border:1px dashed rgba(255,255,255,.3);background:transparent;color:var(--chrome-mut);border-radius:6px;padding:2px 8px;font-size:12px}
.pris button[aria-pressed="true"]{border-style:solid;border-color:#8fe0c4;color:#8fe0c4}
.trans{display:grid;gap:10px}
.trans .big{font-family:var(--f-display);font-size:clamp(18px,2.2vw,22px);line-height:1.35;margin:4px 0 0;text-wrap:pretty}
.trans .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.trans .row{grid-template-columns:1fr}}
.trans .mini{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 10px;font-size:13.5px}
.trans .mini b{display:block;font-size:12px;color:var(--chrome-mut);font-weight:500}
.persona .tag{background:rgba(255,255,255,.12);color:var(--chrome-fg)}
.deliv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.deliv{grid-template-columns:1fr}}
.dv h3{font-size:16.5px;display:flex;gap:8px;align-items:baseline}
.dv .num{font-family:var(--f-mono);color:var(--accent);font-size:13px}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.dv details{margin-top:6px}
.dv summary{cursor:pointer;font-size:13.5px;color:var(--accent);font-weight:500}
/* decision path (from B) */
.tl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;position:relative;margin:8px 0 18px;padding:0}
.tl::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line)}
.tl li{list-style:none;position:relative;padding:26px 10px 0 0;font-size:13.5px;line-height:1.45}
.tl li::before{content:"";position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl li.dec::before{background:var(--accent)}
.tl .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:block}
@media (max-width:900px){.tl{grid-template-columns:1fr}.tl::before{left:7px;right:auto;top:0;bottom:0;width:2px;height:auto}.tl li{padding:0 0 12px 28px}.tl li::before{top:3px}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.split .yours{border:2px solid var(--accent);background:var(--accent-soft)}
.split h3{font-size:17px;margin-bottom:6px}
/* studio + 2.5D stage */
.studio{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.5fr);gap:16px;align-items:start}
@media (max-width:960px){.studio{grid-template-columns:1fr}}
.ctrl{display:grid;gap:12px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.viz{position:sticky;top:52px;display:grid;gap:10px}
@media (max-width:960px){.viz{display:contents}#vizArt{order:-1;position:sticky;top:38px;z-index:6}#kpiBox{order:1}.stage-foot p{display:none}.hud{padding:6px 8px 0}.hud-t .tag{display:none}}
.stage{border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--sky-a),var(--sky-b));border:1px solid var(--line);box-shadow:var(--shadow);position:relative;transition:background .6s}
.stage.nightmode{--sky-a:#0b1633;--sky-b:#1b2a4f;--sky-fg:#e4ebf3}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px 0}
.hud-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.hud-t b{font-family:var(--f-display);font-size:16px;color:var(--sky-fg)}
.hud-c{display:flex;gap:6px;flex-wrap:wrap}
.hud .pill button{background:color-mix(in srgb,var(--surface) 80%,transparent);font-size:12.5px;padding:3px 10px}
.hud .pill button[aria-pressed="true"]{background:var(--chrome);border-color:var(--chrome);color:#fff}
.stage.nightmode .hud .pill button[aria-pressed="true"]{background:#ffcd3c;border-color:#ffcd3c;color:#2a1d00}
svg.iso #glows{mix-blend-mode:screen;pointer-events:none}
.scene{padding:0 4px}
svg.iso{width:100%;height:auto;display:block}
svg.iso text{font-family:var(--f-body)}
svg.iso .elab{font-size:12px;font-weight:700;fill:#13202e;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:3.5px;stroke-linejoin:round}
svg.iso .win{fill:rgba(255,255,255,.35);transition:fill .6s}
svg.iso.night .win{fill:#ffe39a}
svg.iso .glow{opacity:0;transition:opacity .6s}
svg.iso.night .glow{opacity:1}
svg.iso #nightVeil{transition:opacity .6s;pointer-events:none}
svg.iso .crown{transform-box:fill-box;transform-origin:50% 100%;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
svg.iso .shd{transform-box:fill-box;transform-origin:50% 50%;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
svg.iso .pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:translateY(-16px) scale(.5);opacity:0}to{transform:none;opacity:1}}
svg.iso .quest{cursor:pointer;outline:none}
svg.iso .quest:focus-visible path{stroke:#fff;stroke-width:3}
svg.iso .bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
svg.iso .plate{filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.stage-foot{padding:0 12px 10px;display:grid;gap:6px}
.stage-foot p{margin:0;color:var(--sky-fg);opacity:.85}
.kp4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.kp4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpic .kv{font-size:17px}.kpic{padding:10px}}
.kpic .pic{width:100%;height:auto;max-height:80px;margin:6px 0 2px}
.kpic .kv{font-size:21px}
.fit{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.pgrid{grid-template-columns:1fr}}
.resbars .res{grid-template-columns:170px minmax(0,1fr) 200px}
@media (max-width:640px){.resbars .res{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.enter .resbars .res{animation:rise .45s both}.enter .resbars .res:nth-child(n){animation-delay:calc(var(--n,0)*50ms)}}
.pcard{border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;background:var(--surface);position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--kc)}
.pcard.pri{border-color:var(--kc);box-shadow:0 0 0 2px color-mix(in srgb,var(--kc) 30%,transparent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.pair figure{margin:0;text-align:center}
.pair .pic{width:100%;height:auto}
.pair figcaption{font-size:12px;color:var(--muted);line-height:1.35}
.pair figcaption b{color:var(--fg)}
.pair figcaption span{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.enter .pcard{animation:rise .5s both;animation-delay:calc(var(--i)*60ms)}@keyframes rise{from{transform:translateY(12px)}}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.dpa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

 {k:"phase",n:"1",h:L("这是哪里","Where is it"),

/* ---------- story part (from B) ---------- */
function hero(){return `<section class="hero"><div class="wrap">

  <a class="btn primary go" href="#c-try">${L("直接去搭广场 ↓","Jump to the studio ↓")}</a></div></section>`;}
function scrolly(){return `<section class="wrap scrolly" id="c-map" aria-label="${L("背景","Background")}">
  <div class="mapwrap${pkOpen?" showpk":""}" id="mapwrap" data-step="${curStep}">${mapSVG2({vb:VB[curStep],hl:curStep,fade:true,noChrome:true})}
   <div class="mscale" id="mscale" aria-hidden="true"><i></i><span></span></div>
   <div class="mnorth" aria-hidden="true"><svg viewBox="-12 -12 24 24" width="18" height="18"><path d="M0 -9 4.5 4.5 0 1 -4.5 4.5z" fill="currentColor"/></svg>N</div>
   <div class="key"><span><i class="sw" style="border:1.5px dashed var(--fg)"></i>${L("第一期范围","Phase 1 area")}</span><span class="k-plot"><i class="sw" style="background:var(--accent)"></i>${L("新广场 Woodhouse Square","New square, Woodhouse Square")}</span><span class="k-plot"><i class="sw" style="background:var(--infer)"></i>${L("21 号地：停车场将被替换（Council 用地）","Sites 21: car park to be replaced (Council land)")}</span><span class="pkkey"><b class="pkn">13</b>${L("总规图上的编号","Number on Council's plan")}</span></div></div>
  <div class="steps">${STEPS().map(s=>`<div class="step ${s.k===curStep?"on":""}" data-step="${s.k}"><div class="card"><h3><button type="button" data-step="${s.k}" aria-pressed="${s.k===curStep}"><span class="n">${s.n}</span>${s.h}</button></h3>${s.b}</div></div>`).join("")}
   ${planList("phase").replace('<details class="pkl">',`<details class="pkl" id="pkl"${pkOpen?" open":""}>`)}</div>
 </section>`;}
/* scale bar: a fixed corner of the map frame, so it never covers the plan; its length follows the zoom */
function mapScale(){const sv=document.querySelector("#mapwrap svg"),el=document.getElementById("mscale");if(!sv||!el)return;
  const v=sv.getAttribute("viewBox").split(" ").map(Number),r=sv.getBoundingClientRect(),ppm=Math.min(r.width/v[2],r.height/v[3]);
  const m=[200,100,50,20,10].find(x=>x*ppm<=110)||10;
  el.firstElementChild.style.width=Math.round(m*ppm)+"px";el.lastElementChild.textContent=m+" m";
  // street names keep a readable size when the map zooms in, instead of growing with it
  const k=Math.pow(v[2]/VB.phase[2],.7);
  sv.querySelectorAll("text.lab").forEach(t=>{if(!t.dataset.fs)t.dataset.fs=t.getAttribute("font-size");t.setAttribute("font-size",(t.dataset.fs*k).toFixed(2));});}
/* show one background step on the map */
function setStep(k){
  curStep=k; document.getElementById("mapwrap").dataset.step=k;
  document.querySelectorAll(".step").forEach(s=>{const on=s.dataset.step===k;s.classList.toggle("on",on);const b=s.querySelector("button[data-step]");if(b)b.setAttribute("aria-pressed",on);});
  const sv=document.querySelector("#mapwrap svg");setMapHL(sv,k);tweenVB(sv,VB[k],650,mapScale);
  const sq=document.querySelector("#mapwrap #sqg"); if(sq) sq.innerHTML=sqInner({hl:k});
}

const PV_TITLE=()=>({square:L("建设新市民广场","Build a new city square"),china:L("打造唐人街夜生活目的地","Create a Chinatown nightlife destination"),traffic:L("为行人改造街道","Change the streets for people on foot")});

const P6_SETS={base:{market:25,access:20,shade:18,seat:15,light:12,flex:10},green:{market:15,access:15,shade:40,seat:15,light:8,flex:7},night:{market:42,access:14,shade:10,seat:8,light:14,flex:12}};

  const raw={}; MODULES.forEach(m=>raw[m.id]=0);
  P6.forEach(p=>{const r=pts[p.id]/p.d;for(const k in P6_B[p.id])raw[k]+=r*P6_B[p.id][k];});
  const tot=sum(raw)||1, a={}; MODULES.forEach(m=>a[m.id]=r10(raw[m.id]*TOTAL/tot));
  let d=TOTAL-sum(a); const ids=MODULES.map(m=>m.id).sort((x,y)=>a[y]-a[x]);
  for(const id of ids){if(!d)break;const nv=Math.max(0,a[id]+d);d-=nv-a[id];a[id]=nv;}
  return a;
}
function setP6(id,v){
  v=Math.max(0,Math.min(100,Math.round(v)));
  const others=P6.filter(p=>p.id!==id), rest=others.reduce((s,p)=>s+S.p6[p.id],0), target=100-v;
  const exact=others.map(p=>rest>0?S.p6[p.id]*target/rest:target/others.length), fl=exact.map(Math.floor);
  let rem=target-fl.reduce((s,x)=>s+x,0);
  exact.map((x,i)=>[x-fl[i],i]).sort((x,y)=>y[0]-x[0]).slice(0,rem).forEach(([,i])=>fl[i]++);
  others.forEach((p,i)=>S.p6[p.id]=fl[i]); S.p6[id]=v;
  S.a=mixFromP6(S.p6);
}
