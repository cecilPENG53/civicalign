// crown spread multiplier on canopy area, by planting type and year [low, high]
const CROWN = {planter:{2026:[0.2,0.4],2036:[0.8,1.2],2041:[1.0,1.5],2050:[1.2,1.8]}, deep:{2026:[0.2,0.4],2036:[1.2,1.8],2041:[1.6,2.4],2050:[2.0,3.0]}};
// per m² [low, high]
const COEF = {
 restShade:[0.3,0.6],
 storm:{blue:[0.15,0.30],canopy_planter:[0.03,0.06],canopy_deep:[0.05,0.10]},
 econ:{events:[0.5,1.0],rest:[0.15,0.30],culture:[0.1,0.2]},
 walkClear:[0.85,1.0],
 capex:{canopy:[1500,3000],blue:[800,1500],events:[600,1200],culture:[1000,3000],rest:[800,2000],walk:[500,1000],bike:[400,800],kerb:[300,700],smart:[2000,5000],circ:[1000,2500]},
 opex:{canopy:[30,60],blue:[20,40],events:[10,20],culture:[15,40],rest:[15,30],walk:[5,10],bike:[5,10],kerb:[5,10],smart:[40,90],circ:[30,70]},
 carbon:{canopy:[0.10,0.20],blue:[0.05,0.10],events:[0.08,0.15],culture:[0.10,0.25],rest:[0.08,0.18],walk:[0.06,0.12],bike:[0.05,0.10],kerb:[0.08,0.15],smart:[0.15,0.30],circ:[0.08,0.15]}
};
const W = {safety:{events:0.06,smart:0.8,walk:0.05,culture:0.05},incl:{rest:0.25,walk:0.08,shade:0.03,bike:0.2},culture:{culture:0.3,events:0.06,rest:0.1}};

function compute(a, plant, year){
  const out={};
  const cr = CROWN[plant][year];
  const sh = [0,1].map(i=>Math.min(TOTAL, a.canopy*cr[i] + a.rest*COEF.restShade[i]));
  out.shade = sh;
  const cs = plant==="deep"?COEF.storm.canopy_deep:COEF.storm.canopy_planter;
  out.storm = [0,1].map(i=>a.blue*COEF.storm.blue[i] + a.canopy*cs[i]);
  out.econ = [0,1].map(i=>a.events*COEF.econ.events[i]+a.rest*COEF.econ.rest[i]+a.culture*COEF.econ.culture[i]);
  out.access = [0,1].map(i=>100*a.walk*COEF.walkClear[i]/TOTAL);
  const proxy=(w,extra)=>{let s=0;for(const k in w){s+= (k==="shade"?extra:a[k])*w[k];}return s;};
  const sMid=(sh[0]+sh[1])/2;
  out.safety = [0.85,1.15].map(f=>Math.min(100,proxy(W.safety)*f));
  out.incl = [0.85,1.15].map(f=>Math.min(100,proxy(W.incl,sMid)*f));
  out.culture = [0.85,1.15].map(f=>Math.min(100,proxy(W.culture)*f));
  const yrs = year-2026;
  out.cost = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*(COEF.capex[m.id][i]+COEF.opex[m.id][i]*yrs);}return c/1000;});
  out.carbon = [0,1].map(i=>{let c=0;for(const m of MODULES){c+=a[m.id]*COEF.carbon[m.id][i];}return c;});
  return out;
}

function mapSVG(){

  let g="";
  g+=MAP.G.filter(x=>inView(x.p)).map(x=>`<polygon points="${pts(x.p)}" fill="var(--map-green)"/>`).join("");
  g+=MAP.R.filter(x=>inView(x.p)).map(x=>`<polyline points="${pts(x.p)}" fill="none" stroke="var(--map-road-edge)" stroke-width="${x.w+2}" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  g+=MAP.R.filter(x=>inView(x.p)).map(x=>`<polyline points="${pts(x.p)}" fill="none" stroke="var(--map-road)" stroke-width="${x.w}" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  g+=MAP.RL.filter(inView).map(p=>`<polyline points="${pts(p)}" fill="none" stroke="var(--map-rail)" stroke-width="2" stroke-dasharray="6 3"/>`).join("");
  g+=MAP.B.filter(b=>inView(b.p)).map(b=>`<polygon points="${pts(b.p)}" fill="${/Carpark/.test(b.n||"")?"var(--infer)":"var(--map-bld)"}" ${/Carpark/.test(b.n||"")?'fill-opacity=".55"':''}/>`).join("");
  g+=`<polygon points="${pts(MAP.P)}" fill="none" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  // indicative square, between the car park and 9 Wentworth St, on the Wentworth St side
  g+=`<rect x="-14" y="44" width="30" height="40" rx="3" fill="var(--accent)" fill-opacity=".85"/><circle cx="1" cy="64" r="26" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  const lab=(t,x,y,anchor="middle",w=600)=>`<text x="${x}" y="${-y}" text-anchor="${anchor}" font-size="11" font-weight="${w}" fill="var(--fg)" paint-order="stroke" stroke="var(--surface-2)" stroke-width="3">${esc(t)}</text>`;
  g+=lab("Church St",-122,-40)+lab("Parkes St",70,-152)+lab("Wentworth St",52,-40)+lab("Fitzwilliam St",-55,62)+lab("Jubilee Park",80,-225,"middle",500)+lab("Woodhouse Sq",34,-92,"start",700);
  g+=lab(L("↑ 车站","↑ Station"),-40,175,"middle",500);
  return `<svg class="map" viewBox="-185 -200 440 530" role="img" aria-label="${L("CBD South 第一期范围底图","Base map of CBD South Phase 1")}">${g}</svg>`;

const GDESC={green:{zh:"降温、遮荫、留住雨水",en:"Cooling, shade, holding rain"},active:{zh:"唐人街夜市、活动、停留",en:"Night markets, events, places to stay"},move:{zh:"穿行、无障碍、接驳",en:"Getting through, access, drop-off"},smart:{zh:"夜间照明、回收",en:"Night lighting, recycling"}};
const r10=v=>Math.round(v/10)*10;
function normalise(){ // keep the total at exactly 1,200 m² after rounding
  let d=TOTAL-sum(S.a); if(!d) return;
  const ids=MODULES.map(m=>m.id).sort((x,y)=>S.a[y]-S.a[x]);
  for(const id of ids){ const nv=Math.max(0,S.a[id]+d); d-=nv-S.a[id]; S.a[id]=nv; if(!d) break; }
}
function setModule(id,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const others=MODULES.filter(m=>m.id!==id), rest=others.reduce((s,m)=>s+S.a[m.id],0), target=TOTAL-v;
  others.forEach(m=>{S.a[m.id]= rest>0 ? r10(S.a[m.id]*target/rest) : r10(target/others.length);});
  S.a[id]=v; normalise();
}
function setGroup(g,v){
  v=Math.max(0,Math.min(TOTAL,r10(v)));
  const inG=MODULES.filter(m=>m.g===g), outG=MODULES.filter(m=>m.g!==g);
  const gt=inG.reduce((s,m)=>s+S.a[m.id],0), ot=outG.reduce((s,m)=>s+S.a[m.id],0);
  inG.forEach(m=>{S.a[m.id]= gt>0 ? r10(S.a[m.id]*v/gt) : r10(v/inG.length);});
  outG.forEach(m=>{S.a[m.id]= ot>0 ? r10(S.a[m.id]*(TOTAL-v)/ot) : r10((TOTAL-v)/outG.length);});
  normalise();
}
const gsum=g=>MODULES.filter(m=>m.g===g).reduce((s,m)=>s+S.a[m.id],0);
const pct=v=>Math.round(100*v/TOTAL);

  g+=`<rect x="${X}" y="${Y+H+10}" width="${Wd}" height="22" rx="4" fill="var(--map-bld)"/><text x="${X+Wd/2}" y="${Y+H+25}" text-anchor="middle" font-size="10" fill="var(--fg)">${esc(L("南：Council 新楼（餐饮界面）","South: new Council building (active edge)"))}</text>`;
  g+=`<rect x="4" y="${Y}" width="44" height="${H}" rx="4" fill="var(--map-bld)"/><text transform="translate(30 ${Y+H/2}) rotate(-90)" text-anchor="middle" font-size="10" fill="var(--fg)">${esc(L("西：Council 新楼 · 文化空间","West: Council building · cultural space"))}</text>`;
  g+=`<rect x="${X+Wd+10}" y="${Y}" width="30" height="${H}" rx="4" fill="var(--map-road)" stroke="var(--map-road-edge)"/><text transform="translate(${X+Wd+29} ${Y+H/2}) rotate(90)" text-anchor="middle" font-size="10" font-weight="600" fill="var(--fg)">Wentworth St</text>`;
  g+=`<g fill="var(--fg)" opacity=".55">${[0,1,2,3,4].map(i=>`<rect x="${X+Wd+12+i*5.5}" y="${Y+H/2-34}" width="3" height="16"/>`).join("")}</g>`;
  g+=`<text x="${X+Wd+25}" y="${Y+H/2-40}" text-anchor="middle" font-size="8.5" fill="var(--muted)">${esc(L("新横道","crossing"))}</text>`;
  g+=`<path d="M4 ${Y+H/2-26} h44" stroke="var(--accent)" stroke-width="12" stroke-opacity=".25"/><text x="26" y="${Y+H/2-30}" text-anchor="middle" font-size="8.5" font-weight="600" fill="var(--accent)">Rivoli Way</text>`;

  const order=["green","active","smart","move"]; let x=X;
  order.forEach(gk=>{
    const gt=gsum(gk); if(!gt) return; const w=Wd*gt/TOTAL; let y=Y;
    MODULES.filter(m=>m.g===gk&&S.a[m.id]>0).forEach(m=>{
      const h=H*S.a[m.id]/gt, c=GROUPS[gk].c;

      const n=Math.max(1,Math.round(S.a[m.id]/25)), step=19;

    });
    x+=w;
  });
  return `<svg class="plaza" viewBox="0 0 360 248" role="img" aria-label="${L("广场用途示意图","Diagram of uses in the square")}">${g}</svg>

}

/* ---------- Screen 4 ---------- */
function s4(){
  const base=compute(PRESETS.base.a,"planter",S.year), you=compute(S.a,S.plant,S.year);
  let ws=0,acc=0;
  const rows=DIMS.map(d=>{
    const b=base[d.id], y=you[d.id];
    const max=Math.max(b[1],y[1],1)*1.1;
    const bm=(b[0]+b[1])/2, ym=(y[0]+y[1])/2;
    const raw=(ym-bm)/Math.max(Math.abs(bm),1);           // real change in the value
    let rel=d.better==="low"?-raw:raw; rel=Math.max(-1,Math.min(1,rel)); // good/bad, capped for the fit score only
    const w=S.pri.includes(d.id)?3:1; ws+=w; acc+=w*rel;
    const dec=d.id==="storm"?1:0;
    const pct=Math.round(raw*100), good=rel>0.005, bad=rel<-0.005;
    return `<div class="res"><div class="dn ${S.pri.includes(d.id)?"pri":""}">${T(d)}<small>${U(d)} · ${d.type==="proxy"?L("代理指标","Proxy score"):L("估算","Estimate")}${d.flag?` · <span class="tag t-gap">${L("待交通研究","Awaits traffic study")}</span>`:""}</small></div>
      <div class="track" aria-hidden="true"><span class="rng r0" style="left:${100*b[0]/max}%;width:${Math.max(1,100*(b[1]-b[0])/max)}%"></span><span class="rng r1" style="left:${100*y[0]/max}%;width:${Math.max(1,100*(y[1]-y[0])/max)}%"></span></div>
      <div class="vals"><span class="muted">${L("方案 0","Scen. 0")} ${fmt(b[0],dec)}–${fmt(b[1],dec)}</span><br><span class="y">${L("你的","Yours")} ${fmt(y[0],dec)}–${fmt(y[1],dec)}</span> <span class="${good?"delta-up":bad?"delta-down":"muted"}" title="${good?L("更好","Better"):bad?L("更差","Worse"):""}">${pct>0?"▲":pct<0?"▼":"="}${fmt(Math.abs(pct))}% ${good?L("更好","better"):bad?L("更差","worse"):""}</span></div></div>`;
  }).join("");
  const fit=Math.round(100*acc/ws);
  return `<div class="eyebrow">② ${L("换一种分法会怎样","What if it were shared differently")} · 4/5</div>
  <h1>${L("你的分法和总规原样比，会有什么不同？","How does your split compare with the plan as drawn?")}</h1>

  <div class="grid g3" style="margin-bottom:12px">
    <div class="card"><b class="small">${L("和你的 3 个优先项的契合度","Fit with your 3 priorities")}</b><div class="fit ${fit>0?"delta-up":fit<0?"delta-down":""}">${fit>0?"+":""}${fit}%</div><p class="small muted">${L("相对方案 0，★ 项权重 ×3。","Relative to Scenario 0; ★ items weigh ×3.")}</p></div>
    <div class="card"><b class="small">${L("看哪一年","Year")}</b><div class="choice" style="margin-top:6px">${[2026,2036,2041,2050].map(y=>`<button data-year="${y}" aria-pressed="${S.year===y}">${y}<small>${y===2041?L("总规 15 年期限","Plan's 15-year horizon"):y===2050?L("战略目标年","Strategy target year"):y===2026?L("刚建成","At opening"):"&nbsp;"}</small></button>`).join("")}</div><p class="small muted">${L("树冠随年份长大，维护费逐年累加","Tree crowns grow and upkeep adds up over time")} ${chip("S2","p.54")}</p></div>
    <div class="card"><b class="small">${L("种树方式","Planting")}</b><p style="margin:4px 0 0">${S.plant==="planter"?L("抬高种植池","Raised planters"):L("深土种植","Deep soil")}</p><p class="small muted">${L("方案 0 按种植池计算。深土是否可行待核实。","Scenario 0 assumes planters. Whether deep soil is possible is unconfirmed.")}</p></div>
  </div>
  <div class="card"><div class="keyrow"><span><i class="sw" style="background:var(--base)"></i>${L("方案 0：总规原样","Scenario 0: plan as drawn")}</span><span><i class="sw" style="background:var(--accent)"></i>${L("你的方案","Your split")}</span><span>★ ${L("你的优先项","Your priority")}</span></div>${rows}</div>
  <details><summary>${L("查看全部系数（90 个假设值）","See every coefficient (team assumptions)")}</summary>${coefTable()}</details>

function openDrawer(src,pg,cid){
  const c=CLAIMS.find(x=>x.id===cid); const s=SOURCES[src];
  document.getElementById("drawerHost").innerHTML=`<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${L("来源","Source")}">
   <button class="x" data-close="1">${L("关闭","Close")}</button><div class="eyebrow">${src}${pg?" · "+pg:""}</div><h2>${esc(T(s))}</h2>
   ${c?`<p>${esc(T(c))}</p>${c.q?`<blockquote lang="en">“${esc(c.q)}”</blockquote><p class="small muted">${L("原文（英文），","Original wording, ")}${src}${c.pg?" "+c.pg:""}</p>`:""}`:`<p class="muted">${L("这一段整体出自该来源。","This section as a whole comes from this source.")}</p>`}
   ${s.url?`<p><a href="${s.url}" target="_blank" rel="noopener">${L("打开原文件","Open the original")} ↗</a></p>`:`<p class="small muted">${L("团队持有的简报文件。","Brief held by the team.")}</p>`}
   <p class="small muted">${L("页码为 PDF 上印的页码。","Page numbers are those printed in the document.")}</p></aside>`;
  document.querySelector(".drawer .x").focus();
}
function closeDrawer(){document.getElementById("drawerHost").innerHTML="";}

function syncS3(active){
  MODULES.forEach(m=>{const r=document.getElementById("m_"+m.id); if(r&&r!==active) r.value=S.a[m.id]; const o=document.getElementById("o_"+m.id); if(o) o.textContent=fmt(S.a[m.id])+" m²";});
  for(const g in GROUPS){const r=document.getElementById("g_"+g); if(r&&r!==active) r.value=gsum(g); const v=document.getElementById("gv_"+g); if(v) v.textContent=pct(gsum(g))+"%"; const mm=document.getElementById("gm_"+g); if(mm) mm.textContent=fmt(gsum(g))+" m²";}
  const vz=document.getElementById("viz"); if(vz) vz.innerHTML=vizPanel();
}
/* ---------- Render & events ---------- */
function render(){
  chrome();
  const m=document.getElementById("main");
  m.innerHTML = S.view==="council"?council():[null,s1,s2,s3,s4,s5][S.step]();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]"); if(!b) return;
  const d=b.dataset;
  if(d.close){closeDrawer();return;}
  if(b.id==="lZh"||b.id==="lEn"){S.lang=b.id==="lZh"?"zh":"en";store.set("ca_lang",S.lang);render();return;}
  if(b.id==="vRes"){S.view="res";render();return;}
  if(b.id==="vCouncil"){S.view="council";render();return;}
  if(d.view){S.view=d.view;render();scrollTo(0,0);return;}
  if(d.step){S.step=+d.step;S.view="res";render();return;}
  if(d.go){S.step=+d.go;render();scrollTo(0,0);return;}
  if(d.src){openDrawer(d.src,d.pg,d.claim);return;}
  if(d.role){S.role=d.role;render();return;}
  if(d.pri){const i=S.pri.indexOf(d.pri);if(i>=0)S.pri.splice(i,1);else if(S.pri.length<3)S.pri.push(d.pri);render();return;}
  if(d.react){S.react[d.react]=S.react[d.react]===d.v?null:d.v;render();return;}
  if(d.preset){S.a={...PRESETS[d.preset].a};render();return;}
  if(d.plant){S.plant=d.plant;render();return;}
  if(d.year){S.year=+d.year;render();return;}
  if(d.ctab){S.ctab=d.ctab;render();return;}
  if(b.id==="submit"){const subs=store.get("ca_subs")||[];subs.push({t:Date.now(),role:S.role,age:S.age,pc:S.postcode,pri:S.pri,react:S.react,a:S.a,exp:S.exp,wish:S.wish});store.set("ca_subs",subs);render();return;}
  if(b.id==="clearSubs"){store.set("ca_subs",[]);render();return;}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.mod||t.dataset.grp){ // linked sliders: update in place so the drag continues
    if(t.dataset.mod) setModule(t.dataset.mod,+t.value); else setGroup(t.dataset.grp,+t.value);
    syncS3(t); return;}
  if(t.id==="pc"){S.postcode=t.value.replace(/\D/g,"").slice(0,4);return;}
  if(t.id==="exp"){S.exp=t.value;return;}
  if(t.id==="wish"){S.wish=t.value;return;}
  if(t.dataset.note){S.note[t.dataset.note]=t.value;return;}
});
document.addEventListener("change",e=>{if(e.target.id==="age"){S.age=e.target.value||null;}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
render();
</script>
